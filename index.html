<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070709">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KINETIC // Acoustic Field Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Obsidian Signal (Default) */
  --accent: #ff4d1a;
  --accent-dim: #bf320b;
  --accent-rgb: 255, 77, 26;
  --trace-sec: #f2f1ec;
  --trace-sec-rgb: 242, 241, 236;
  --surface-bg: #070709;
  --chassis-top: #17171b;
  --chassis-bot: #0f0f13;
  --pocket-bg: #0a0a0d;
  --key-top: #212128;
  --key-bot: #15151a;
  --oled-bg: #040406;
  --text-main: #f4f3ef;
  --text-muted: #82838e;
  --text-dim: #4c4d57;
  --border-subtle: rgba(255, 255, 255, 0.08);
  --ease-mech: cubic-bezier(0.2, 0.9, 0.3, 1);
}

:root.theme-yellow {
  /* Gold Horology */
  --accent: #f5a623;
  --accent-dim: #b87409;
  --accent-rgb: 245, 166, 35;
  --trace-sec: #fdf5e4;
  --trace-sec-rgb: 253, 245, 228;
  --surface-bg: #080705;
  --chassis-top: #191610;
  --chassis-bot: #100f0b;
  --pocket-bg: #0b0a07;
  --key-top: #231f17;
  --key-bot: #17140f;
}

:root.theme-blue {
  /* Deep Sonar */
  --accent: #22d3ee;
  --accent-dim: #0891b2;
  --accent-rgb: 34, 211, 238;
  --trace-sec: #e8f8ff;
  --trace-sec-rgb: 232, 248, 255;
  --surface-bg: #05080c;
  --chassis-top: #121820;
  --chassis-bot: #0b0f15;
  --pocket-bg: #080b10;
  --key-top: #1a222e;
  --key-bot: #11161f;
}

:root.theme-teal {
  /* Phosphor Lab */
  --accent: #10e8a2;
  --accent-dim: #059669;
  --accent-rgb: 16, 232, 162;
  --trace-sec: #e5fcf3;
  --trace-sec-rgb: 229, 252, 243;
  --surface-bg: #050908;
  --chassis-top: #121917;
  --chassis-bot: #0b100f;
  --pocket-bg: #080c0b;
  --key-top: #192420;
  --key-bot: #111815;
}

:root.theme-rose {
  /* Laser Monolith */
  --accent: #fb3765;
  --accent-dim: #be123c;
  --accent-rgb: 251, 55, 101;
  --trace-sec: #ffe8ee;
  --trace-sec-rgb: 255, 232, 238;
  --surface-bg: #090507;
  --chassis-top: #1b1316;
  --chassis-bot: #110c0e;
  --pocket-bg: #0c080a;
  --key-top: #261b1f;
  --key-bot: #181114;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  min-height: 100dvh;
  background-color: var(--surface-bg);
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--surface-bg);
  background-image:
    radial-gradient(ellipse 75% 55% at 50% 0%, rgba(var(--accent-rgb), 0.085) 0%, transparent 65%),
    radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
  background-size: 100% 100%, 24px 24px;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: max(12px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
  overflow-x: hidden;
  overflow-y: auto;
  color: var(--text-main);
  user-select: none;
  -webkit-user-select: none;
}

/* ===================================================================
   WIDESCREEN STUDIO CONSOLE (DESKTOP) / PORTABLE DECK (MOBILE)
   =================================================================== */
.console {
  position: relative;
  width: min(95vw, 980px);
  background: linear-gradient(180deg, var(--chassis-top) 0%, var(--chassis-bot) 100%);
  border-radius: 22px;
  border: 1px solid rgba(255, 255, 255, 0.09);
  box-shadow:
    0 36px 95px rgba(0, 0, 0, 0.88),
    0 2px 5px rgba(0, 0, 0, 0.65),
    inset 0 1px 0 rgba(255, 255, 255, 0.14),
    inset 0 -1px 0 rgba(0, 0, 0, 0.65);
  padding: 16px 18px 18px;
  display: grid;
  grid-template-columns: 1.35fr 0.92fr;
  grid-template-rows: auto 1fr;
  gap: 14px 16px;
}

/* Machined Corner Hardware Fasteners */
.screw {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #09090c;
  border: 1px solid rgba(255, 255, 255, 0.11);
  box-shadow: inset 0 1px 1px #000;
  pointer-events: none;
}
.screw.tl { top: 9px; left: 9px; }
.screw.tr { top: 9px; right: 9px; }
.screw.bl { bottom: 9px; left: 9px; }
.screw.br { bottom: 9px; right: 9px; }

/* ---- Top Bezel Header Bar (Spans full console width on desktop) ---- */
.deck-top {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 2px 4px 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.065);
}

.brand-block {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.model-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--text-main);
  white-space: nowrap;
}

.model-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.12em;
  color: var(--text-dim);
}

.hardware-switches {
  display: flex;
  align-items: center;
  gap: 8px;
}

.render-state-chip {
  height: 26px;
  padding: 0 8px;
  border-radius: 6px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.06);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.render-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--text-dim);
}

.is-playing .render-state-chip {
  color: var(--text-muted);
}

.is-playing .render-dot {
  background: var(--accent);
  box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.9);
}

.micro-switch {
  height: 26px;
  padding: 0 9px;
  border-radius: 6px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.085);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.85);
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  flex-shrink: 0;
  transition: border-color 0.15s ease, color 0.15s ease, transform 0.08s ease;
}

.micro-switch:hover { border-color: rgba(255, 255, 255, 0.2); color: #fff; }
.micro-switch:active { transform: translateY(1px); }

.led-pip {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #272830;
}

.micro-switch.eco-on {
  color: #6ee7b7;
  border-color: rgba(16, 232, 162, 0.35);
}

.micro-switch.eco-on .led-pip {
  background: #10e8a2;
  box-shadow: 0 0 6px rgba(16, 232, 162, 0.8);
}

.finish-bank {
  display: flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 7px;
  border-radius: 6px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.085);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.85);
}

.finish-dot {
  width: 11px;
  height: 11px;
  border-radius: 3px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  cursor: pointer;
  opacity: 0.44;
  transition: opacity 0.15s ease, transform 0.15s var(--ease-mech), border-color 0.15s ease;
}
.finish-dot:hover { opacity: 0.88; transform: scale(1.1); }
.finish-dot.active { opacity: 1; border-color: #fff; transform: scale(1.14); }
.finish-dot[data-theme="neon"] { background: #ff4d1a; }
.finish-dot[data-theme="yellow"] { background: #f5a623; }
.finish-dot[data-theme="blue"] { background: #22d3ee; }
.finish-dot[data-theme="teal"] { background: #10e8a2; }
.finish-dot[data-theme="rose"] { background: #fb3765; }

/* ---- Left Stage Column ---- */
.stage-col {
  display: flex;
  flex-direction: column;
  min-width: 0;
  gap: 11px;
}

/* ---- Right Rack & Queue Column ---- */
.rack-col {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  gap: 10px;
}

/* ---- Acoustic Sculpture OLED Chamber ---- */
.oled-bezel {
  position: relative;
  border-radius: 13px;
  background: var(--oled-bg);
  border: 1px solid rgba(255, 255, 255, 0.09);
  box-shadow:
    inset 0 2px 14px rgba(0, 0, 0, 0.96),
    0 1px 0 rgba(255, 255, 255, 0.06);
  overflow: hidden;
  touch-action: pan-y;
  cursor: crosshair;
  display: flex;
  flex-direction: column;
}

.oled-bezel::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(162deg, rgba(255, 255, 255, 0.028) 0%, transparent 36%);
  pointer-events: none;
  z-index: 4;
}

.oled-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 12px 5px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.045);
  position: relative;
  z-index: 3;
}

.oled-telemetry {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.56);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.oled-telemetry .tag-accent { color: var(--accent); }

.oled-mode-tabs {
  display: flex;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.075);
  border-radius: 5px;
  padding: 2px;
  gap: 2px;
}

.oled-tab {
  background: none;
  border: none;
  padding: 2px 6px;
  border-radius: 3px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  cursor: pointer;
  transition: background 0.14s ease, color 0.14s ease;
}
.oled-tab:hover { color: #fff; }
.oled-tab.active {
  background: var(--accent);
  color: #060608;
}

.oled-canvas-wrap {
  position: relative;
  width: 100%;
  height: clamp(235px, 36dvh, 305px);
}

#visualizer {
  width: 100%;
  height: 100%;
  display: block;
}

/* Floating Micro-Overlay Bands inside OLED bottom-left */
.band-meters {
  position: absolute;
  left: 11px;
  bottom: 8px;
  display: flex;
  align-items: flex-end;
  gap: 6px;
  pointer-events: none;
  z-index: 3;
}

.band-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.band-track {
  width: 4px;
  height: 22px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 1px;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
}

.band-fill {
  width: 100%;
  height: 100%;
  transform-origin: bottom center;
  transform: scaleY(0);
  background: var(--accent);
  will-change: transform;
}

.band-fill.sec {
  background: var(--trace-sec);
}

.band-lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 7.5px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.35);
  letter-spacing: 0.04em;
}

.oled-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 5px 12px 7px;
  border-top: 1px solid rgba(255, 255, 255, 0.045);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
}

.oled-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: rgba(255, 255, 255, 0.45);
  min-width: 72px;
}

.is-playing .oled-status-badge { color: var(--accent); }

.status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.22);
}

.is-playing .status-dot {
  background: var(--accent);
  box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.9);
}

.vu-meter {
  flex: 1;
  height: 4px;
  background: rgba(255, 255, 255, 0.07);
  border-radius: 2px;
  overflow: hidden;
}

.vu-fill {
  width: 100%;
  height: 100%;
  transform-origin: left center;
  transform: scaleX(0);
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 74%, #ef4444 100%);
  will-change: transform;
}

.oled-db {
  min-width: 70px;
  text-align: right;
  color: rgba(255, 255, 255, 0.72);
}

.oled-toast {
  position: absolute;
  top: 38px;
  right: 10px;
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(8, 8, 12, 0.92);
  border: 1px solid rgba(var(--accent-rgb), 0.55);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-main);
  opacity: 0;
  transform: translateY(-4px);
  pointer-events: none;
  transition: opacity 0.16s ease, transform 0.16s ease;
  z-index: 6;
}

.oled-toast.show { opacity: 1; transform: translateY(0); }

/* ---- Track Readout Strip ---- */
.track-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 2px;
}

.track-meta-left { flex: 1; min-width: 0; }

.track-name-container {
  width: 100%;
  overflow: hidden;
  position: relative;
  margin-bottom: 3px;
}

.track-name-container.scrolling {
  mask-image: linear-gradient(to right, transparent, #fff 5%, #fff 95%, transparent);
  -webkit-mask-image: linear-gradient(to right, transparent, #fff 5%, #fff 95%, transparent);
}

.track-name {
  display: inline-block;
  font-family: 'Space Grotesk', 'Inter', sans-serif;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.02em;
  white-space: nowrap;
  color: var(--text-main);
}

@keyframes marquee {
  0%, 10% { transform: translate3d(0, 0, 0); }
  90%, 100% { transform: translate3d(var(--scroll-dist), 0, 0); }
}

.track-sub {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
}

.codec-tag {
  padding: 1px 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--text-main);
  font-weight: 700;
  font-size: 9px;
}

.speed-key {
  height: 28px;
  padding: 0 9px;
  border-radius: 6px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.09);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
  cursor: pointer;
  flex-shrink: 0;
  transition: color 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
}
.speed-key:hover { color: #fff; border-color: rgba(255, 255, 255, 0.22); }
.speed-key:active { transform: translateY(1px); }
.speed-key.boosted { color: var(--accent); border-color: rgba(var(--accent-rgb), 0.5); }

/* ---- Calibrated Tape Scrubber ---- */
.scrubber-section {
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 10px;
  padding: 7px 11px 8px;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.85);
}

.time-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
  margin-bottom: 3px;
}
.time-row #currentTime { color: var(--text-main); }

.slider-hitbox {
  width: 100%;
  height: 24px;
  display: flex;
  align-items: center;
  cursor: pointer;
  position: relative;
  touch-action: none;
}

.progress-bar {
  width: 100%;
  height: 8px;
  background: rgba(255, 255, 255, 0.045);
  border-radius: 3px;
  position: relative;
  overflow: visible;
  background-image: repeating-linear-gradient(
    90deg,
    rgba(255, 255, 255, 0.14) 0px,
    rgba(255, 255, 255, 0.14) 1px,
    transparent 1px,
    transparent 10px
  );
}

.progress-track-clip {
  position: absolute;
  inset: 0;
  border-radius: 3px;
  overflow: hidden;
  pointer-events: none;
}

.progress-buffered {
  position: absolute;
  inset: 0;
  width: 100%;
  transform-origin: left center;
  transform: scaleX(0);
  background: rgba(255, 255, 255, 0.09);
  will-change: transform;
}

.progress-fill {
  position: absolute;
  inset: 0;
  width: 100%;
  transform-origin: left center;
  transform: scaleX(0);
  background: rgba(var(--accent-rgb), 0.78);
  will-change: transform;
}

.progress-thumb {
  position: absolute;
  left: 0;
  top: 50%;
  width: 8px;
  height: 17px;
  margin-left: -4px;
  border-radius: 2px;
  background: #f4f3ef;
  border: 1px solid rgba(0, 0, 0, 0.75);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.85), inset 0 1px 0 #fff;
  transform: translate3d(0px, -50%, 0);
  pointer-events: none;
}

.slider-hitbox.dragging .progress-thumb {
  background: var(--accent);
  border-color: #fff;
}

.seek-tooltip {
  position: absolute;
  bottom: 24px;
  left: 0;
  transform: translate3d(-50%, 4px, 0);
  padding: 2px 7px;
  border-radius: 4px;
  background: #040406;
  border: 1px solid var(--accent);
  color: var(--text-main);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s ease, transform 0.12s ease;
  white-space: nowrap;
  z-index: 15;
}
.slider-hitbox.dragging .seek-tooltip { opacity: 1; transform: translate3d(-50%, 0, 0); }

/* ---- Mechanical Keycap Transport Pocket ---- */
.transport-pocket {
  display: grid;
  grid-template-columns: 44px 1fr 1.35fr 1fr 44px;
  gap: 7px;
  padding: 7px;
  border-radius: 13px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.06);
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.85);
}

.keycap {
  height: 46px;
  border-radius: 8px;
  border: 1px solid var(--border-subtle);
  background: linear-gradient(180deg, var(--key-top) 0%, var(--key-bot) 100%);
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.09);
  color: rgba(255, 255, 255, 0.82);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  transition: transform 0.08s var(--ease-mech), box-shadow 0.08s ease, border-color 0.15s ease, color 0.15s ease;
}

.keycap svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.keycap:hover { border-color: rgba(255, 255, 255, 0.22); color: #fff; }
.keycap:active {
  transform: translateY(1.5px);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.65), inset 0 1px 3px rgba(0, 0, 0, 0.55);
}

.keycap-led {
  width: 12px;
  height: 3px;
  border-radius: 2px;
  background: #272730;
}

.keycap.active {
  color: #fff;
  border-color: rgba(var(--accent-rgb), 0.45);
}

.keycap.active .keycap-led {
  background: var(--accent);
  box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.9);
}

.keycap.play-key {
  background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dim) 100%);
  border-color: rgba(255, 255, 255, 0.26);
  color: #070709;
  box-shadow: 0 4px 14px rgba(var(--accent-rgb), 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.38);
}

.keycap.play-key svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
  stroke: currentColor;
}
.keycap.play-key:hover { filter: brightness(1.06); }
.keycap.play-key:active { transform: translateY(1.5px); }

/* ---- DSP Rack & Gain ---- */
.volume-row {
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.065);
  border-radius: 10px;
  padding: 4px 10px;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.85);
}

.vol-btn {
  background: none;
  border: none;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  cursor: pointer;
}
.vol-btn:hover { color: #fff; }
.vol-btn svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.vol-bar {
  height: 5px;
  background-image: none;
  background-color: rgba(255, 255, 255, 0.08);
}
.vol-thumb { width: 6px; height: 14px; margin-left: -3px; }
.vol-pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: rgba(255, 255, 255, 0.72);
  min-width: 32px;
  text-align: right;
}

.dsp-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

.dsp-key {
  height: 36px;
  padding: 0 9px;
  border-radius: 8px;
  border: 1px solid var(--border-subtle);
  background: linear-gradient(180deg, var(--key-top) 0%, var(--key-bot) 100%);
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  transition: transform 0.08s ease, border-color 0.15s ease, color 0.15s ease;
}

.dsp-key:hover { color: #fff; border-color: rgba(255, 255, 255, 0.2); }
.dsp-key:active { transform: translateY(1px); }
.dsp-key.active { color: var(--text-main); border-color: rgba(var(--accent-rgb), 0.5); }

.dsp-led {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #272730;
  flex-shrink: 0;
}
.dsp-key.active .dsp-led {
  background: var(--accent);
  box-shadow: 0 0 7px rgba(var(--accent-rgb), 0.9);
}

/* iOS Background Toggle */
.ios-background-toggle-row {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  padding: 8px 11px;
}
.is-ios .ios-background-toggle-row { display: flex; }

.ios-bg-text { display: flex; flex-direction: column; gap: 2px; }
.ios-bg-label { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; }
.ios-bg-sub { font-size: 9.5px; color: var(--text-muted); }

.is-ios-bg-active .volume-row,
.is-ios-bg-active .dsp-row { display: none !important; }

/* Toggle Switch */
.switch {
  position: relative;
  display: inline-block;
  width: 36px;
  height: 19px;
  flex-shrink: 0;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute;
  inset: 0;
  cursor: pointer;
  background: #1d1e24;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 5px;
  transition: background 0.2s ease, border-color 0.2s ease;
}
.slider:before {
  content: '';
  position: absolute;
  width: 13px;
  height: 13px;
  left: 2px;
  top: 2px;
  border-radius: 3px;
  background: #8e909b;
  transition: transform 0.2s var(--ease-mech), background 0.2s ease;
}
.switch input:checked + .slider,
.song-toggle input:checked + .slider {
  background: rgba(var(--accent-rgb), 0.22);
  border-color: var(--accent);
}
.switch input:checked + .slider:before,
.song-toggle input:checked + .slider:before {
  transform: translateX(17px);
  background: var(--accent);
}

/* ---- Unified Track Index Panel (Inline on Desktop / Bottom Sheet on Mobile!) ---- */
.song-list-btn {
  display: none;
  width: 100%;
  height: 40px;
  padding: 0 12px;
  border-radius: 10px;
  border: 1px solid var(--border-subtle);
  background: linear-gradient(180deg, var(--key-top) 0%, var(--key-bot) 100%);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  color: var(--text-main);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.07em;
  cursor: pointer;
  align-items: center;
  justify-content: space-between;
}
.song-list-btn:active { transform: translateY(1px); }

.song-list-btn-left { display: flex; align-items: center; gap: 8px; }
.song-list-btn svg {
  width: 15px;
  height: 15px;
  stroke: var(--accent);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.song-count-badge {
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--text-muted);
}

/* Desktop inline queue styling */
.modal-overlay {
  flex: 1 1 0px;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.modal {
  flex: 1 1 0px;
  min-height: 0;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 12px;
  padding: 11px;
  display: flex;
  flex-direction: column;
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.85);
}

.sheet-handle {
  display: none;
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.22);
  margin: 0 auto 10px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 9px;
}

.modal-title-wrap { display: flex; flex-direction: column; gap: 1px; }

.modal-header h2 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
}

.modal-subtitle {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.modal-actions { display: flex; align-items: center; gap: 6px; }

.enable-all-btn {
  display: none;
  height: 24px;
  padding: 0 8px;
  border-radius: 5px;
  border: 1px solid rgba(var(--accent-rgb), 0.5);
  background: rgba(var(--accent-rgb), 0.14);
  color: var(--text-main);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 700;
  cursor: pointer;
}
.enable-all-btn.visible { display: inline-flex; align-items: center; }

.modal-close {
  display: none;
  height: 26px;
  padding: 0 9px;
  border-radius: 6px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
}

.search-container {
  display: flex;
  align-items: center;
  background: var(--oled-bg);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 7px;
  padding: 0 9px;
  margin-bottom: 8px;
}
.search-container:focus-within { border-color: var(--accent); }
.search-prefix {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  margin-right: 7px;
}
#songSearch {
  background: none;
  border: none;
  outline: none;
  color: var(--text-main);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  padding: 8px 0;
  width: 100%;
}
#songSearch::placeholder { color: var(--text-dim); }
#searchClear {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 3px;
  display: none;
}

.song-list {
  list-style: none;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
  padding-right: 2px;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.song-list::-webkit-scrollbar { width: 4px; }
.song-list::-webkit-scrollbar-track { background: transparent; }
.song-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); border-radius: 2px; }

.song-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 9px;
  border-radius: 7px;
  cursor: pointer;
  margin-bottom: 3px;
  border: 1px solid transparent;
  background: rgba(255, 255, 255, 0.015);
  transition: background 0.15s ease, border-color 0.15s ease;
}
.song-item:hover { background: rgba(255, 255, 255, 0.05); }
.song-item.active {
  background: rgba(var(--accent-rgb), 0.13);
  border-color: rgba(var(--accent-rgb), 0.45);
}
.song-item.disabled { opacity: 0.44; }

.song-item .idx-slot {
  width: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
  flex-shrink: 0;
}
.song-item.active .idx-slot { color: var(--accent); }
.song-item .info { flex: 1; min-width: 0; }
.song-item .name {
  font-family: 'Space Grotesk', 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.song-item.disabled .name { text-decoration: line-through; color: #fca5a5; }
.song-item .meta-line {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text-muted);
  margin-top: 1px;
}

.song-empty {
  text-align: center;
  padding: 24px 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
}

.eq-container {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2px;
  width: 15px;
  height: 12px;
}
.eq-bar {
  width: 3px;
  height: 12px;
  background: var(--accent);
  border-radius: 1px;
  transform-origin: bottom center;
  animation: bounceScaleY 0.65s ease-in-out infinite alternate;
}
.eq-bar:nth-child(2) { animation-duration: 0.45s; animation-delay: 0.12s; }
.eq-bar:nth-child(3) { animation-duration: 0.78s; animation-delay: 0.25s; }
@keyframes bounceScaleY { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1); } }

.song-toggle {
  position: relative;
  display: inline-block;
  width: 32px;
  height: 18px;
  cursor: pointer;
  flex-shrink: 0;
}
.song-toggle input { opacity: 0; width: 0; height: 0; }
.song-toggle .slider:before { width: 12px; height: 12px; left: 2px; top: 2px; }
.song-toggle input:checked + .slider:before { transform: translateX(14px); }

/* ===================================================================
   PORTABLE MOBILE & COMPACT LAYOUT (< 920px)
   =================================================================== */
@media (max-width: 919px) {
  .console {
    width: 432px;
    max-width: 100%;
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
    gap: 10px;
    padding: 14px 13px 15px;
    border-radius: 18px;
  }
  .render-state-chip { display: none; }
  .oled-canvas-wrap {
    height: clamp(148px, 24dvh, 200px);
  }
  .transport-pocket {
    grid-template-columns: 40px 1fr 1.3fr 1fr 40px;
    gap: 6px;
    padding: 6px;
  }
  .keycap { height: 45px; }
  .song-list-btn { display: flex; }
  .modal-close { display: inline-flex; align-items: center; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(4, 4, 7, 0.8);
    justify-content: flex-end;
    align-items: center;
    padding: 0;
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
    transition: opacity 0.22s ease, visibility 0.22s ease;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
    visibility: visible;
  }
  .modal {
    flex: 0 1 auto;
    width: 100%;
    max-width: 480px;
    max-height: 82dvh;
    background: linear-gradient(180deg, var(--chassis-top) 0%, var(--chassis-bot) 100%);
    border-radius: 18px 18px 0 0;
    padding: 10px 14px max(16px, env(safe-area-inset-bottom));
    transform: translate3d(0, 100%, 0);
    transition: transform 0.24s var(--ease-mech);
    box-shadow: 0 -16px 50px rgba(0, 0, 0, 0.9);
  }
  .modal-overlay.open .modal { transform: translate3d(0, 0, 0); }
  .sheet-handle { display: block; }
}

@media (max-width: 410px) {
  body { padding: max(8px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)); }
  .console { padding: 11px 11px 12px; gap: 8px; }
  .deck-top { padding-bottom: 9px; }
  .model-sub { display: none; }
  .model-code { font-size: 10px; letter-spacing: 0.1em; }
  .micro-switch { height: 24px; padding: 0 7px; font-size: 8.5px; gap: 4px; }
  .finish-bank { height: 24px; padding: 0 5px; gap: 4px; }
  .finish-dot { width: 10px; height: 10px; }
  .oled-canvas-wrap { height: clamp(128px, 21dvh, 180px); }
  .oled-telemetry { font-size: 8.5px; gap: 5px; }
  .oled-tab { padding: 2px 4px; font-size: 7.5px; }
  .dsp-key { font-size: 9px; padding: 0 7px; height: 34px; }
  .keycap { height: 42px; }
  .song-list-btn { height: 38px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<main class="console" id="player">
  <span class="screw tl" aria-hidden="true"></span>
  <span class="screw tr" aria-hidden="true"></span>
  <span class="screw bl" aria-hidden="true"></span>
  <span class="screw br" aria-hidden="true"></span>

  <header class="deck-top">
    <div class="brand-block">
      <span class="model-code">KINETIC // 01</span>
      <span class="model-sub">ACOUSTIC FIELD CONSOLE</span>
    </div>
    <div class="hardware-switches">
      <span class="render-state-chip" id="renderChip" title="Состояние графического движка">
        <span class="render-dot"></span>
        <span id="renderStateLabel">IDLE SLEEP</span>
      </span>
      <button id="ecoToggle" class="micro-switch" title="Эко-режим: 30Hz и минимум нагрева телефона" aria-label="Эко-режим">
        <span class="led-pip"></span>
        <span id="ecoLabel">ECO 30HZ</span>
      </button>
      <div class="finish-bank" role="group" aria-label="Цветовая схема">
        <button class="finish-dot" data-theme="neon" title="Obsidian Signal"></button>
        <button class="finish-dot" data-theme="yellow" title="Gold Horology"></button>
        <button class="finish-dot" data-theme="blue" title="Deep Sonar"></button>
        <button class="finish-dot" data-theme="teal" title="Phosphor Lab"></button>
        <button class="finish-dot" data-theme="rose" title="Laser Monolith"></button>
      </div>
    </div>
  </header>

  <!-- LEFT STAGE: ACOUSTIC SCULPTURE + TRANSPORT -->
  <div class="stage-col">
    <section class="oled-bezel" id="artwork" title="Тап: Play/Pause · Движение: резонанс · Свайп: трек">
      <div class="oled-header">
        <div class="oled-telemetry">
          <span class="tag-accent" id="trackCounter">TRK 00/00</span>
          <span id="sampleRateReadout">48.0kHz</span>
        </div>
        <div class="oled-mode-tabs" role="tablist" aria-label="Режим визуализации">
          <button class="oled-tab" data-vis="0" role="tab">CYMATICS</button>
          <button class="oled-tab" data-vis="1" role="tab">TERRAIN</button>
          <button class="oled-tab" data-vis="2" role="tab">SCOPE</button>
          <button class="oled-tab" data-vis="3" role="tab">PHASE</button>
        </div>
      </div>

      <div class="oled-canvas-wrap">
        <canvas id="visualizer"></canvas>
        <div class="band-meters" aria-hidden="true">
          <div class="band-col"><div class="band-track"><div class="band-fill" id="bandSub"></div></div><span class="band-lbl">SUB</span></div>
          <div class="band-col"><div class="band-track"><div class="band-fill sec" id="bandMid"></div></div><span class="band-lbl">MID</span></div>
          <div class="band-col"><div class="band-track"><div class="band-fill" id="bandAir"></div></div><span class="band-lbl">AIR</span></div>
        </div>
      </div>

      <div class="oled-footer">
        <span class="oled-status-badge">
          <span class="status-dot"></span>
          <span id="oledState">STANDBY</span>
        </span>
        <div class="vu-meter" aria-hidden="true">
          <div class="vu-fill" id="vuFill"></div>
        </div>
        <span class="oled-db" id="dbReadout">-∞ dBFS</span>
      </div>

      <div class="oled-toast" id="artToast"></div>
    </section>

    <section class="track-strip">
      <div class="track-meta-left">
        <div class="track-name-container" id="trackNameContainer">
          <div class="track-name" id="trackName">Выберите трек</div>
        </div>
        <div class="track-sub">
          <span class="codec-tag" id="codecBadge">PCM</span>
          <span id="trackArtist">Нажмите PLAY или свайпните экран</span>
        </div>
      </div>
      <button class="speed-key" id="speedBtn" title="Скорость воспроизведения">1.0×</button>
    </section>

    <section class="scrubber-section">
      <div class="time-row">
        <span id="currentTime">00:00</span>
        <span id="totalTime">00:00</span>
      </div>
      <div class="slider-hitbox" id="progressHitbox">
        <div class="progress-bar" id="progressBar">
          <div class="progress-track-clip">
            <div class="progress-buffered" id="progressBuffered"></div>
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
        <div class="seek-tooltip" id="seekTooltip">00:00</div>
      </div>
    </section>

    <section class="transport-pocket">
      <button class="keycap" id="shuffleBtn" title="Перемешать" aria-label="Перемешать">
        <span class="keycap-led"></span>
        <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <button class="keycap" id="prevBtn" title="Предыдущий трек" aria-label="Предыдущий">
        <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="4" x2="5" y2="20"/></svg>
      </button>
      <button class="keycap play-key" id="playBtn" title="Воспроизвести / Пауза" aria-label="Воспроизвести или пауза">
        <svg viewBox="0 0 24 24" id="playIcon"><polygon points="7 4 20 12 7 20 7 4"/></svg>
        <svg viewBox="0 0 24 24" id="pauseIcon" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </button>
      <button class="keycap" id="nextBtn" title="Следующий трек" aria-label="Следующий">
        <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="4" x2="19" y2="20"/></svg>
      </button>
      <button class="keycap" id="repeatBtn" title="Повтор" aria-label="Повтор">
        <span class="keycap-led"></span>
        <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </section>
  </div>

  <!-- RIGHT RACK: GAIN, STUDIO DSP & LIVE TRACK MATRIX -->
  <div class="rack-col">
    <section class="volume-row">
      <button class="vol-btn" id="muteBtn" title="Отключить / включить звук" aria-label="Громкость">
        <svg viewBox="0 0 24 24" id="volIcon">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path id="volWave" d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      </button>
      <div class="slider-hitbox" id="volumeHitbox">
        <div class="progress-bar vol-bar" id="volumeBar">
          <div class="progress-track-clip">
