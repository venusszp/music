<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ORRERY // Spatial Sound Chronograph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Obsidian Vermilion (Default) */
  --bg: #08080a;
  --bg-radial: rgba(240, 78, 35, 0.085);
  --ink: #f3efe6;
  --ink-muted: rgba(243, 239, 230, 0.56);
  --ink-faint: rgba(243, 239, 230, 0.24);
  --hairline: rgba(243, 239, 230, 0.085);
  --hairline-strong: rgba(243, 239, 230, 0.18);
  --surface-elevated: #111115;
  --surface-popover: #141418;
  --accent: #f04e23;
  --accent-rgb: 240, 78, 35;
  --ink-rgb: 243, 239, 230;
  --accent-contrast: #08080a;
  --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
}

:root.theme-yellow {
  /* Alabaster Ceramic (Architectural Light Mode) */
  --bg: #f1ede4;
  --bg-radial: rgba(217, 107, 24, 0.08);
  --ink: #161513;
  --ink-muted: rgba(22, 21, 19, 0.58);
  --ink-faint: rgba(22, 21, 19, 0.28);
  --hairline: rgba(22, 21, 19, 0.11);
  --hairline-strong: rgba(22, 21, 19, 0.24);
  --surface-elevated: #e7e2d7;
  --surface-popover: #ece7dc;
  --accent: #d45415;
  --accent-rgb: 212, 84, 21;
  --ink-rgb: 22, 21, 19;
  --accent-contrast: #faf7f0;
}

:root.theme-blue {
  /* Midnight Cobalt */
  --bg: #040812;
  --bg-radial: rgba(56, 189, 248, 0.09);
  --ink: #e8f1ff;
  --ink-muted: rgba(232, 241, 255, 0.55);
  --ink-faint: rgba(232, 241, 255, 0.24);
  --hairline: rgba(232, 241, 255, 0.09);
  --hairline-strong: rgba(232, 241, 255, 0.2);
  --surface-elevated: #0b1222;
  --surface-popover: #0e1629;
  --accent: #38bdf8;
  --accent-rgb: 56, 189, 248;
  --ink-rgb: 232, 241, 255;
  --accent-contrast: #040812;
}

:root.theme-teal {
  /* Jade Monograph */
  --bg: #050b09;
  --bg-radial: rgba(16, 232, 162, 0.08);
  --ink: #e4f7ef;
  --ink-muted: rgba(228, 247, 239, 0.56);
  --ink-faint: rgba(228, 247, 239, 0.24);
  --hairline: rgba(228, 247, 239, 0.09);
  --hairline-strong: rgba(228, 247, 239, 0.2);
  --surface-elevated: #0b1612;
  --surface-popover: #0e1b16;
  --accent: #10e8a2;
  --accent-rgb: 16, 232, 162;
  --ink-rgb: 228, 247, 239;
  --accent-contrast: #050b09;
}

:root.theme-rose {
  /* Noir Carmine */
  --bg: #090507;
  --bg-radial: rgba(251, 55, 101, 0.085);
  --ink: #fceef2;
  --ink-muted: rgba(252, 238, 242, 0.55);
  --ink-faint: rgba(252, 238, 242, 0.24);
  --hairline: rgba(252, 238, 242, 0.09);
  --hairline-strong: rgba(252, 238, 242, 0.2);
  --surface-elevated: #140b0f;
  --surface-popover: #180e12;
  --accent: #fb3765;
  --accent-rgb: 251, 55, 101;
  --ink-rgb: 252, 238, 242;
  --accent-contrast: #fff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100dvh;
  width: 100%;
  background-color: var(--bg);
  color: var(--ink);
  overflow: hidden;
}

body {
  font-family: 'JetBrains Mono', monospace;
  background:
    radial-gradient(circle at 50% 48%, var(--bg-radial) 0%, transparent 56%),
    var(--bg);
  user-select: none;
  -webkit-user-select: none;
  transition: background-color 0.35s ease, color 0.35s ease;
}

/* Pure CSS architectural vertical axis (0 CPU!) */
.stage-axes {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.stage-axes::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--hairline);
  opacity: 0.32;
}

/* ===================================================================
   FULL-VIEWPORT SPATIAL SHELL (NO BOXES / NO FLOATING CARDS)
   =================================================================== */
.universe {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: max(14px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));
}

/* ---- Top Edge Navigation & Telemetry Strip ---- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--hairline);
  position: relative;
  z-index: 10;
}

.brand-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.wordmark {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.14em;
  white-space: nowrap;
}

.meta-divider {
  width: 1px;
  height: 12px;
  background: var(--hairline-strong);
}

.telemetry-inline {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 10.5px;
  color: var(--ink-muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.telemetry-inline .hi {
  color: var(--accent);
  font-weight: 700;
}

.top-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.seg-group {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  padding: 2px;
  gap: 2px;
}

.seg-btn {
  background: none;
  border: none;
  padding: 4px 10px;
  border-radius: 999px;
  font-family: inherit;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.18s ease, color 0.18s ease;
}

.seg-btn:hover { color: var(--ink); }
.seg-btn.active {
  background: var(--ink);
  color: var(--bg);
}

.pill-toggle {
  height: 28px;
  padding: 0 10px;
  border-radius: 999px;
  background: none;
  border: 1px solid var(--hairline);
  color: var(--ink-muted);
  font-family: inherit;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: border-color 0.2s ease, color 0.2s ease;
}

.pill-toggle:hover {
  border-color: var(--hairline-strong);
  color: var(--ink);
}

.pill-toggle.eco-on {
  border-color: var(--accent);
  color: var(--accent);
}

.stone-row {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px;
  height: 28px;
  border-radius: 999px;
  border: 1px solid var(--hairline);
}

.stone {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1px solid var(--hairline-strong);
  cursor: pointer;
  opacity: 0.48;
  transition: transform 0.2s var(--ease-spring), opacity 0.2s ease;
}
.stone:hover { opacity: 0.9; transform: scale(1.15); }
.stone.active {
  opacity: 1;
  transform: scale(1.2);
  outline: 1.5px solid var(--ink);
  outline-offset: 2px;
}
.stone[data-theme="neon"] { background: #f04e23; }
.stone[data-theme="yellow"] { background: #f1ede4; }
.stone[data-theme="blue"] { background: #38bdf8; }
.stone[data-theme="teal"] { background: #10e8a2; }
.stone[data-theme="rose"] { background: #fb3765; }

/* ===================================================================
   CENTER SPATIAL STAGE (LEFT RAIL · CHRONOGRAPH · RIGHT TRACK ROLL)
   =================================================================== */
.spatial-stage {
  display: grid;
  grid-template-columns: 200px 1fr 270px;
  align-items: center;
  min-height: 0;
  gap: 16px;
  position: relative;
}

/* ---- Left Acoustic Sculpting Rail (Desktop) ---- */
.left-rail {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-right: 12px;
  align-self: center;
}

.rail-block {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.rail-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--ink-faint);
}

.gain-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.mute-ico {
  background: none;
  border: none;
  color: var(--ink-muted);
  cursor: pointer;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.mute-ico:hover { color: var(--ink); }
.mute-ico svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.vol-hitbox {
  flex: 1;
  height: 24px;
  display: flex;
  align-items: center;
  cursor: pointer;
  touch-action: none;
}

.vol-rail {
  width: 100%;
  height: 2px;
  background: var(--hairline-strong);
  position: relative;
}

.vol-fill {
  position: absolute;
  inset: 0;
  width: 100%;
  background: var(--accent);
  transform-origin: left center;
  transform: scaleX(0.7);
  will-change: transform;
}

.vol-knob {
  position: absolute;
  left: 0;
  top: 50%;
  width: 8px;
  height: 8px;
  margin-left: -4px;
  border-radius: 50%;
  background: var(--ink);
  transform: translate3d(0, -50%, 0);
  pointer-events: none;
}

.vol-readout {
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  color: var(--ink-muted);
  min-width: 28px;
  text-align: right;
}

.dsp-stack {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.dsp-line-btn {
  background: none;
  border: none;
  border-bottom: 1px solid var(--hairline);
  padding: 6px 2px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: inherit;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--ink-muted);
  cursor: pointer;
  transition: color 0.15s ease, border-color 0.15s ease;
}

.dsp-line-btn:hover {
  color: var(--ink);
  border-color: var(--hairline-strong);
}

.dsp-line-btn.active {
  color: var(--accent);
  border-color: var(--accent);
}

.dsp-state {
  font-size: 9px;
  letter-spacing: 0.1em;
}

/* ---- Center Monumental Sound Chronograph ---- */
.chrono-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
  position: relative;
}

.chrono-stage {
  position: relative;
  width: min(56dvh, 84vw, 440px);
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  cursor: grab;
}

/* Astrolabe cardinal compass hairlines aligned strictly to the chronograph center */
.chrono-stage::before,
.chrono-stage::after {
  content: '';
  position: absolute;
  background: var(--hairline);
  pointer-events: none;
}
.chrono-stage::before {
  left: 50%;
  top: -12px;
  bottom: -12px;
  width: 1px;
  opacity: 0.5;
}
.chrono-stage::after {
  top: 50%;
  left: -18px;
  right: -18px;
  height: 1px;
  opacity: 0.5;
}

.chrono-stage.scrubbing {
  cursor: grabbing;
}

#chronograph {
  width: 100%;
  height: 100%;
  display: block;
  position: relative;
  z-index: 1;
}

/* Editorial Title & Time anchored inside the tranquil inner eye */
.chrono-eye {
  position: absolute;
  width: 38%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  pointer-events: none;
  gap: 2px;
  z-index: 2;
}

.eye-clock {
  font-size: clamp(18px, 3dvh, 24px);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: var(--ink);
}

.eye-duration {
  font-size: 9.5px;
  color: var(--ink-muted);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.08em;
}

.eye-db {
  margin-top: 2px;
  font-size: 8.5px;
  letter-spacing: 0.1em;
  color: var(--accent);
  opacity: 0.85;
}

.stage-toast {
  position: absolute;
  top: 8%;
  left: 50%;
  transform: translate(-50%, -4px);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--accent);
  background: var(--bg);
  padding: 3px 10px;
  border: 1px solid var(--accent);
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  white-space: nowrap;
  transition: opacity 0.16s ease, transform 0.16s ease;
}

.stage-toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* Editorial Track Title Monument below Ring */
.track-headline {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  max-width: min(88vw, 480px);
  gap: 4px;
}

.title-overflow-wrap {
  max-width: 100%;
  overflow: hidden;
}

.title-overflow-wrap.scrolling {
  mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
  -webkit-mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
}

.track-title {
  display: inline-block;
  font-family: 'Instrument Serif', 'Syne', Georgia, serif;
  font-size: clamp(24px, 3.8dvh, 34px);
  font-weight: 400;
  font-style: italic;
  letter-spacing: 0.01em;
  line-height: 1.08;
  white-space: nowrap;
  color: var(--ink);
}

@keyframes marquee {
  0%, 10% { transform: translate3d(0, 0, 0); }
  90%, 100% { transform: translate3d(var(--scroll-dist), 0, 0); }
}

.track-caption {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: var(--ink-muted);
  letter-spacing: 0.1em;
}

.codec-chip {
  color: var(--accent);
  font-weight: 700;
}

/* ---- Right Borderless Exhibition Track Roll (Desktop) ---- */
.right-roll {
  display: flex;
  flex-direction: column;
  height: min(58dvh, 470px);
  min-height: 0;
  padding-left: 14px;
  border-left: 1px solid var(--hairline);
}

.roll-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.roll-title {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--ink-faint);
}

.roll-count {
  font-size: 9.5px;
  color: var(--ink-muted);
  font-variant-numeric: tabular-nums;
}

.enable-all-link {
  display: none;
  background: none;
  border: none;
  font-family: inherit;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--accent);
  cursor: pointer;
}
.enable-all-link.visible { display: inline; }

.roll-search {
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--hairline);
  margin-bottom: 8px;
  padding-bottom: 4px;
}
.roll-search:focus-within { border-color: var(--accent); }
.roll-search span {
  font-size: 10.5px;
  color: var(--accent);
  margin-right: 6px;
}
#songSearch {
  background: none;
  border: none;
  outline: none;
  width: 100%;
  font-family: inherit;
  font-size: 11px;
  color: var(--ink);
}
#songSearch::placeholder { color: var(--ink-faint); }
#searchClear {
  background: none;
  border: none;
  color: var(--ink-muted);
  font-family: inherit;
  font-size: 9.5px;
  cursor: pointer;
  display: none;
}

.song-list {
  list-style: none;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
  padding-right: 4px;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.song-list::-webkit-scrollbar { width: 2px; }
.song-list::-webkit-scrollbar-thumb { background: var(--hairline-strong); }

.song-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 2px;
  border-bottom: 1px solid transparent;
  cursor: pointer;
  opacity: 0.62;
  transition: opacity 0.15s ease, color 0.15s ease;
}

.song-item:hover { opacity: 1; }
.song-item.active {
  opacity: 1;
  color: var(--accent);
}
.song-item.disabled { opacity: 0.3; }

.song-item .idx-slot {
  width: 20px;
  font-size: 9.5px;
  font-variant-numeric: tabular-nums;
  color: var(--ink-faint);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.song-item.active .idx-slot { color: var(--accent); }

.song-item .info {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.song-item .name {
  font-family: 'Syne', sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.song-item.disabled .name { text-decoration: line-through; }

.song-item .ext {
  font-size: 8.5px;
  color: var(--ink-faint);
  flex-shrink: 0;
}

.song-empty {
  padding: 18px 0;
  font-size: 10px;
  color: var(--ink-faint);
}

.eq-container {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  width: 12px;
  height: 10px;
}
.eq-bar {
  width: 2px;
  height: 10px;
  background: var(--accent);
  transform-origin: bottom center;
  animation: eqPulse 0.65s ease-in-out infinite alternate;
}
.eq-bar:nth-child(2) { animation-duration: 0.45s; animation-delay: 0.12s; }
.eq-bar:nth-child(3) { animation-duration: 0.78s; animation-delay: 0.25s; }
@keyframes eqPulse { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1); } }

.song-toggle {
  position: relative;
  width: 24px;
  height: 12px;
  flex-shrink: 0;
  cursor: pointer;
}
.song-toggle input { opacity: 0; width: 0; height: 0; }
.song-toggle .track-dot {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  border: 1px solid var(--hairline-strong);
  transition: border-color 0.18s ease, background 0.18s ease;
}
.song-toggle .track-dot::before {
  content: '';
  position: absolute;
  width: 6px;
  height: 6px;
  left: 2px;
  top: 2px;
  border-radius: 50%;
  background: var(--ink-faint);
  transition: transform 0.18s var(--ease-spring), background 0.18s ease;
}
.song-toggle input:checked + .track-dot {
  border-color: var(--accent);
}
.song-toggle input:checked + .track-dot::before {
  transform: translateX(12px);
  background: var(--accent);
}

/* ===================================================================
   BOTTOM ARCHITECTURAL TRANSPORT STRIP
   =================================================================== */
.bottom-dock {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--hairline);
  position: relative;
  z-index: 10;
}

.dock-left, .dock-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
}
.dock-right { justify-content: flex-end; }

.transport-core {
  display: flex;
  align-items: center;
  gap: 14px;
}

.icon-action {
  background: none;
  border: 1px solid transparent;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  color: var(--ink-muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: color 0.15s ease, border-color 0.15s ease, transform 0.12s var(--ease-spring);
}
.icon-action:hover { color: var(--ink); border-color: var(--hairline); }
.icon-action:active { transform: scale(0.9); }
.icon-action.active { color: var(--accent); }
.icon-action.active::after {
  content: '';
  position: absolute;
  bottom: 2px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
}
.icon-action svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.play-disc {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: var(--accent-contrast);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.16s var(--ease-spring), filter 0.15s ease;
}
.play-disc:hover { transform: scale(1.06); filter: brightness(1.08); }
.play-disc:active { transform: scale(0.93); }
.play-disc svg {
  width: 21px;
  height: 21px;
  fill: currentColor;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linejoin: round;
}

.text-btn {
  background: none;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  height: 30px;
  padding: 0 11px;
  font-family: inherit;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: color 0.15s ease, border-color 0.15s ease;
}
.text-btn:hover { color: var(--ink); border-color: var(--hairline-strong); }
.text-btn.active { color: var(--accent); border-color: var(--accent); }

/* Mobile-only triggers hidden on wide desktop */
.mobile-dsp-trigger,
.mobile-roll-trigger { display: none; }

/* Mobile Popover Drawer for DSP / Volume on phones */
.dsp-popover {
  display: none;
}

/* iOS Background Mode Row */
.ios-bg-row {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-top: 6px;
}
.is-ios .ios-bg-row { display: flex; }
.is-ios-bg-active .gain-block,
.is-ios-bg-active .dsp-block { display: none !important; }

.sheet-backdrop { display: none; }
.sheet-close-btn { display: none; }
.sheet-grab { display: none; }

/* ===================================================================
   RESPONSIVE BREAKPOINT (< 980px TABLET & MOBILE PHONES)
   =================================================================== */
@media (max-width: 979px) {
  .universe {
    padding: max(10px, env(safe-area-inset-top)) 14px max(12px, env(safe-area-inset-bottom));
  }
  .spatial-stage {
    grid-template-columns: 1fr;
    justify-items: center;
    width: 100%;
  }
  .chrono-center {
    width: 100%;
  }
  .left-rail {
    position: fixed;
    left: 14px;
    right: 14px;
    bottom: calc(108px + env(safe-area-inset-bottom));
    background: var(--surface-popover);
    border: 1px solid var(--hairline-strong);
    border-radius: 16px;
    padding: 16px;
    z-index: 60;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translate3d(0, 12px, 0);
    transition: opacity 0.2s ease, transform 0.2s var(--ease-spring), visibility 0.2s ease;
  }
  .left-rail.open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translate3d(0, 0, 0);
  }
  .chrono-stage {
    width: min(41dvh, 76vw, 310px);
  }
  .mobile-dsp-trigger,
  .mobile-roll-trigger { display: inline-flex; }

  .bottom-dock {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    gap: 8px;
    padding-top: 8px;
    width: 100%;
  }
  .dock-left {
    grid-column: 1;
    grid-row: 1;
    justify-content: flex-start;
  }
  .dock-right {
    grid-column: 2;
    grid-row: 1;
    justify-content: flex-end;
  }
  .transport-core {
    grid-column: 1 / -1;
    grid-row: 2;
    justify-content: center;
    gap: 12px;
  }

  /* Right Roll transforms cleanly into Native Bottom Sheet */
  .sheet-backdrop {
    display: block;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.58);
    z-index: 70;
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
    transition: opacity 0.22s ease, visibility 0.22s ease;
  }
  .sheet-backdrop.open {
    opacity: 1;
    pointer-events: auto;
    visibility: visible;
  }

  .right-roll {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: auto;
    max-height: 78dvh;
    background: var(--surface-popover);
    border-left: none;
    border-top: 1px solid var(--hairline-strong);
    border-radius: 20px 20px 0 0;
    padding: 10px 18px max(18px, env(safe-area-inset-bottom));
    z-index: 80;
    transform: translate3d(0, 100%, 0);
    transition: transform 0.26s var(--ease-spring);
  }
  .right-roll.open { transform: translate3d(0, 0, 0); }
  .sheet-grab {
    display: block;
    width: 36px;
    height: 3px;
    border-radius: 99px;
    background: var(--hairline-strong);
    margin: 0 auto 10px;
  }
  .sheet-close-btn {
    display: inline-flex;
    background: none;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 3px 9px;
    font-family: inherit;
    font-size: 9px;
    font-weight: 700;
    color: var(--ink-muted);
    cursor: pointer;
  }
  .song-item { padding: 9px 2px; }
}

@media (max-width: 600px) {
  .topbar {
    flex-wrap: wrap;
    row-gap: 7px;
    padding-bottom: 8px;
  }
  .top-controls {
    width: 100%;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 5px;
  }
  .wordmark { font-size: 13px; }
  .telemetry-inline { font-size: 9.5px; gap: 6px; }
  .seg-btn { padding: 3px 7px; font-size: 8.5px; }
  .pill-toggle { height: 24px; padding: 0 7px; font-size: 8.5px; }
  .stone-row { height: 24px; padding: 0 6px; gap: 5px; }
  .stone { width: 10px; height: 10px; }
  .chrono-stage { width: min(37dvh, 74vw, 276px); }
  .track-title { font-size: clamp(20px, 5.2vw, 26px); }
  .play-disc { width: 48px; height: 48px; }
  .icon-action { width: 34px; height: 34px; }
  .text-btn { height: 28px; padding: 0 9px; font-size: 9px; }
  .bottom-dock { gap: 7px; padding-top: 7px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

<body>

      <div class="ios-bg-row">

    <!-- HERO DIRECT-TOUCH SOUND CHRONOGRAPH -->
    <section class="chrono-center">
      <div class="chrono-stage" id="artwork" title="Внешнее кольцо: круговая перемотка · Центр: задеть струну / тап Play · Свайп: трек">

    <!-- RIGHT EXHIBITION TRACK ROLL (Bottom Sheet on Mobile) -->
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <aside class="right-roll" id="rightRoll" aria-label="Плейлист">
      <div class="sheet-grab" id="sheetHandle"></div>

  <!-- BOTTOM ARCHITECTURAL TRANSPORT STRIP -->

<script>
(() => {
  'use strict';

  if (window.location.protocol === 'file:') {
    document.body.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;padding:32px;text-align:center;font-family:JetBrains Mono,monospace;color:#f3efe6;background:#08080a;gap:14px">
        <div style="font-size:12px;color:#f04e23;letter-spacing:0.14em">ORRERY // HTTP REQUIRED</div>
        <h2 style="font-size:18px;font-weight:700">Откройте через HTTP-сервер</h2>
        <p style="opacity:0.6;max-width:400px;line-height:1.6;font-size:12px">
          Запустите <code>python -m http.server 8080</code> и откройте <code>http://localhost:8080</code>
        </p>
      </div>`;
    return;
  }

  // ===================================================================
  //  ENVIRONMENT & THERMAL PROFILE
  // ===================================================================
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isMobileDevice = window.innerWidth <= 979 ||
    /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
    window.matchMedia('(pointer: coarse)').matches;
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (isIOS) document.documentElement.classList.add('is-ios');

  const savedEco = localStorage.getItem('ecoMode');
  let ecoMode = savedEco !== null ? savedEco === 'true' : (isMobileDevice || prefersReducedMotion);
  let iosBackgroundMode = localStorage.getItem('iosBackgroundMode') !== 'false';

  const THEMES = {
    neon:   { accent: '#f04e23', accentRgb: [240, 78, 35],  inkRgb: [243, 239, 230], bg: '#08080a', name: 'Obsidian Vermilion' },
    yellow: { accent: '#d45415', accentRgb: [212, 84, 21],  inkRgb: [22, 21, 19],    bg: '#f1ede4', name: 'Alabaster Ceramic' },
    blue:   { accent: '#38bdf8', accentRgb: [56, 189, 248], inkRgb: [232, 241, 255], bg: '#040812', name: 'Midnight Cobalt' },
    teal:   { accent: '#10e8a2', accentRgb: [16, 232, 162], inkRgb: [228, 247, 239], bg: '#050b09', name: 'Jade Monograph' },
    rose:   { accent: '#fb3765', accentRgb: [251, 55, 101], inkRgb: [252, 238, 242], bg: '#090507', name: 'Noir Carmine' }
  };

  const SPEEDS = [1.0, 1.15, 1.25, 1.5, 0.85];

  // ===================================================================
  //  DOM ELEMENTS
  // ===================================================================
  const playerEl = document.getElementById('player');
  const canvas = document.getElementById('chronograph');
  const ctx = canvas.getContext('2d', { alpha: true });
  const chronoStage = document.getElementById('artwork');
  const artToastEl = document.getElementById('artToast');

  const trackCounterEl = document.getElementById('trackCounter');
  const sampleRateReadout = document.getElementById('sampleRateReadout');
  const renderStateReadout = document.getElementById('renderStateReadout');
  const ecoToggle = document.getElementById('ecoToggle');
  const ecoLabel = document.getElementById('ecoLabel');

  const currentTimeEl = document.getElementById('currentTime');
  const totalTimeEl = document.getElementById('totalTime');
  const dbReadoutEl = document.getElementById('dbReadout');
  const trackNameContainer = document.getElementById('trackNameContainer');
  const trackNameEl = document.getElementById('trackName');
  const trackArtistEl = document.getElementById('trackArtist');
  const codecBadgeEl = document.getElementById('codecBadge');

  const volumeHitbox = document.getElementById('volumeHitbox');
  const volumeBar = document.getElementById('volumeBar');
  const volumeFill = document.getElementById('volumeFill');
  const volumeThumb = document.getElementById('volumeThumb');
  const muteBtn = document.getElementById('muteBtn');
  const volWave = document.getElementById('volWave');
  const volPctEl = document.getElementById('volPct');

  const bassBoostBtn = document.getElementById('bassBoostBtn');
  const bassStateEl = document.getElementById('bassState');
  const airBoostBtn = document.getElementById('airBoostBtn');
  const airStateEl = document.getElementById('airState');
  const spatialBtn = document.getElementById('spatialBtn');
  const spatialStateEl = document.getElementById('spatialState');

  const speedBtn = document.getElementById('speedBtn');
  const synthBtn = document.getElementById('synthBtn');
  const dspRail = document.getElementById('dspRail');
  const dspToggleBtn = document.getElementById('dspToggleBtn');
  const addFilesBtn = document.getElementById('addFilesBtn');
  const localFileInput = document.getElementById('localFileInput');

  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');

  const songListBtn = document.getElementById('songListBtn');
  const songCountBadge = document.getElementById('songCountBadge');
  const rightRoll = document.getElementById('rightRoll');
  const sheetBackdrop = document.getElementById('sheetBackdrop');
  const modalClose = document.getElementById('modalClose');
  const playlistStats = document.getElementById('playlistStats');
  const enableAllBtn = document.getElementById('enableAllBtn');
  const songSearch = document.getElementById('songSearch');
  const searchClear = document.getElementById('searchClear');
  const songListEl = document.getElementById('songList');

  // ===================================================================
  //  STATE
  // ===================================================================
  let themeMode = localStorage.getItem('themeMode') || 'neon';
  if (!THEMES[themeMode]) themeMode = 'neon';
  let visualizerStyle = parseInt(localStorage.getItem('visualizerStyle') || '0', 10) % 3;
  if (isNaN(visualizerStyle) || visualizerStyle < 0) visualizerStyle = 0;

  let isPlaying = false;
  let synthActive = false;
  let synthTimer = null;
  let synthStep = 0;
  let synthStartTime = 0;
  let synthBus = null;
  let localFileMeta = {};
  let audio = new Audio();
  let currentAudioCtx = null;
  let analyser = null;
  let source = null;
  let bassFilter = null;
  let airFilter = null;
  let pannerNode = null;
  let gainNode = null;
  let freqData = new Uint8Array(128);
  let timeData = new Uint8Array(256).fill(128);
  let bufferLength = 128;

  let currentIndex = -1;
  let shuffleOn = false;
  let repeatOn = false;
  let shuffleOrder = [];
  let shuffleIndex = 0;
  let songFiles = [];
  let disabledSongs = JSON.parse(localStorage.getItem('disabledSongs') || '[]');

  let bassBoostActive = false;
  let airBoostActive = false;
  let spatialAudioActive = false;
  let targetVolume = 0.7;
  let preMuteVolume = 0.7;
  let speedIdx = 0;
  let fadeRafId = null;
  let isFadingOut = false;
  let isSeeking = false;
  let isAudioBusy = false;
  let isSwitchingBgMode = false;
  let searchQuery = '';
  let toastTimer = null;

  // Chronograph progress & interaction state
  let progressTarget = 0;
  let progressSmooth = 0;
  let bufferedRatio = 0;
  let isScrubbingRing = false;
  let isDraggingVolume = false;
  let volumeBarWidth = 140;
  let sliderRafId = null;

  function showToast(msg) {
    artToastEl.textContent = msg;
    artToastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => artToastEl.classList.remove('show'), 1400);
  }

  // ===================================================================
  //  ELASTIC HARP / STRATA GROOVES / HARMONOGRAPH ENGINE
  // ===================================================================
  let stageSize = 360;
  let visRafId = null;
  let lastVisTime = 0;
  let subLevel = 0;
  let midLevel = 0;
  let airLevel = 0;
  let smoothedDb = -60;
  let pendPhase = 0;

  // 120-vertex physical elastic sound string (CORONA mode)
  const STRING_N = 120;
  const strDisp = new Float32Array(STRING_N);
  const strVel = new Float32Array(STRING_N);
  const strX = new Float32Array(STRING_N);
  const strY = new Float32Array(STRING_N);

  // 96-sector groove engraving ring (STRATA mode)
  const STRATA_SECTORS = 96;
  const strataGrooves = new Float32Array(STRATA_SECTORS);

  function resizeChronograph() {
    const rect = chronoStage.getBoundingClientRect();
    stageSize = Math.max(200, Math.round(rect.width || 320));
    const dpr = Math.min(window.devicePixelRatio || 1, ecoMode ? 1.35 : 1.75);
    canvas.width = Math.round(stageSize * dpr);
    canvas.height = Math.round(stageSize * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    renderChronograph(performance.now(), !isPlaying && !isScrubbingRing);
  }

  function wakeEngine() {
    if (visRafId || document.hidden) return;
    lastVisTime = 0;
    renderStateReadout.textContent = ecoMode ? '30HZ ECO' : '60HZ';
    visRafId = requestAnimationFrame(loopChronograph);
  }

  function stopEngine() {
    if (visRafId) {
      cancelAnimationFrame(visRafId);
      visRafId = null;
    }
    renderStateReadout.textContent = 'IDLE';
  }

  function loopChronograph(now) {
    visRafId = null;
    if (document.hidden) { renderStateReadout.textContent = 'IDLE'; return; }

    const minMs = ecoMode ? 33.3 : 16.6;
    if (lastVisTime && (now - lastVisTime < minMs)) {
      visRafId = requestAnimationFrame(loopChronograph);
      return;
    }
    lastVisTime = now;

    const alive = renderChronograph(now, false);
    if (alive) {
      visRafId = requestAnimationFrame(loopChronograph);
    } else {
      renderStateReadout.textContent = 'IDLE';
    }
  }

  function sampleAudio(now) {
    const activePlay = isPlaying && (!audio.paused || synthActive);
    let realSignal = false;

    if (analyser && activePlay) {
      try {
        analyser.getByteFrequencyData(freqData);
        analyser.getByteTimeDomainData(timeData);
        for (let i = 0; i < 20; i++) {
          if (freqData[i] > 0) { realSignal = true; break; }
        }
      } catch (e) {}
    }

    if (activePlay && !realSignal) {
      const t = now * 0.001 + (audio.currentTime || 0) * 0.55;
      for (let i = 0; i < freqData.length; i++) {
        const beat = Math.pow(Math.max(0, Math.sin(t * 4.2)), 4) * (i < 12 ? 120 : 28);
        const harm = Math.abs(Math.sin(t * 2.1 + i * 0.18) * Math.cos(t * 0.85 + i * 0.1)) * 125;
        freqData[i] = Math.min(255, 16 + beat + harm);
      }
      for (let i = 0; i < timeData.length; i++) {
        const ph = (i / timeData.length) * Math.PI * 4 + t * 8.5;
        const env = 0.35 + Math.sin(t * 4.2) * 0.25;
        timeData[i] = Math.max(0, Math.min(255, Math.round(128 + (Math.sin(ph) * 0.7 + Math.sin(ph * 2.4) * 0.3) * 85 * env)));
      }
      return true;
    }

    if (realSignal) return true;

    let maxF = 0;
    for (let i = 0; i < freqData.length; i++) {
      freqData[i] = Math.floor(freqData[i] * 0.82);
      if (freqData[i] > maxF) maxF = freqData[i];
    }
    for (let i = 0; i < timeData.length; i++) {
      timeData[i] = Math.round(128 + (timeData[i] - 128) * 0.78);
    }
    return maxF > 2;
  }

  function renderChronograph(now, forceIdle) {
    if (forceIdle) {
      freqData.fill(0);
      timeData.fill(128);
      subLevel = midLevel = airLevel = 0;
      smoothedDb = -60;
    }

    const audioAlive = forceIdle ? false : sampleAudio(now);

    // Band extraction
    let s = 0, m = 0, a = 0;
    for (let i = 0; i < 6; i++) s += freqData[i];
    for (let i = 0; i < 24; i++) m += freqData[i];
    for (let i = 24; i < 54; i++) a += freqData[i];
    subLevel += ((s / (6 * 255)) - subLevel) * 0.3;
    midLevel += ((m / (18 * 255)) - midLevel) * 0.3;
    airLevel += ((a / (30 * 255)) - airLevel) * 0.3;

    // Real dBFS telemetry
    let sumSq = 0;
    for (let i = 0; i < timeData.length; i++) {
      const n = (timeData[i] - 128) / 128;
      sumSq += n * n;
    }
    const rms = Math.sqrt(sumSq / timeData.length);
    const db = rms > 0.002 ? Math.max(-48, Math.min(0, 20 * Math.log10(rms))) : -60;
    smoothedDb += (db - smoothedDb) * 0.24;

    if (isScrubbingRing) {
      dbReadoutEl.textContent = 'SCRUBBING';
    } else if (isPlaying && (!audio.paused || synthActive)) {
      dbReadoutEl.textContent = smoothedDb <= -47 ? 'ACTIVE' : `${smoothedDb.toFixed(1)} dB`;
    } else {
      dbReadoutEl.textContent = 'STANDBY';
    }

    // Update smooth progress inside chronograph render
    if (synthActive && isPlaying) {
      const elapsed = (now - synthStartTime) * 0.001;
      const cycle = 32;
      const sec = elapsed % cycle;
      progressTarget = sec / cycle;
      currentTimeEl.textContent = formatTime(sec);
      totalTimeEl.textContent = '/ 00:32';
    } else if (!isScrubbingRing && !isSeeking) {
      progressTarget = (audio.duration && isFinite(audio.duration)) ? audio.currentTime / audio.duration : 0;
    }
    const pDiff = progressTarget - progressSmooth;
    if (Math.abs(pDiff) > 0.0004) progressSmooth += pDiff * (isScrubbingRing ? 0.55 : 0.25);
    else progressSmooth = progressTarget;

    // Step 1D circular elastic string spring physics
    let stringEnergy = 0;
    const tension = 0.16;
    const damping = 0.87;
    const timeSec = now * 0.001;
    for (let i = 0; i < STRING_N; i++) {
      const prev = strDisp[(i - 1 + STRING_N) % STRING_N];
      const next = strDisp[(i + 1) % STRING_N];
      const bin = Math.floor((i / STRING_N) * 44);
      const drive = audioAlive ? ((freqData[bin] / 255) * 0.52 * Math.sin(i * 0.28 + timeSec * 5.0) + subLevel * 0.35) : 0;
      const force = (prev + next - 2 * strDisp[i]) * tension - strDisp[i] * 0.035 + drive;
      strVel[i] = (strVel[i] + force) * damping;
    }
    for (let i = 0; i < STRING_N; i++) {
      strDisp[i] += strVel[i];
      stringEnergy += Math.abs(strDisp[i]) + Math.abs(strVel[i]);
    }

    const sz = stageSize;
    const cx = sz * 0.5;
    const cy = sz * 0.5;
    const outerR = sz * 0.455;
    const theme = THEMES[themeMode];
    const [ar, ag, ab] = theme.accentRgb;
    const [ir, ig, ib] = theme.inkRgb;

    ctx.clearRect(0, 0, sz, sz);

    // 1. 60 Horological Chronograph Ticks & Outer Scrub Track
    ctx.lineWidth = 1;
    for (let i = 0; i < 60; i++) {
      const ang = (i / 60) * Math.PI * 2 - Math.PI * 0.5;
      const major = i % 5 === 0;
      const r0 = outerR - (major ? 7 : 3.5);
      const r1 = outerR + (major ? 2 : 0);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0);
      ctx.lineTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1);
      ctx.strokeStyle = `rgba(${ir},${ig},${ib},${major ? 0.26 : 0.1})`;
      ctx.stroke();
    }

    // Subtle buffered arc
    const startAng = -Math.PI * 0.5;
    if (bufferedRatio > 0.005) {
      ctx.beginPath();
      ctx.arc(cx, cy, outerR, startAng, startAng + bufferedRatio * Math.PI * 2);
      ctx.strokeStyle = `rgba(${ir},${ig},${ib},0.16)`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Main circular scrub track background
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${ir},${ig},${ib},0.08)`;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Active progress arc + glowing needle cap
    const curAng = startAng + progressSmooth * Math.PI * 2;
    if (progressSmooth > 0.001) {
      ctx.beginPath();
      ctx.arc(cx, cy, outerR, startAng, curAng);
      ctx.strokeStyle = theme.accent;
      ctx.lineWidth = isScrubbingRing ? 3.5 : 2.5;
      ctx.stroke();
    }

    // Tactile circular playhead handle
    const hx = cx + Math.cos(curAng) * outerR;
    const hy = cy + Math.sin(curAng) * outerR;
    ctx.beginPath();
    ctx.arc(hx, hy, isScrubbingRing ? 6.5 : 4.5, 0, Math.PI * 2);
    ctx.fillStyle = theme.accent;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(hx, hy, 2, 0, Math.PI * 2);
    ctx.fillStyle = theme.bg;
    ctx.fill();

    // 2. Render Active Acoustic Sculpture inside outerR
    const innerR = outerR * 0.72;
    if (visualizerStyle === 0) {
      drawCoronaString(cx, cy, innerR, theme, ar, ag, ab, ir, ig, ib);
    } else if (visualizerStyle === 1) {
      drawStrataEngraving(cx, cy, innerR, theme, ar, ag, ab, ir, ig, ib, audioAlive);
    } else {
      drawPendulumAttractor(cx, cy, innerR, theme, ar, ag, ab, ir, ig, ib, audioAlive);
    }

    return audioAlive || isScrubbingRing || Math.abs(pDiff) > 0.0005 || stringEnergy > 0.06;
  }

  function drawCoronaString(cx, cy, baseR, theme, ar, ag, ab, ir, ig, ib) {
    // 1. 64-Ray Mirrored Dual-Polar FFT Spectrum Corona (batched in 2 fast strokes!)
    const rays = 64;
    const baseCoronaR = baseR * 0.78;
    ctx.beginPath();
    for (let i = 0; i < rays; i++) {
      const a = (i / rays) * Math.PI * 2 - Math.PI * 0.5;
      const mirror = i < rays * 0.5 ? i : rays - 1 - i;
      const bin = Math.min(freqData.length - 1, Math.floor((mirror / (rays * 0.5)) * 42));
      const energy = freqData[bin] / 255;
      const len = 4 + energy * (baseR * 0.42);
      const rIn = baseCoronaR - energy * (baseR * 0.14);
      const cos = Math.cos(a);
      const sin = Math.sin(a);
      ctx.moveTo(cx + cos * rIn, cy + sin * rIn);
      ctx.lineTo(cx + cos * (baseCoronaR + len), cy + sin * (baseCoronaR + len));
    }
    ctx.strokeStyle = `rgba(${ir},${ig},${ib},${0.16 + airLevel * 0.55})`;
    ctx.lineWidth = 1.1;
    ctx.stroke();

    // 2. Compute Elastic Catmull-style Standing-Wave String Vertices
    for (let i = 0; i < STRING_N; i++) {
      const a = (i / STRING_N) * Math.PI * 2 - Math.PI * 0.5;
      // Resting geometric 6-node acoustic crown when idle + live spring displacement
      const restForm = Math.cos(6 * a) * 2.2 + Math.sin(3 * a) * 1.1;
      const rad = baseR + restForm + strDisp[i] * 7.5;
      strX[i] = cx + Math.cos(a) * rad;
      strY[i] = cy + Math.sin(a) * rad;
    }

    // 3. Nodal Interference Web (105-degree chords mathematically clear center clock!)
    const chordStep = ecoMode ? 6 : 4;
    ctx.beginPath();
    for (let i = 0; i < STRING_N; i += chordStep) {
      const target = (i + 35) % STRING_N;
      ctx.moveTo(strX[i], strY[i]);
      ctx.lineTo(strX[target], strY[target]);
    }
    ctx.strokeStyle = `rgba(${ar},${ag},${ab},${0.11 + subLevel * 0.34})`;
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // 4. Closed Smooth Acoustic Membrane Spline
    ctx.beginPath();
    const firstMidX = (strX[STRING_N - 1] + strX[0]) * 0.5;
    const firstMidY = (strY[STRING_N - 1] + strY[0]) * 0.5;
    ctx.moveTo(firstMidX, firstMidY);
    for (let i = 0; i < STRING_N; i++) {
      const next = (i + 1) % STRING_N;
      ctx.quadraticCurveTo(strX[i], strY[i], (strX[i] + strX[next]) * 0.5, (strY[i] + strY[next]) * 0.5);
    }
    ctx.closePath();

    ctx.strokeStyle = `rgba(${ar},${ag},${ab},0.22)`;
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.strokeStyle = theme.accent;
    ctx.lineWidth = 1.75;
    ctx.stroke();
  }

  function drawStrataEngraving(cx, cy, baseR, theme, ar, ag, ab, ir, ig, ib, audioAlive) {
    const sector = Math.min(STRATA_SECTORS - 1, Math.floor(progressSmooth * STRATA_SECTORS));
    if (audioAlive) {
      const energy = Math.min(1, subLevel * 0.6 + midLevel * 0.45 + airLevel * 0.25);
      strataGrooves[sector] = Math.max(strataGrooves[sector] * 0.7, energy);
    }

    for (let ring = 0; ring < 4; ring++) {
      ctx.beginPath();
      ctx.arc(cx, cy, baseR * (0.64 + ring * 0.14), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${ir},${ig},${ib},${ring === 0 ? 0.14 : 0.055})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.lineCap = 'round';
    for (let i = 0; i < STRATA_SECTORS; i++) {
      const a = (i / STRATA_SECTORS) * Math.PI * 2 - Math.PI * 0.5;
      const bin = Math.floor((i / STRATA_SECTORS) * 42);
      const liveVal = audioAlive ? (freqData[bin] / 255) * 0.45 : 0;
      const val = Math.max(strataGrooves[i], liveVal);
      const len = 3 + val * (baseR * 0.34);
      const r0 = baseR * 0.76;

      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * (r0 + len), cy + Math.sin(a) * (r0 + len));
      if (i <= sector && strataGrooves[i] > 0.02) {
        ctx.strokeStyle = `rgba(${ar},${ag},${ab},${0.45 + val * 0.55})`;
        ctx.lineWidth = 1.8;
      } else {
        ctx.strokeStyle = `rgba(${ir},${ig},${ib},${0.16 + liveVal * 0.65})`;
        ctx.lineWidth = 1.2;
      }
      ctx.stroke();
    }

    // Live sweeping lathe stylus beam at current playhead angle
    const stylusA = progressSmooth * Math.PI * 2 - Math.PI * 0.5;
    const stylusVib = audioAlive ? (subLevel + midLevel) * 10 : 0;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(stylusA) * (baseR * 0.62), cy + Math.sin(stylusA) * (baseR * 0.62));
    ctx.lineTo(cx + Math.cos(stylusA) * (baseR * 1.18 + stylusVib), cy + Math.sin(stylusA) * (baseR * 1.18 + stylusVib));
    ctx.strokeStyle = theme.accent;
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }

  function drawPendulumAttractor(cx, cy, baseR, theme, ar, ag, ab, ir, ig, ib, audioAlive) {
    if (audioAlive) pendPhase += 0.02 + subLevel * 0.036;

    // Precision guilloche boundary circles
    ctx.beginPath();
    ctx.arc(cx, cy, baseR * 0.56, 0, Math.PI * 2);
    ctx.arc(cx, cy, baseR * 1.08, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${ir},${ig},${ib},0.085)`;
    ctx.lineWidth = 1;
    ctx.stroke();

    // 4-Pass Damped Swiss Guilloché + Live Waveform Ripple Injection
    const pts = ecoMode ? 150 : 210;
    const lobes = 5 + midLevel * 3.5; // Continuous (zero snapping!)
    const modFreq = 7 + airLevel * 5.0;
    const ringCenter = baseR * 0.82;
    const layers = ecoMode ? 3 : 4;

    for (let l = layers - 1; l >= 0; l--) {
      const decay = 1 - l * 0.16;
      const ph = pendPhase - l * 0.42;
      const swing = baseR * (0.14 + subLevel * 0.14) * decay;

      ctx.beginPath();
      for (let i = 0; i <= pts; i++) {
        const u = i / pts;
        const t = u * Math.PI * 4;
        const pcmIdx = Math.floor(u * (timeData.length - 1));
        const pcmRipple = l === 0 ? ((timeData[pcmIdx] - 128) / 128) * (baseR * 0.09) : 0;

        const rad = ringCenter
          + Math.sin(lobes * t + ph) * swing * 0.65
          + Math.cos(modFreq * t - ph * 1.35) * swing * 0.35
          + pcmRipple;
        const theta = t * 0.5 - Math.PI * 0.5 + Math.sin(t * 2 + ph * 0.5) * 0.09;
        const x = cx + Math.cos(theta) * rad;
        const y = cy + Math.sin(theta) * rad;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      if (l === 0) {
        ctx.strokeStyle = theme.accent;
        ctx.lineWidth = 1.65;
      } else if (l === 1) {
        ctx.strokeStyle = `rgba(${ir},${ig},${ib},${0.18 + midLevel * 0.4})`;
        ctx.lineWidth = 1.1;
      } else {
        ctx.strokeStyle = `rgba(${ar},${ag},${ab},${0.22 - l * 0.04})`;
        ctx.lineWidth = 0.9;
      }
      ctx.stroke();
    }

    // 4 Orbiting Stereo Phase Anti-Node Markers
    const pan = (pannerNode && spatialAudioActive) ? pannerNode.pan.value : 0;
    for (let k = 0; k < 4; k++) {
      const nodeAng = pendPhase * 0.7 + (k * Math.PI * 0.5);
      const nodeR = baseR * (0.82 + (k % 2 === 0 ? subLevel : midLevel) * 0.22 + (k === 1 ? pan * 0.08 : 0));
      ctx.beginPath();
      ctx.arc(cx + Math.cos(nodeAng) * nodeR, cy + Math.sin(nodeAng) * nodeR, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = k % 2 === 0 ? theme.accent : `rgba(${ir},${ig},${ib},0.75)`;
      ctx.fill();
    }
  }

  // Pluck string helper when touching inside chronograph
  function pluckStringAt(clientX, clientY, strength) {
    const rect = chronoStage.getBoundingClientRect();
    const cx = rect.left + rect.width * 0.5;
    const cy = rect.top + rect.height * 0.5;
    let ang = Math.atan2(clientY - cy, clientX - cx) + Math.PI * 0.5;
    if (ang < 0) ang += Math.PI * 2;
    const idx = Math.floor((ang / (Math.PI * 2)) * STRING_N) % STRING_N;
    for (let k = -6; k <= 6; k++) {
      const target = (idx + k + STRING_N) % STRING_N;
      const falloff = Math.cos((k / 6) * Math.PI * 0.5);
      strVel[target] += strength * falloff;
    }
    wakeEngine();
  }

  // ===================================================================
  //  CIRCULAR RING SCRUBBING & GESTURES
  // ===================================================================
  let ptrStartX = 0;
  let ptrStartY = 0;
  let ptrInsideMode = false;
  let lastRingAngle = 0;

  function ratioFromClientCoords(clientX, clientY) {
    const rect = chronoStage.getBoundingClientRect();
    const cx = rect.left + rect.width * 0.5;
    const cy = rect.top + rect.height * 0.5;
    let ang = Math.atan2(clientY - cy, clientX - cx) + Math.PI * 0.5;
    if (ang < 0) ang += Math.PI * 2;
    return Math.max(0, Math.min(1, ang / (Math.PI * 2)));
  }

  chronoStage.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const rect = chronoStage.getBoundingClientRect();
    const cx = rect.left + rect.width * 0.5;
    const cy = rect.top + rect.height * 0.5;
    const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
    const outerR = rect.width * 0.455;

    ptrStartX = e.clientX;
    ptrStartY = e.clientY;
    chronoStage.setPointerCapture(e.pointerId);

    // Grabbing near the outer chronograph ring enters circular scrubbing
    if (dist >= outerR * 0.78) {
      isScrubbingRing = true;
      ptrInsideMode = false;
      chronoStage.classList.add('scrubbing');
      const r = ratioFromClientCoords(e.clientX, e.clientY);
      lastRingAngle = r;
      progressTarget = r;
      if (audio.duration && isFinite(audio.duration)) {
        currentTimeEl.textContent = formatTime(r * audio.duration);
      }
      wakeEngine();
    } else {
      isScrubbingRing = false;
      ptrInsideMode = true;
      pluckStringAt(e.clientX, e.clientY, 2.2);
    }
  });

  chronoStage.addEventListener('pointermove', (e) => {
    if (isScrubbingRing) {
      let r = ratioFromClientCoords(e.clientX, e.clientY);
      // Guard against accidental 12-o'clock jump from 0.98 -> 0.02 or vice versa
      if (lastRingAngle > 0.85 && r < 0.15) r = 1;
      else if (lastRingAngle < 0.15 && r > 0.85) r = 0;
      lastRingAngle = r;
      progressTarget = r;
      if (audio.duration && isFinite(audio.duration)) {
        currentTimeEl.textContent = formatTime(r * audio.duration);
      }
      wakeEngine();
    } else if (ptrInsideMode) {
      pluckStringAt(e.clientX, e.clientY, 0.85);
    }
  });

  function endStagePointer(e) {
    if (isScrubbingRing) {
      isScrubbingRing = false;
      chronoStage.classList.remove('scrubbing');
      if (audio.duration && isFinite(audio.duration)) {
        isSeeking = true;
        audio.currentTime = progressTarget * audio.duration;
      }
      wakeEngine();
      return;
    }
    if (!ptrInsideMode) return;
    ptrInsideMode = false;

    const dx = e.clientX - ptrStartX;
    const dy = e.clientY - ptrStartY;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      if (dx < 0) { showToast('NEXT TRACK'); runAudioAction(nextTrack); }
      else { showToast('PREV TRACK'); runAudioAction(prevTrack); }
    } else if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
      runAudioAction(togglePlay);
    }
  }
  chronoStage.addEventListener('pointerup', endStagePointer);
  chronoStage.addEventListener('pointercancel', () => {
    isScrubbingRing = false;
    ptrInsideMode = false;
    chronoStage.classList.remove('scrubbing');
  });

  // ===================================================================
  //  THEMES, ECO MODE & SCULPTURE TABS
  // ===================================================================
  function applyTheme(mode) {
    if (!THEMES[mode]) mode = 'neon';
    themeMode = mode;
    localStorage.setItem('themeMode', mode);
    document.documentElement.classList.remove('theme-yellow', 'theme-blue', 'theme-teal', 'theme-rose');
    if (mode !== 'neon') document.documentElement.classList.add(`theme-${mode}`);

    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', THEMES[mode].bg);

    document.querySelectorAll('.stone').forEach(s => s.classList.toggle('active', s.dataset.theme === mode));
    renderChronograph(performance.now(), !isPlaying);
    if (currentIndex !== -1 && songFiles[currentIndex]) {
      updateMediaSessionMetadata(formatName(getBaseName(songFiles[currentIndex])));
    }
  }

  function applyEcoMode(enabled, announce = false, persist = true) {
    ecoMode = Boolean(enabled);
    if (persist) localStorage.setItem('ecoMode', String(ecoMode));
    ecoToggle.classList.toggle('eco-on', ecoMode);
    ecoLabel.textContent = ecoMode ? 'ECO 30HZ' : '60HZ';
    if (visRafId) renderStateReadout.textContent = ecoMode ? '30HZ ECO' : '60HZ';
    resizeChronograph();
    if (announce) showToast(ecoMode ? 'ECO // 30HZ COOL' : 'PRECISION // 60HZ');
  }

  function applyVisualizerStyle(idx, announce = false) {
    visualizerStyle = ((idx % 3) + 3) % 3;
    localStorage.setItem('visualizerStyle', String(visualizerStyle));
    document.querySelectorAll('.seg-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.vis, 10) === visualizerStyle);
    });
    renderChronograph(performance.now(), !isPlaying);
    if (announce) {
      const names = ['CORONA // ELASTIC STRING', 'STRATA // VINYL ENGRAVING', 'PENDULUM // HARMONOGRAPH'];
      showToast(names[visualizerStyle]);
    }
  }

  ecoToggle.addEventListener('click', () => applyEcoMode(!ecoMode, true, true));

  // ===================================================================
  //  AUDIO ENGINE & PLAYBACK
  // ===================================================================
  function getBaseName(p) { return localFileMeta[p] ? localFileMeta[p].name : p.split('/').pop().split('\\').pop(); }
  function formatName(n) { return n.replace(/\.(mp3|m4a|wav|flac|ogg|aac)$/i, '').replace(/[-_]/g, ' ').trim(); }
  function getFileExt(n) { const m = n.match(/\.([a-z0-9]+)$/i); return m ? m[1].toUpperCase() : 'PCM'; }
  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) return '00:00';
    const s = Math.floor(sec);
    return `${Math.floor(s / 60).toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`;
  }
  function encodePath(p) {
    if (p.startsWith('blob:') || p.startsWith('data:')) return p;
    return p.split('/').map(s => encodeURIComponent(decodeURIComponent(s))).join('/');
  }
  function isSongDisabled(p) { return disabledSongs.includes(p); }

  function toggleSongState(p) {
    const idx = disabledSongs.indexOf(p);
    if (idx === -1) disabledSongs.push(p);
    else disabledSongs.splice(idx, 1);
    localStorage.setItem('disabledSongs', JSON.stringify(disabledSongs));
    updatePlaylistStats();
  }

  function generateShuffleOrder() {
    shuffleOrder = [...Array(songFiles.length).keys()];
    for (let i = shuffleOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
    }
    if (shuffleOrder[0] === currentIndex && shuffleOrder.length > 1) {
      [shuffleOrder[0], shuffleOrder[1]] = [shuffleOrder[1], shuffleOrder[0]];
    }
    shuffleIndex = 0;
  }

  function getFirstEnabledIndex() {
    for (let i = 0; i < songFiles.length; i++) if (!isSongDisabled(songFiles[i])) return i;
    return 0;
  }
  function getLastEnabledIndex() {
    for (let i = songFiles.length - 1; i >= 0; i--) if (!isSongDisabled(songFiles[i])) return i;
    return 0;
  }

  function getNextIndex() {
    if (songFiles.length === 0 || !songFiles.some(f => !isSongDisabled(f))) return -1;
    let ti = currentIndex, tsi = shuffleIndex;
    for (let i = 0; i < songFiles.length; i++) {
      if (shuffleOn && songFiles.length > 1) {
        tsi++;
        if (tsi >= shuffleOrder.length) {
          if (repeatOn) { generateShuffleOrder(); tsi = 0; }
          else return -1;
        }
        ti = shuffleOrder[tsi];
      } else {
        ti++;
        if (ti >= songFiles.length) {
          if (repeatOn) ti = 0;
          else return -1;
        }
      }
      if (!isSongDisabled(songFiles[ti])) { shuffleIndex = tsi; return ti; }
    }
    return -1;
  }

  function getPrevIndex() {
    if (songFiles.length === 0 || !songFiles.some(f => !isSongDisabled(f))) return -1;
    let ti = currentIndex, tsi = shuffleIndex;
    for (let i = 0; i < songFiles.length; i++) {
      if (shuffleOn && songFiles.length > 1) {
        tsi--;
        if (tsi < 0) {
          if (repeatOn) { generateShuffleOrder(); tsi = shuffleOrder.length - 1; }
          else return currentIndex;
        }
        ti = shuffleOrder[tsi] ?? currentIndex;
      } else {
        ti--;
        if (ti < 0) {
          if (repeatOn) ti = songFiles.length - 1;
          else ti = 0;
        }
      }
      if (!isSongDisabled(songFiles[ti])) { shuffleIndex = tsi; return ti; }
    }
    return currentIndex;
  }

  function setupAudioContext(forceForSynth = false) {
    if (!forceForSynth && isIOS && iosBackgroundMode) { sampleRateReadout.textContent = 'IOS DIRECT'; return; }
    try {
      if (!currentAudioCtx) currentAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (currentAudioCtx.sampleRate) {
        sampleRateReadout.textContent = `${(currentAudioCtx.sampleRate / 1000).toFixed(1)}kHz`;
      }
      if (!analyser) {
        analyser = currentAudioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.78;
        bufferLength = analyser.frequencyBinCount;
        freqData = new Uint8Array(bufferLength);
        timeData = new Uint8Array(analyser.fftSize).fill(128);

        bassFilter = currentAudioCtx.createBiquadFilter();
        bassFilter.type = 'lowshelf';
        bassFilter.frequency.value = 150;
        bassFilter.gain.value = bassBoostActive ? 12 : 0;

        airFilter = currentAudioCtx.createBiquadFilter();
        airFilter.type = 'highshelf';
        airFilter.frequency.value = 7500;
        airFilter.gain.value = airBoostActive ? 6 : 0;

        pannerNode = currentAudioCtx.createStereoPanner ? currentAudioCtx.createStereoPanner() : null;
        if (pannerNode) pannerNode.pan.value = 0;

        gainNode = currentAudioCtx.createGain();
        gainNode.gain.value = targetVolume * (bassBoostActive ? 1.55 : 1.15);

        bassFilter.connect(airFilter);
        if (pannerNode) { airFilter.connect(pannerNode); pannerNode.connect(gainNode); }
        else airFilter.connect(gainNode);
        gainNode.connect(analyser);
        analyser.connect(currentAudioCtx.destination);
      }
      if (!source && !(isIOS && iosBackgroundMode)) {
        try {
          source = currentAudioCtx.createMediaElementSource(audio);
          source.connect(bassFilter);
        } catch (err) {}
      }
      if (currentAudioCtx.state === 'suspended') currentAudioCtx.resume().catch(() => {});
    } catch (e) {
      analyser = null;
    }
  }

  // Procedural Web Audio Ambient Poly-Synth (lets user experience live DSP + physics without external files)
  function triggerSynthStep() {
    if (!synthActive || !currentAudioCtx || !bassFilter) return;
    const t = currentAudioCtx.currentTime;
    const step = synthStep % 16;
    synthStep++;

    // Sub Kick on 0, 4, 8, 12
    if (step % 4 === 0) {
      const osc = currentAudioCtx.createOscillator();
      const g = currentAudioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(118, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.14);
      g.gain.setValueAtTime(0.55, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      osc.connect(g);
      g.connect(bassFilter);
      osc.start(t);
      osc.stop(t + 0.3);
    }

    // Off-beat crisp closed hat / shimmer
    if (step % 2 === 1) {
      const osc = currentAudioCtx.createOscillator();
      const hp = currentAudioCtx.createBiquadFilter();
      const g = currentAudioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(step % 4 === 3 ? 6400 : 4800, t);
      hp.type = 'highpass';
      hp.frequency.value = 5000;
      g.gain.setValueAtTime(step % 4 === 3 ? 0.08 : 0.045, t);
      g.gain.exponentialRampToValueAtTime(0.0005, t + 0.06);
      osc.connect(hp);
      hp.connect(g);
      g.connect(bassFilter);
      osc.start(t);
      osc.stop(t + 0.07);
    }

    // Warm Minor-9th chord pluck every bar (0 & 6 & 10)
    const chords = [
      [146.83, 220.00, 261.63, 329.63], // Dm9
      [130.81, 196.00, 246.94, 293.66], // Cmaj9
      [116.54, 174.61, 220.00, 261.63], // Bbmaj7
      [110.00, 164.81, 196.00, 246.94]  // Am7
    ];
    if (step === 0 || step === 6 || step === 10) {
      const chord = chords[Math.floor((synthStep / 16) % chords.length)];
      const filter = currentAudioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1600, t);
      filter.frequency.exponentialRampToValueAtTime(420, t + 0.45);
      filter.connect(bassFilter);

      const notes = step === 0 ? chord : [chord[1], chord[2]];
      for (const freq of notes) {
        const osc = currentAudioCtx.createOscillator();
        const g = currentAudioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.11, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.48);
        osc.connect(g);
        g.connect(filter);
        osc.start(t);
        osc.stop(t + 0.5);
      }
    }
  }

  async function startSynthDemo() {
    if (!audio.paused) audio.pause();
    setupAudioContext(true);
    if (currentAudioCtx && currentAudioCtx.state === 'suspended') {

  function stopSynthDemo(quiet = false) {

  function addLocalAudioFiles(fileList) {
    const valid = Array.from(fileList || []).filter(f => /\.(mp3|m4a|wav|flac|ogg|aac)$/i.test(f.name) || f.type.startsWith('audio/'));
    if (valid.length === 0) return;
    const firstNewIdx = songFiles.length;
    for (const file of valid) {
      const url = URL.createObjectURL(file);
      localFileMeta[url] = { name: file.name };
      songFiles.push(url);
    }
    if (shuffleOn) generateShuffleOrder();
    renderSongList();
    stopSynthDemo(true);
    loadTrack(firstNewIdx, true);
    showToast(`+${valid.length} TRACK${valid.length > 1 ? 'S' : ''}`);
  }

  function applyGainImmediate(vol) {
    if (isIOS && iosBackgroundMode) { audio.volume = 1.0; return; }
    const clamped = Math.max(0, Math.min(1, vol));
    if (gainNode && currentAudioCtx) {
      const mult = bassBoostActive ? 1.55 : 1.15;
      gainNode.gain.cancelScheduledValues(currentAudioCtx.currentTime);
      gainNode.gain.setValueAtTime(clamped * mult, currentAudioCtx.currentTime);
      audio.volume = 1.0;
    } else {
      audio.volume = isIOS ? 1.0 : clamped;
    }
  }

  function fadeAudio(toVolume, durationMs, onComplete) {
    if (fadeRafId) { cancelAnimationFrame(fadeRafId); fadeRafId = null; }
    if (isIOS && iosBackgroundMode) { audio.volume = 1.0; if (onComplete) onComplete(); return; }
    const mult = bassBoostActive ? 1.55 : 1.15;
    if (gainNode && currentAudioCtx) {
      const now = currentAudioCtx.currentTime;
      gainNode.gain.cancelScheduledValues(now);
      gainNode.gain.setValueAtTime(gainNode.gain.value, now);
      gainNode.gain.linearRampToValueAtTime(Math.max(0, Math.min(1, toVolume)) * mult, now + durationMs / 1000);
      audio.volume = 1.0;
      if (onComplete) {
        const start = performance.now();
        const wait = (ts) => {
          if (ts - start >= durationMs) { fadeRafId = null; onComplete(); }
          else fadeRafId = requestAnimationFrame(wait);
        };
        fadeRafId = requestAnimationFrame(wait);
      }
      return;
    }
    const startVol = isIOS ? 1.0 : audio.volume;
    const startTs = performance.now();
    const step = (ts) => {
      const p = Math.min(1, (ts - startTs) / durationMs);
      audio.volume = isIOS ? 1.0 : Math.max(0, Math.min(1, startVol + (toVolume - startVol) * p));
      if (p < 1) fadeRafId = requestAnimationFrame(step);
      else { fadeRafId = null; if (onComplete) onComplete(); }
    };
    fadeRafId = requestAnimationFrame(step);
  }

  function setPlaybackUI(playing) {

  async function runAudioAction(fn) {
    if (isAudioBusy || isSwitchingBgMode) return;
    isAudioBusy = true;
    try { await fn(); }
    catch (err) { console.error('Audio action error:', err); }
    finally { setTimeout(() => { isAudioBusy = false; }, 200); }

  function updateTrackNameScroll() {

    trackNameEl.style.transform = 'translate3d(0, 0, 0)';

    const nw = trackNameEl.scrollWidth;

  function preloadNextTrack() {

      link.id = 'nextTrackPrefetch';

  async function loadTrack(index, autoplay = true) {
    if (index < 0 || index >= songFiles.length) return;
    stopSynthDemo(true);
    currentIndex = index;
    localStorage.setItem('lastTrackIndex', String(index));
    if (shuffleOn && shuffleOrder.length > 0) {
      const sIdx = shuffleOrder.indexOf(index);
      if (sIdx !== -1) { shuffleIndex = sIdx; localStorage.setItem('shuffleIndex', String(shuffleIndex)); }
    }

    const file = songFiles[index];
    const base = getBaseName(file);
    const name = formatName(base);

    strataGrooves.fill(0);
    progressTarget = 0;
    progressSmooth = 0;
    bufferedRatio = 0;

    audio.src = encodePath(file);
    audio.playbackRate = SPEEDS[speedIdx];
    trackNameEl.textContent = name;
    codecBadgeEl.textContent = getFileExt(base);
    trackArtistEl.textContent = autoplay ? 'PLAYING' : 'READY';
    trackCounterEl.textContent = `№ ${String(index + 1).padStart(2, '0')}/${String(songFiles.length).padStart(2, '0')}`;
    currentTimeEl.textContent = '00:00';
    totalTimeEl.textContent = '/ 00:00';

    updateTrackNameScroll();
    updateMediaSessionMetadata(name);
    audio.load();
    setupAudioContext();
    renderChronograph(performance.now(), !autoplay);

    if (autoplay) {
      try {
        if (!(isIOS && iosBackgroundMode) && currentAudioCtx && currentAudioCtx.state === 'suspended') {
          await currentAudioCtx.resume();
        }
        applyGainImmediate(0);
        await audio.play();
        setPlaybackUI(true);

      } catch (err) {
        trackArtistEl.textContent = 'TAP ▶ TO PLAY';
        setPlaybackUI(false);
      }
    } else {
      setPlaybackUI(false);
    }
    updateSongListIndicators();
  }

  async function togglePlay() {
    if (synthActive) {
      stopSynthDemo(false);
      return;
    }
    if (songFiles.length === 0) {
      await startSynthDemo();
      return;
    }
    if (currentIndex === -1) {
      const startIdx = (shuffleOn && shuffleOrder.length > 0) ? shuffleOrder[0] : getFirstEnabledIndex();
      await loadTrack(startIdx, true);
      return;
    }
    if (audio.paused || isFadingOut) {
      isFadingOut = false;
      if (!(isIOS && iosBackgroundMode) && currentAudioCtx && currentAudioCtx.state === 'suspended') {
        await currentAudioCtx.resume();
      }
      try {
        if (audio.paused) {
          applyGainImmediate(0);
          await audio.play();
        }
        setPlaybackUI(true);
        trackArtistEl.textContent = 'PLAYING';
        fadeAudio(targetVolume, 300);
      } catch (err) {
        trackArtistEl.textContent = 'NO AUDIO FILE · TRY SYNTH';
        setPlaybackUI(false);
      }
    } else {
      isFadingOut = true;
      fadeAudio(0, 260, () => {
        if (isFadingOut) {
          audio.pause();
          isFadingOut = false;
          trackArtistEl.textContent = 'PAUSED';
          setPlaybackUI(false);
        }
      });
    }
  }

  async function nextTrack() {
    if (songFiles.length === 0) return;
    let next = getNextIndex();
    if (next === -1) next = getFirstEnabledIndex();
    await loadTrack(next, true);
  }

  async function prevTrack() {
    if (songFiles.length === 0) return;
    if (audio.currentTime > 2.5) { audio.currentTime = 0; wakeEngine(); return; }
    let prev = getPrevIndex();
    if (prev === -1 || prev === currentIndex) prev = getLastEnabledIndex();
    await loadTrack(prev, true);
  }

  // ===================================================================
  //  AUDIO EVENTS & MEDIA SESSION
  // ===================================================================
  let lastPositionSync = 0;

  function updateBuffered() {
    if (!audio.duration || !isFinite(audio.duration) || !audio.buffered || audio.buffered.length === 0) return;
    try {
      bufferedRatio = Math.max(0, Math.min(1, audio.buffered.end(audio.buffered.length - 1) / audio.duration));
    } catch (e) {}
  }

  function bindAudioListeners() {
    audio.addEventListener('timeupdate', () => {
      if (audio.duration && !isScrubbingRing && !isSeeking) {
        currentTimeEl.textContent = formatTime(audio.currentTime);
        updateBuffered();
        const now = performance.now();
        if (now - lastPositionSync > 1000 && 'mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
          lastPositionSync = now;
          try {
            navigator.mediaSession.setPositionState({
              duration: audio.duration,
              playbackRate: audio.playbackRate || 1,
              position: Math.min(audio.currentTime, audio.duration)
            });
          } catch (e) {}
        }
      }
    });
    audio.addEventListener('progress', updateBuffered);
    audio.addEventListener('loadedmetadata', () => {
      totalTimeEl.textContent = `/ ${formatTime(audio.duration)}`;
      updateBuffered();
    });
    audio.addEventListener('play', () => {
      if (!isFadingOut && !isPlaying) { setPlaybackUI(true); trackArtistEl.textContent = 'PLAYING'; }
    });
    audio.addEventListener('pause', () => {
      if (!isFadingOut && isPlaying && !isSwitchingBgMode) { setPlaybackUI(false); trackArtistEl.textContent = 'PAUSED'; }
    });
    audio.addEventListener('ended', () => {
      if (repeatOn && !shuffleOn) { audio.currentTime = 0; audio.play().catch(() => {}); }
      else runAudioAction(nextTrack);
    });
    audio.addEventListener('error', () => {
      trackArtistEl.textContent = 'STREAM UNAVAILABLE';
      setPlaybackUI(false);
    });
    audio.addEventListener('seeking', () => { isSeeking = true; });
    audio.addEventListener('seeked', () => { setTimeout(() => { isSeeking = false; }, 160); });
  }
  bindAudioListeners();

  const artworkCache = {};
  function getGeneratedArtworkUrl() {
    const key = `${themeMode}-${currentIndex}`;
    if (artworkCache[key]) return artworkCache[key];
    const t = THEMES[themeMode];
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctxArt = c.getContext('2d');
    ctxArt.fillStyle = t.bg;
    ctxArt.fillRect(0, 0, 256, 256);
    ctxArt.strokeStyle = t.accent;
    ctxArt.lineWidth = 4;
    ctxArt.beginPath();
    ctxArt.arc(128, 128, 76, 0, Math.PI * 2);
    ctxArt.stroke();
    ctxArt.fillStyle = t.accent;
    ctxArt.font = 'bold 24px monospace';
    ctxArt.textAlign = 'center';
    ctxArt.fillText('ORRERY', 128, 118);
    ctxArt.fillStyle = `rgb(${t.inkRgb.join(',')})`;
    ctxArt.font = 'bold 42px monospace';
    ctxArt.fillText(currentIndex >= 0 ? String(currentIndex + 1).padStart(2, '0') : '--', 128, 165);
    const url = c.toDataURL('image/png');
    artworkCache[key] = url;
    return url;
  }

  function updateMediaSessionMetadata(title) {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title,
        artist: 'ORRERY // Spatial Chronograph',
        album: 'Field Archive',
        artwork: [{ src: getGeneratedArtworkUrl(), sizes: '256x256', type: 'image/png' }]
      });

  }

  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('play', () => runAudioAction(togglePlay));
    navigator.mediaSession.setActionHandler('pause', () => runAudioAction(togglePlay));

    navigator.mediaSession.setActionHandler('nexttrack', () => runAudioAction(nextTrack));
