<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DECK-01 // Field Audio Unit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Signal Carbon (Braun / TE-inspired industrial default) */
  --accent: #ff4d1a;
  --accent-dim: #c9380e;
  --accent-rgb: 255, 77, 26;
  --accent-sec: #f4f4f0;
  --oled-trace: #ff6233;
  --oled-grid: rgba(255, 255, 255, 0.055);
  --surface-bg: #08080a;
  --chassis-top: #18181c;
  --chassis-bot: #101013;
  --pocket-bg: #0b0b0e;
  --key-top: #212127;
  --key-bot: #16161b;
  --key-border: rgba(255, 255, 255, 0.09);
  --oled-bg: #050507;
  --text-main: #f3f3ef;
  --text-muted: #7f808a;
  --text-dim: #4c4d56;
  --ease-mech: cubic-bezier(0.2, 0.9, 0.3, 1);
}

:root.theme-yellow {
  /* Amber CRT */
  --accent: #f59e0b;
  --accent-dim: #b45309;
  --accent-rgb: 245, 158, 11;
  --accent-sec: #fef3c7;
  --oled-trace: #fbbf24;
  --surface-bg: #090806;
  --chassis-top: #191712;
  --chassis-bot: #11100c;
  --pocket-bg: #0c0b08;
  --key-top: #232019;
  --key-bot: #171510;
}

:root.theme-blue {
  /* Cobalt Instrument */
  --accent: #0ea5e9;
  --accent-dim: #0369a1;
  --accent-rgb: 14, 165, 233;
  --accent-sec: #e0f2fe;
  --oled-trace: #38bdf8;
  --surface-bg: #06080c;
  --chassis-top: #141820;
  --chassis-bot: #0d1016;
  --pocket-bg: #090b10;
  --key-top: #1d222d;
  --key-bot: #13171f;
}

:root.theme-teal {
  /* Oscilloscope Mint */
  --accent: #10e8a2;
  --accent-dim: #059669;
  --accent-rgb: 16, 232, 162;
  --accent-sec: #d1fae5;
  --oled-trace: #34f5b5;
  --surface-bg: #060908;
  --chassis-top: #131917;
  --chassis-bot: #0c1110;
  --pocket-bg: #080b0a;
  --key-top: #1a2320;
  --key-bot: #121816;
}

:root.theme-rose {
  /* Studio Crimson */
  --accent: #f43f5e;
  --accent-dim: #be123c;
  --accent-rgb: 244, 63, 94;
  --accent-sec: #ffe4e6;
  --oled-trace: #fb7185;
  --surface-bg: #090608;
  --chassis-top: #1b1417;
  --chassis-bot: #120d0f;
  --pocket-bg: #0c090a;
  --key-top: #261c20;
  --key-bot: #191215;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  min-height: 100dvh;
  background-color: var(--surface-bg);
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--surface-bg);
  background-image:
    radial-gradient(circle at 50% 0%, rgba(var(--accent-rgb), 0.08) 0%, transparent 55%),
    radial-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px);
  background-size: 100% 100%, 24px 24px;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: max(12px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom));
  overflow-x: hidden;
  overflow-y: auto;
  color: var(--text-main);
  user-select: none;
  -webkit-user-select: none;
}

/* ---- Machined Hardware Chassis ---- */
.deck {
  position: relative;
  width: 432px;
  max-width: 100%;
  background: linear-gradient(180deg, var(--chassis-top) 0%, var(--chassis-bot) 100%);
  border-radius: 22px;
  border: 1px solid rgba(255, 255, 255, 0.09);
  box-shadow:
    0 32px 80px rgba(0, 0, 0, 0.85),
    0 2px 4px rgba(0, 0, 0, 0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.14),
    inset 0 -1px 0 rgba(0, 0, 0, 0.6);
  padding: 16px 16px 18px;
}

/* Corner machined hex-screw details (subtle engineering touch) */
.screw {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #0b0b0e;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.9);
  pointer-events: none;
}
.screw.tl { top: 9px; left: 9px; }
.screw.tr { top: 9px; right: 9px; }
.screw.bl { bottom: 9px; left: 9px; }
.screw.br { bottom: 9px; right: 9px; }

/* ---- Top Engraved Bezel Header ---- */
.deck-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 2px 6px 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  margin-bottom: 12px;
}

.model-stamp {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.model-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: rgba(255, 255, 255, 0.82);
}

.model-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8.5px;
  letter-spacing: 0.12em;
  color: var(--text-dim);
}

.hardware-switches {
  display: flex;
  align-items: center;
  gap: 8px;
}

.micro-switch {
  height: 26px;
  padding: 0 9px;
  border-radius: 6px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8);
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
}

.micro-switch:hover {
  border-color: rgba(255, 255, 255, 0.18);
  color: var(--text-main);
}

.micro-switch:active {
  transform: translateY(1px);
}

.led-pip {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #2a2b32;
  transition: background 0.2s ease, box-shadow 0.2s ease;
}

.micro-switch.eco-on {
  color: #6ee7b7;
  border-color: rgba(16, 185, 129, 0.35);
}

.micro-switch.eco-on .led-pip {
  background: #10e8a2;
  box-shadow: 0 0 6px rgba(16, 232, 162, 0.75);
}

/* Inline 5-Finish Hardware Selector Bar (Zero popup occlusion!) */
.finish-bank {
  display: flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 7px;
  border-radius: 6px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8);
}

.finish-dot {
  width: 11px;
  height: 11px;
  border-radius: 3px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  cursor: pointer;
  opacity: 0.45;
  transition: opacity 0.15s ease, transform 0.15s var(--ease-mech), border-color 0.15s ease;
}

.finish-dot:hover {
  opacity: 0.85;
  transform: scale(1.1);
}

.finish-dot.active {
  opacity: 1;
  border-color: #fff;
  transform: scale(1.14);
}

.finish-dot[data-theme="neon"] { background: #ff4d1a; }
.finish-dot[data-theme="yellow"] { background: #f59e0b; }
.finish-dot[data-theme="blue"] { background: #0ea5e9; }
.finish-dot[data-theme="teal"] { background: #10e8a2; }
.finish-dot[data-theme="rose"] { background: #f43f5e; }

/* ---- Recessed OLED Telemetry Display ---- */
.oled-bezel {
  position: relative;
  border-radius: 12px;
  background: var(--oled-bg);
  border: 1px solid rgba(255, 255, 255, 0.09);
  box-shadow:
    inset 0 2px 12px rgba(0, 0, 0, 0.95),
    0 1px 0 rgba(255, 255, 255, 0.06);
  overflow: hidden;
  margin-bottom: 13px;
  touch-action: pan-y;
  cursor: pointer;
}

/* Subtle anti-reflective glass sheen */
.oled-bezel::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(160deg, rgba(255, 255, 255, 0.032) 0%, transparent 38%);
  pointer-events: none;
  z-index: 4;
}

.oled-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 11px 4px;
  position: relative;
  z-index: 3;
}

.oled-telemetry {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.56);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
}

.oled-telemetry .tag-accent {
  color: var(--accent);
}

.oled-mode-tabs {
  display: flex;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 5px;
  padding: 2px;
  gap: 2px;
}

.oled-tab {
  background: none;
  border: none;
  padding: 2px 6px;
  border-radius: 3px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

.oled-tab:hover { color: #fff; }
.oled-tab.active {
  background: var(--accent);
  color: #070709;
}

.oled-canvas-wrap {
  position: relative;
  width: 100%;
  height: clamp(134px, 21dvh, 174px);
}

#visualizer {
  width: 100%;
  height: 100%;
  display: block;
}

.oled-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 4px 11px 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.04);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
}

.vu-meter {
  flex: 1;
  height: 4px;
  background: rgba(255, 255, 255, 0.07);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}

.vu-fill {
  width: 100%;
  height: 100%;
  transform-origin: left center;
  transform: scaleX(0);
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 72%, #ef4444 100%);
  will-change: transform;
}

.oled-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: rgba(255, 255, 255, 0.45);
  min-width: 72px;
}

.is-playing .oled-status-badge {
  color: var(--accent);
}

.status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.22);
}

.is-playing .status-dot {
  background: var(--accent);
  box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.9);
}

.oled-db {
  min-width: 68px;
  text-align: right;
  color: rgba(255, 255, 255, 0.65);
}

.oled-toast {
  position: absolute;
  bottom: 30px;
  right: 10px;
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(12, 12, 16, 0.92);
  border: 1px solid rgba(var(--accent-rgb), 0.5);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 600;
  color: var(--text-main);
  opacity: 0;
  transform: translateY(4px);
  pointer-events: none;
  transition: opacity 0.16s ease, transform 0.16s ease;
  z-index: 5;
}

.oled-toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* ---- Track Readout Strip ---- */
.track-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 2px;
  margin-bottom: 10px;
}

.track-meta-left {
  flex: 1;
  min-width: 0;
}

.track-name-container {
  width: 100%;
  overflow: hidden;
  position: relative;
  margin-bottom: 3px;
}

.track-name-container.scrolling {
  mask-image: linear-gradient(to right, transparent, #fff 6%, #fff 94%, transparent);
  -webkit-mask-image: linear-gradient(to right, transparent, #fff 6%, #fff 94%, transparent);
}

.track-name {
  display: inline-block;
  font-family: 'Space Grotesk', 'Inter', sans-serif;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.02em;
  white-space: nowrap;
  color: var(--text-main);
}

@keyframes marquee {
  0%, 10% { transform: translate3d(0, 0, 0); }
  90%, 100% { transform: translate3d(var(--scroll-dist), 0, 0); }
}

.track-sub {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: var(--text-muted);
}

.codec-tag {
  padding: 1px 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.85);
  font-weight: 700;
  font-size: 9.5px;
}

.speed-key {
  height: 28px;
  padding: 0 9px;
  border-radius: 6px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.09);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
  cursor: pointer;
  flex-shrink: 0;
  transition: color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}

.speed-key:hover { color: #fff; border-color: rgba(255, 255, 255, 0.2); }
.speed-key:active { transform: translateY(1px); }
.speed-key.boosted {
  color: var(--accent);
  border-color: rgba(var(--accent-rgb), 0.45);
}

/* ---- Calibrated Tape Scrubber ---- */
.scrubber-section {
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 10px;
  padding: 7px 11px 8px;
  margin-bottom: 12px;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
}

.time-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.time-row #currentTime {
  color: var(--text-main);
}

.slider-hitbox {
  width: 100%;
  height: 26px;
  display: flex;
  align-items: center;
  cursor: pointer;
  position: relative;
  touch-action: none;
}

.progress-bar {
  width: 100%;
  height: 8px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 3px;
  position: relative;
  overflow: visible;
  /* Calibrated ruler tick marks in pure CSS */
  background-image: repeating-linear-gradient(
    90deg,
    rgba(255, 255, 255, 0.13) 0px,
    rgba(255, 255, 255, 0.13) 1px,
    transparent 1px,
    transparent 10px
  );
}

.progress-track-clip {
  position: absolute;
  inset: 0;
  border-radius: 3px;
  overflow: hidden;
  pointer-events: none;
}

.progress-buffered {
  position: absolute;
  inset: 0;
  width: 100%;
  transform-origin: left center;
  transform: scaleX(0);
  background: rgba(255, 255, 255, 0.09);
  will-change: transform;
}

.progress-fill {
  position: absolute;
  inset: 0;
  width: 100%;
  transform-origin: left center;
  transform: scaleX(0);
  background: rgba(var(--accent-rgb), 0.72);
  will-change: transform;
}

/* Precision Rectangular Fader Cap */
.progress-thumb {
  position: absolute;
  left: 0;
  top: 50%;
  width: 8px;
  height: 18px;
  margin-left: -4px;
  border-radius: 2px;
  background: #f4f4f0;
  border: 1px solid rgba(0, 0, 0, 0.7);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.8), inset 0 1px 0 #fff;
  transform: translate3d(0px, -50%, 0);
  pointer-events: none;
}

.slider-hitbox.dragging .progress-thumb {
  background: var(--accent);
  border-color: #fff;
}

.seek-tooltip {
  position: absolute;
  bottom: 26px;
  left: 0;
  transform: translate3d(-50%, 4px, 0);
  padding: 2px 7px;
  border-radius: 4px;
  background: #050507;
  border: 1px solid var(--accent);
  color: var(--text-main);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s ease, transform 0.12s ease;
  white-space: nowrap;
  z-index: 15;
}

.slider-hitbox.dragging .seek-tooltip {
  opacity: 1;
  transform: translate3d(-50%, 0, 0);
}

/* ---- Mechanical Keycap Transport Pocket ---- */
.transport-pocket {
  display: grid;
  grid-template-columns: 44px 1fr 1.35fr 1fr 44px;
  gap: 7px;
  padding: 7px;
  border-radius: 14px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.06);
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.85);
  margin-bottom: 12px;
}

.keycap {
  height: 48px;
  border-radius: 9px;
  border: 1px solid var(--key-border);
  background: linear-gradient(180deg, var(--key-top) 0%, var(--key-bot) 100%);
  box-shadow:
    0 3px 6px rgba(0, 0, 0, 0.55),
    inset 0 1px 0 rgba(255, 255, 255, 0.09);
  color: rgba(255, 255, 255, 0.82);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  position: relative;
  transition: transform 0.08s var(--ease-mech), box-shadow 0.08s ease, border-color 0.15s ease, color 0.15s ease;
}

.keycap svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.keycap:hover {
  border-color: rgba(255, 255, 255, 0.2);
  color: #fff;
}

.keycap:active {
  transform: translateY(1.5px);
  box-shadow:
    0 1px 2px rgba(0, 0, 0, 0.65),
    inset 0 1px 3px rgba(0, 0, 0, 0.5);
}

.keycap-led {
  width: 12px;
  height: 3px;
  border-radius: 2px;
  background: #27272e;
  transition: background 0.15s ease, box-shadow 0.15s ease;
}

.keycap.active {
  color: #fff;
  border-color: rgba(var(--accent-rgb), 0.45);
}

.keycap.active .keycap-led {
  background: var(--accent);
  box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.9);
}

/* Signature Tactile Play Key */
.keycap.play-key {
  background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dim) 100%);
  border-color: rgba(255, 255, 255, 0.26);
  color: #08080a;
  box-shadow:
    0 4px 14px rgba(var(--accent-rgb), 0.32),
    inset 0 1px 0 rgba(255, 255, 255, 0.38);
}

.keycap.play-key svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
  stroke: currentColor;
}

.keycap.play-key:hover {
  color: #050507;
  filter: brightness(1.06);
}

.keycap.play-key:active {
  transform: translateY(1.5px);
  box-shadow: 0 1px 6px rgba(var(--accent-rgb), 0.28);
}

/* ---- Volume Attenuator & DSP Bank ---- */
.volume-row {
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px;
  padding: 5px 10px;
  margin-bottom: 10px;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8);
}

.vol-btn {
  background: none;
  border: none;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  cursor: pointer;
}

.vol-btn:hover { color: #fff; }

.vol-btn svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.vol-bar {
  height: 5px;
  background-image: none;
  background-color: rgba(255, 255, 255, 0.08);
}

.vol-thumb {
  width: 6px;
  height: 14px;
  margin-left: -3px;
}

.vol-pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: rgba(255, 255, 255, 0.65);
  min-width: 34px;
  text-align: right;
}

.dsp-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 10px;
}

.dsp-key {
  height: 36px;
  padding: 0 11px;
  border-radius: 9px;
  border: 1px solid var(--key-border);
  background: linear-gradient(180deg, var(--key-top) 0%, var(--key-bot) 100%);
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: transform 0.08s ease, border-color 0.15s ease, color 0.15s ease;
}

.dsp-key:hover { color: #fff; border-color: rgba(255, 255, 255, 0.18); }
.dsp-key:active { transform: translateY(1px); }

.dsp-key.active {
  color: var(--text-main);
  border-color: rgba(var(--accent-rgb), 0.5);
}

.dsp-led {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #27272e;
}

.dsp-key.active .dsp-led {
  background: var(--accent);
  box-shadow: 0 0 7px rgba(var(--accent-rgb), 0.9);
}

/* ---- iOS Background Toggle ---- */
.ios-background-toggle-row {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  padding: 9px 12px;
  margin-bottom: 10px;
}

.is-ios .ios-background-toggle-row { display: flex; }

.ios-bg-text { display: flex; flex-direction: column; gap: 2px; }
.ios-bg-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-main);
}
.ios-bg-sub {
  font-size: 10px;
  color: var(--text-muted);
}

.is-ios-bg-active .volume-row,
.is-ios-bg-active .dsp-row {
  display: none !important;
}

/* Tactile Toggle Switch */
.switch {
  position: relative;
  display: inline-block;
  width: 38px;
  height: 20px;
  flex-shrink: 0;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute;
  inset: 0;
  cursor: pointer;
  background: #1d1e24;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 5px;
  transition: background 0.2s ease, border-color 0.2s ease;
}
.slider:before {
  content: '';
  position: absolute;
  width: 14px;
  height: 14px;
  left: 2px;
  top: 2px;
  border-radius: 3px;
  background: #8e909b;
  transition: transform 0.2s var(--ease-mech), background 0.2s ease;
}
.switch input:checked + .slider {
  background: rgba(var(--accent-rgb), 0.22);
  border-color: var(--accent);
}
.switch input:checked + .slider:before {
  transform: translateX(18px);
  background: var(--accent);
}

/* ---- Index / Playlist Bar Key ---- */
.song-list-btn {
  width: 100%;
  height: 40px;
  padding: 0 13px;
  border-radius: 10px;
  border: 1px solid var(--key-border);
  background: linear-gradient(180deg, var(--key-top) 0%, var(--key-bot) 100%);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  color: var(--text-main);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.07em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: border-color 0.15s ease, transform 0.08s ease;
}

.song-list-btn:hover { border-color: rgba(255, 255, 255, 0.2); }
.song-list-btn:active { transform: translateY(1px); }

.song-list-btn-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.song-list-btn svg {
  width: 15px;
  height: 15px;
  stroke: var(--accent);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.song-count-badge {
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--text-muted);
}

/* ---- Track Matrix Modal / Mobile Bottom Sheet ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(5, 5, 8, 0.78);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 14px;
  opacity: 0;
  pointer-events: none;
  visibility: hidden;
  transition: opacity 0.22s ease, visibility 0.22s ease;
}

.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
  visibility: visible;
}

.modal {
  position: relative;
  width: 432px;
  max-width: 100%;
  max-height: 78dvh;
  background: linear-gradient(180deg, var(--chassis-top) 0%, var(--chassis-bot) 100%);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 18px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 32px 90px rgba(0, 0, 0, 0.9);
  transform: translate3d(0, 16px, 0) scale(0.98);
  transition: transform 0.24s var(--ease-mech);
}

.modal-overlay.open .modal {
  transform: translate3d(0, 0, 0) scale(1);
}

.sheet-handle {
  display: none;
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.22);
  margin: 0 auto 10px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 11px;
}

.modal-title-wrap { display: flex; flex-direction: column; gap: 2px; }

.modal-header h2 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.1em;
}

.modal-subtitle {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.modal-actions { display: flex; align-items: center; gap: 7px; }

.enable-all-btn {
  display: none;
  height: 28px;
  padding: 0 9px;
  border-radius: 6px;
  border: 1px solid rgba(var(--accent-rgb), 0.5);
  background: rgba(var(--accent-rgb), 0.14);
  color: var(--text-main);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
}
.enable-all-btn.visible { display: inline-flex; align-items: center; }

.modal-close {
  height: 28px;
  padding: 0 9px;
  border-radius: 6px;
  background: var(--pocket-bg);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
}
.modal-close:hover { color: #fff; border-color: rgba(255, 255, 255, 0.25); }

.search-container {
  display: flex;
  align-items: center;
  background: var(--oled-bg);
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 8px;
  padding: 0 10px;
  margin-bottom: 10px;
}

.search-container:focus-within {
  border-color: var(--accent);
}

.search-prefix {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  margin-right: 8px;
}

#songSearch {
  background: none;
  border: none;
  outline: none;
  color: var(--text-main);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  padding: 9px 0;
  width: 100%;
}

#songSearch::placeholder { color: var(--text-dim); }

#searchClear {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 4px;
  display: none;
}

.song-list {
  list-style: none;
  overflow-y: auto;
  flex: 1;
  padding-right: 3px;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.song-list::-webkit-scrollbar { width: 4px; }
.song-list::-webkit-scrollbar-track { background: transparent; }
.song-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); border-radius: 2px; }

.song-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 3px;
  border: 1px solid transparent;
  background: rgba(255, 255, 255, 0.015);
  transition: background 0.15s ease, border-color 0.15s ease;
}

.song-item:hover { background: rgba(255, 255, 255, 0.05); }
.song-item.active {
  background: rgba(var(--accent-rgb), 0.12);
  border-color: rgba(var(--accent-rgb), 0.4);
}
.song-item.disabled { opacity: 0.45; }

.song-item .idx-slot {
  width: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
  flex-shrink: 0;
}

.song-item.active .idx-slot { color: var(--accent); }
.song-item .info { flex: 1; min-width: 0; }

.song-item .name {
  font-family: 'Space Grotesk', 'Inter', sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.song-item.disabled .name {
  text-decoration: line-through;
  color: #fca5a5;
}

.song-item .meta-line {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--text-muted);
  margin-top: 2px;
}

.song-empty {
  text-align: center;
  padding: 26px 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  color: var(--text-muted);
}

/* GPU-only LED VU meter inside playlist */
.eq-container {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2px;
  width: 16px;
  height: 12px;
}

.eq-bar {
  width: 3px;
  height: 12px;
  background: var(--accent);
  border-radius: 1px;
  transform-origin: bottom center;
  animation: bounceScaleY 0.68s ease-in-out infinite alternate;
}

.eq-bar:nth-child(2) { animation-duration: 0.48s; animation-delay: 0.12s; }
.eq-bar:nth-child(3) { animation-duration: 0.78s; animation-delay: 0.25s; }

@keyframes bounceScaleY {
  0% { transform: scaleY(0.2); }
  100% { transform: scaleY(1); }
}

.song-toggle {
  position: relative;
  display: inline-block;
  width: 32px;
  height: 18px;
  cursor: pointer;
  flex-shrink: 0;
}
.song-toggle input { opacity: 0; width: 0; height: 0; }
.song-toggle .slider:before {
  width: 12px;
  height: 12px;
  left: 2px;
  top: 2px;
}
.song-toggle input:checked + .slider {
  background: rgba(var(--accent-rgb), 0.22);
  border-color: var(--accent);
}
.song-toggle input:checked + .slider:before {
  transform: translateX(14px);
  background: var(--accent);
}

/* ---- Mobile Responsive Sheet & Proportions ---- */
@media (max-width: 640px) {
  .deck {
    padding: 14px 13px 15px;
    border-radius: 18px;
  }
  .oled-canvas-wrap {
    height: clamp(128px, 21dvh, 160px);
  }
  .transport-pocket {
    grid-template-columns: 40px 1fr 1.3fr 1fr 40px;
    gap: 6px;
    padding: 6px;
  }
  .keycap { height: 46px; }
  .modal-overlay {
    align-items: flex-end;
    padding: 0;
  }
  .modal {
    width: 100%;
    max-height: 82dvh;
    border-radius: 18px 18px 0 0;
    padding: 10px 14px max(16px, env(safe-area-inset-bottom));
    transform: translate3d(0, 100%, 0);
  }
  .modal-overlay.open .modal {
    transform: translate3d(0, 0, 0);
  }
  .sheet-handle { display: block; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<main class="deck" id="player">
  <span class="screw tl" aria-hidden="true"></span>
  <span class="screw tr" aria-hidden="true"></span>
  <span class="screw bl" aria-hidden="true"></span>
  <span class="screw br" aria-hidden="true"></span>

  <header class="deck-top">
    <div class="model-stamp">
      <span class="model-code">DECK-01</span>
      <span class="model-sub">AUDIO FIELD UNIT</span>
    </div>
    <div class="hardware-switches">
      <button id="ecoToggle" class="micro-switch" title="Эко-режим (30Hz, минимум нагрева телефона)" aria-label="Эко-режим">
        <span class="led-pip"></span>
        <span id="ecoLabel">ECO</span>
      </button>
      <div class="finish-bank" role="group" aria-label="Палитра дисплея">
        <button class="finish-dot" data-theme="neon" title="Signal Carbon"></button>
        <button class="finish-dot" data-theme="yellow" title="Amber CRT"></button>
        <button class="finish-dot" data-theme="blue" title="Cobalt"></button>
        <button class="finish-dot" data-theme="teal" title="Oscilloscope Mint"></button>
        <button class="finish-dot" data-theme="rose" title="Studio Crimson"></button>
      </div>
    </div>
  </header>

  <section class="oled-bezel" id="artwork" title="Тап: Play/Pause · Свайп влево/вправо: переключение трека">
    <div class="oled-header">
      <div class="oled-telemetry">
        <span class="tag-accent" id="trackCounter">TRK 00/00</span>
        <span id="sampleRateReadout">48.0kHz</span>
      </div>
      <div class="oled-mode-tabs" role="tablist" aria-label="Режим анализатора">
        <button class="oled-tab" data-vis="0" role="tab">SPEC</button>
        <button class="oled-tab" data-vis="1" role="tab">SCOPE</button>
        <button class="oled-tab" data-vis="2" role="tab">PHASE</button>
      </div>
    </div>

    <div class="oled-canvas-wrap">
      <canvas id="visualizer"></canvas>
    </div>

    <div class="oled-footer">
      <span class="oled-status-badge">
        <span class="status-dot"></span>
        <span id="oledState">STANDBY</span>
      </span>
      <div class="vu-meter" aria-hidden="true">
        <div class="vu-fill" id="vuFill"></div>
      </div>
      <span class="oled-db" id="dbReadout">-∞ dBFS</span>
    </div>

    <div class="oled-toast" id="artToast"></div>
  </section>

  <section class="track-strip">
    <div class="track-meta-left">
      <div class="track-name-container" id="trackNameContainer">
        <div class="track-name" id="trackName">Выберите трек</div>
      </div>
      <div class="track-sub">
        <span class="codec-tag" id="codecBadge">PCM</span>
        <span id="trackArtist">Нажмите PLAY или свайпните OLED</span>
      </div>
    </div>
    <button class="speed-key" id="speedBtn" title="Скорость воспроизведения">1.0×</button>
  </section>

  <section class="scrubber-section">
    <div class="time-row">
      <span id="currentTime">00:00</span>
      <span id="totalTime">00:00</span>
    </div>
    <div class="slider-hitbox" id="progressHitbox">
      <div class="progress-bar" id="progressBar">
        <div class="progress-track-clip">
          <div class="progress-buffered" id="progressBuffered"></div>
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
      <div class="seek-tooltip" id="seekTooltip">00:00</div>
    </div>
  </section>

  <section class="transport-pocket">
    <button class="keycap" id="shuffleBtn" title="Перемешать" aria-label="Перемешать">
      <span class="keycap-led"></span>
      <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
    </button>
    <button class="keycap" id="prevBtn" title="Предыдущий трек" aria-label="Предыдущий">
      <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="4" x2="5" y2="20"/></svg>
    </button>
    <button class="keycap play-key" id="playBtn" title="Воспроизвести / Пауза" aria-label="Воспроизвести или пауза">
      <svg viewBox="0 0 24 24" id="playIcon"><polygon points="7 4 20 12 7 20 7 4"/></svg>
      <svg viewBox="0 0 24 24" id="pauseIcon" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    </button>
    <button class="keycap" id="nextBtn" title="Следующий трек" aria-label="Следующий">
      <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="4" x2="19" y2="20"/></svg>
    </button>
    <button class="keycap" id="repeatBtn" title="Повтор" aria-label="Повтор">
      <span class="keycap-led"></span>
      <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    </button>
  </section>

  <section class="volume-row">
    <button class="vol-btn" id="muteBtn" title="Отключить / включить звук" aria-label="Громкость">
      <svg viewBox="0 0 24 24" id="volIcon">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path id="volWave" d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </button>
    <div class="slider-hitbox" id="volumeHitbox">
      <div class="progress-bar vol-bar" id="volumeBar">
        <div class="progress-track-clip">
          <div class="progress-fill" id="volumeFill"></div>
        </div>
        <div class="progress-thumb vol-thumb" id="volumeThumb"></div>
      </div>
    </div>
    <span class="vol-pct" id="volPct">70%</span>
  </section>

  <section class="ios-background-toggle-row" id="iosBgToggleRow">
    <div class="ios-bg-text">
      <span class="ios-bg-label">IOS BACKGROUND BYPASS</span>
      <span class="ios-bg-sub">Отключает WebAudio для игры на заблокированном экране</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="iosBgCheckbox" checked>
      <span class="slider"></span>
    </label>
  </section>

  <section class="dsp-row">
    <button id="bassBoostBtn" class="dsp-key" title="Low-shelf фильтр +12 дБ @ 150 Гц">
      <span>BASS +12dB</span>
      <span class="dsp-led"></span>
    </button>
    <button id="spatialBtn" class="dsp-key" title="Динамическая 3D-панорама">
      <span>3D PHASE</span>
      <span class="dsp-led"></span>
    </button>
  </section>

  <button class="song-list-btn" id="songListBtn">
    <span class="song-list-btn-left">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      TRACK INDEX
    </span>
    <span class="song-count-badge" id="songCountBadge">0 TRACKS</span>
  </button>
</main>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="playlistTitle">
  <div class="modal" id="playlistModal">
    <div class="sheet-handle" id="sheetHandle"></div>
    <div class="modal-header">
      <div class="modal-title-wrap">
        <h2 id="playlistTitle">TRACK INDEX</h2>
        <span class="modal-subtitle" id="playlistStats">LOADING...</span>
      </div>
      <div class="modal-actions">
        <button class="enable-all-btn" id="enableAllBtn">ENABLE ALL</button>
        <button class="modal-close" id="modalClose" aria-label="Закрыть">ESC</button>
      </div>
    </div>
    <div class="search-container">
      <span class="search-prefix">&gt;</span>
      <input type="text" id="songSearch" placeholder="Фильтр по названию..." autocomplete="off">
      <button id="searchClear" aria-label="Очистить">CLR</button>
    </div>
    <ul class="song-list" id="songList"></ul>
  </div>
</div>

<script>
(() => {
  'use strict';

  if (window.location.protocol === 'file:') {
    document.body.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:32px;text-align:center;font-family:JetBrains Mono,monospace;color:#f3f3ef;background:#08080a;gap:14px">
        <div style="font-size:13px;color:#ff4d1a;letter-spacing:0.12em">ERR // FILE_PROTOCOL_BLOCKED</div>
