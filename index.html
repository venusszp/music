<script>
(() => {
  'use strict';

  if (window.location.protocol === 'file:') {
    document.body.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:32px;text-align:center;font-family:JetBrains Mono,monospace;color:#f4f3ef;background:#070709;gap:14px">
        <div style="font-size:13px;color:#ff4d1a;letter-spacing:0.12em">ERR // FILE_PROTOCOL_BLOCKED</div>
        <h2 style="font-weight:700;font-size:19px">Откройте через HTTP-сервер</h2>
        <p style="color:#82838e;max-width:410px;line-height:1.6;font-size:13px">
          Плеер требует HTTP для загрузки <code>music.json</code> и аудиопотока.
          Запустите <code>python -m http.server 8080</code> и откройте <code>http://localhost:8080</code>
        </p>
      </div>`;
    return;
  }

  // ===================================================================
  //  ENVIRONMENT & COLD-SILICON THERMAL GOVERNOR
  // ===================================================================
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isMobileDevice = window.innerWidth <= 919 ||
    /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
    window.matchMedia('(pointer: coarse)').matches;
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (isIOS) document.documentElement.classList.add('is-ios');

  const savedEco = localStorage.getItem('ecoMode');
  let ecoMode = savedEco !== null ? savedEco === 'true' : (isMobileDevice || prefersReducedMotion);
  let iosBackgroundMode = localStorage.getItem('iosBackgroundMode') !== 'false';

  const THEMES = {
    neon:   { hex: '#ff4d1a', rgb: [255, 77, 26],  secRgb: [242, 241, 236], bg: '#070709', name: 'Obsidian Signal' },
    yellow: { hex: '#f5a623', rgb: [245, 166, 35], secRgb: [253, 245, 228], bg: '#080705', name: 'Gold Horology' },
    blue:   { hex: '#22d3ee', rgb: [34, 211, 238], secRgb: [232, 248, 255], bg: '#05080c', name: 'Deep Sonar' },
    teal:   { hex: '#10e8a2', rgb: [16, 232, 162], secRgb: [229, 252, 243], bg: '#050908', name: 'Phosphor Lab' },
    rose:   { hex: '#fb3765', rgb: [251, 55, 101], secRgb: [255, 232, 238], bg: '#090507', name: 'Laser Monolith' }
  };

  const SPEEDS = [1.0, 1.15, 1.25, 1.5, 0.85];

  // ===================================================================
  //  DOM REFERENCES
  // ===================================================================
  const playerEl = document.getElementById('player');
  const visCanvas = document.getElementById('visualizer');
  const visCtx = visCanvas.getContext('2d', { alpha: false });
  const artworkEl = document.getElementById('artwork');
  const artToastEl = document.getElementById('artToast');

  const renderStateLabel = document.getElementById('renderStateLabel');
  const ecoToggle = document.getElementById('ecoToggle');
  const ecoLabel = document.getElementById('ecoLabel');
  const trackCounterEl = document.getElementById('trackCounter');
  const sampleRateReadout = document.getElementById('sampleRateReadout');
  const oledStateEl = document.getElementById('oledState');
  const vuFillEl = document.getElementById('vuFill');
  const dbReadoutEl = document.getElementById('dbReadout');
  const bandSubEl = document.getElementById('bandSub');
  const bandMidEl = document.getElementById('bandMid');
  const bandAirEl = document.getElementById('bandAir');

  const trackNameContainer = document.getElementById('trackNameContainer');
  const trackNameEl = document.getElementById('trackName');
  const trackArtistEl = document.getElementById('trackArtist');
  const codecBadgeEl = document.getElementById('codecBadge');
  const speedBtn = document.getElementById('speedBtn');

  const progressHitbox = document.getElementById('progressHitbox');
  const progressBar = document.getElementById('progressBar');
  const progressBuffered = document.getElementById('progressBuffered');
  const progressFill = document.getElementById('progressFill');
  const progressThumb = document.getElementById('progressThumb');
  const seekTooltip = document.getElementById('seekTooltip');
  const currentTimeEl = document.getElementById('currentTime');
  const totalTimeEl = document.getElementById('totalTime');

  const volumeHitbox = document.getElementById('volumeHitbox');
  const volumeBar = document.getElementById('volumeBar');
  const volumeFill = document.getElementById('volumeFill');
  const volumeThumb = document.getElementById('volumeThumb');
  const muteBtn = document.getElementById('muteBtn');
  const volWave = document.getElementById('volWave');
  const volPctEl = document.getElementById('volPct');

  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const bassBoostBtn = document.getElementById('bassBoostBtn');
  const airBoostBtn = document.getElementById('airBoostBtn');
  const spatialBtn = document.getElementById('spatialBtn');
  const songListBtn = document.getElementById('songListBtn');
  const songCountBadge = document.getElementById('songCountBadge');

  const modalOverlay = document.getElementById('modalOverlay');
  const playlistModal = document.getElementById('playlistModal');
  const modalClose = document.getElementById('modalClose');
  const playlistStats = document.getElementById('playlistStats');
  const enableAllBtn = document.getElementById('enableAllBtn');
  const songSearch = document.getElementById('songSearch');
  const searchClear = document.getElementById('searchClear');
  const songListEl = document.getElementById('songList');

  // ===================================================================
  //  STATE
  // ===================================================================
  let themeMode = localStorage.getItem('themeMode') || 'neon';
  if (!THEMES[themeMode]) themeMode = 'neon';
  let visualizerStyle = parseInt(localStorage.getItem('visualizerStyle') || '0', 10) % 4;
  if (isNaN(visualizerStyle) || visualizerStyle < 0) visualizerStyle = 0;

  let isPlaying = false;
  let audio = new Audio();
  let currentAudioCtx = null;
  let analyser = null;
  let source = null;
  let bassFilter = null;
  let airFilter = null;
  let pannerNode = null;
  let gainNode = null;
  let freqData = new Uint8Array(128);
  let timeData = new Uint8Array(256).fill(128);
  let bufferLength = 128;

  let currentIndex = -1;
  let shuffleOn = false;
  let repeatOn = false;
  let shuffleOrder = [];
  let shuffleIndex = 0;
  let songFiles = [];
  let disabledSongs = JSON.parse(localStorage.getItem('disabledSongs') || '[]');

  let bassBoostActive = false;
  let airBoostActive = false;
  let spatialAudioActive = false;
  let targetVolume = 0.7;
  let preMuteVolume = 0.7;
  let speedIdx = 0;
  let fadeRafId = null;
  let isFadingOut = false;
  let isSeeking = false;
  let isAudioBusy = false;
  let isSwitchingBgMode = false;
  let searchQuery = '';
  let toastTimer = null;

  function showToast(msg) {
    artToastEl.textContent = msg;
    artToastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => artToastEl.classList.remove('show'), 1400);
  }

  // ===================================================================
  //  KINETIC ACOUSTIC SCULPTURE ENGINE
  //  (CYMATICS MANDALA / 3D SPECTRAL TERRAIN / TRIGGERED SCOPE / PHASE)
  // ===================================================================
  let visW = 480;
  let visH = 260;
  let visRafId = null;
  let lastVisTime = 0;
  let smoothedDb = -60;
  let smoothedVu = 0;
  let subLevel = 0;
  let midLevel = 0;
  let airLevel = 0;

  // Interactive Cymatic Resonance Probe (touch/cursor disturbs standing wave!)
  const probe = { x: 0.5, y: 0.5, energy: 0 };

  // Pre-allocated 3D Spectral Terrain History Ring Buffer (18 rows x 34 cols)
  const TERRAIN_ROWS = 18;
  const TERRAIN_COLS = 34;
  const terrainHistory = Array.from({ length: TERRAIN_ROWS }, () => new Float32Array(TERRAIN_COLS));
  let terrainHead = 0;
  let terrainFrameStep = 0;

  // Pre-allocated Cymatic Polygon Buffers (zero GC allocation per frame!)
  const CYM_PTS = 180;
  const cymX = new Float32Array(CYM_PTS);
  const cymY = new Float32Array(CYM_PTS);
  const cymInnerX = new Float32Array(CYM_PTS);
  const cymInnerY = new Float32Array(CYM_PTS);
  let cymPhase = 0;

  function resizeVisualizer() {
    const rect = visCanvas.getBoundingClientRect();
    visW = Math.max(220, Math.round(rect.width || 480));
    visH = Math.max(130, Math.round(rect.height || 240));
    const dpr = Math.min(window.devicePixelRatio || 1, ecoMode ? 1.35 : 1.75);
    visCanvas.width = Math.round(visW * dpr);
    visCanvas.height = Math.round(visH * dpr);
    visCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    renderVisualizerFrame(performance.now(), !isPlaying);
  }

  function wakeVisualizer() {
    if (visRafId || document.hidden) return;
    lastVisTime = 0;
    renderStateLabel.textContent = ecoMode ? 'ACTIVE 30HZ' : 'ACTIVE 60HZ';
    visRafId = requestAnimationFrame(loopVisualizer);
  }

  function stopVisualizer() {
    if (visRafId) {
      cancelAnimationFrame(visRafId);
      visRafId = null;
    }
    renderStateLabel.textContent = 'IDLE SLEEP';
  }

  function loopVisualizer(now) {
    visRafId = null;
    if (document.hidden) {
      renderStateLabel.textContent = 'IDLE SLEEP';
      return;
    }

    const minInterval = ecoMode ? 33.3 : 16.6;
    if (lastVisTime && (now - lastVisTime < minInterval)) {
      visRafId = requestAnimationFrame(loopVisualizer);
      return;
    }
    lastVisTime = now;

    const keepRunning = renderVisualizerFrame(now, false);
    if (keepRunning) {
      visRafId = requestAnimationFrame(loopVisualizer);
    } else {
      renderStateLabel.textContent = 'IDLE SLEEP';
    }
  }

  function sampleAudioSignal(now) {
    const activePlay = isPlaying && !audio.paused;
    let hasRealSignal = false;

    if (analyser && activePlay) {
      try {
        analyser.getByteFrequencyData(freqData);
        analyser.getByteTimeDomainData(timeData);
        for (let i = 0; i < 24; i++) {
          if (freqData[i] > 0) { hasRealSignal = true; break; }
        }
      } catch (e) {}
    }

    if (activePlay && !hasRealSignal) {
      // Phase-coherent acoustic synthesis fallback (for iOS background bypass)
      const t = now * 0.001 + (audio.currentTime || 0) * 0.55;
      for (let i = 0; i < freqData.length; i++) {
        const beat = Math.pow(Math.max(0, Math.sin(t * 4.2)), 4) * (i < 12 ? 115 : 28);
        const harmonic = Math.abs(Math.sin(t * 2.1 + i * 0.19) * Math.cos(t * 0.85 + i * 0.09)) * 125;
        freqData[i] = Math.min(255, 18 + beat + harmonic);
      }
      for (let i = 0; i < timeData.length; i++) {
        const ph = (i / timeData.length) * Math.PI * 4 + t * 8.5;
        const env = 0.35 + Math.sin(t * 4.2) * 0.25;
        const s = Math.sin(ph) * 0.65 + Math.sin(ph * 2.5 + 0.7) * 0.26 + Math.cos(ph * 0.5) * 0.16;
        timeData[i] = Math.max(0, Math.min(255, Math.round(128 + s * 86 * env)));
      }
      return true;
    }

    if (hasRealSignal) return true;

    let maxVal = 0;
    for (let i = 0; i < freqData.length; i++) {
      freqData[i] = Math.floor(freqData[i] * 0.80);
      if (freqData[i] > maxVal) maxVal = freqData[i];
    }
    for (let i = 0; i < timeData.length; i++) {
      timeData[i] = Math.round(128 + (timeData[i] - 128) * 0.78);
    }
    probe.energy *= 0.9;
    return maxVal > 2 || probe.energy > 0.015;
  }

  function updateBandMeters() {
    let s = 0, m = 0, a = 0;
    for (let i = 0; i < 6; i++) s += freqData[i];
    for (let i = 6; i < 24; i++) m += freqData[i];
    for (let i = 24; i < 56; i++) a += freqData[i];
    subLevel += ((s / (6 * 255)) - subLevel) * 0.28;
    midLevel += ((m / (18 * 255)) - midLevel) * 0.28;
    airLevel += ((a / (32 * 255)) - airLevel) * 0.28;

    bandSubEl.style.transform = `scaleY(${subLevel.toFixed(3)})`;
    bandMidEl.style.transform = `scaleY(${midLevel.toFixed(3)})`;
    bandAirEl.style.transform = `scaleY(${airLevel.toFixed(3)})`;
  }

  function renderVisualizerFrame(now, forceIdle) {
    if (forceIdle) {
      freqData.fill(0);
      timeData.fill(128);
      smoothedVu = 0;
      smoothedDb = -60;
      subLevel = midLevel = airLevel = 0;
    }

    const signalAlive = forceIdle ? false : sampleAudioSignal(now);
    updateBandMeters();

    // Real RMS & dBFS computation
    let sumSq = 0;
    for (let i = 0; i < timeData.length; i++) {
      const n = (timeData[i] - 128) / 128;
      sumSq += n * n;
    }
    const rms = Math.sqrt(sumSq / timeData.length);
    const instVu = Math.min(1, rms * 1.9);
    smoothedVu += (instVu - smoothedVu) * 0.28;
    const db = rms > 0.002 ? Math.max(-48, Math.min(0, 20 * Math.log10(rms))) : -60;
    smoothedDb += (db - smoothedDb) * 0.22;

    if (signalAlive || smoothedVu > 0.01) {
      vuFillEl.style.transform = `scaleX(${smoothedVu.toFixed(3)})`;
      dbReadoutEl.textContent = smoothedDb <= -47 ? '-∞ dBFS' : `${smoothedDb.toFixed(1)} dBFS`;
    } else {
      vuFillEl.style.transform = 'scaleX(0)';
      dbReadoutEl.textContent = '-∞ dBFS';
    }

    const w = visW;
    const h = visH;
    const theme = THEMES[themeMode];

    visCtx.fillStyle = '#040406';
    visCtx.fillRect(0, 0, w, h);

    if (visualizerStyle === 0) {
      drawCymaticsMandala(w, h, theme);
    } else if (visualizerStyle === 1) {
      drawSpectralTerrain(w, h, theme, signalAlive);
    } else if (visualizerStyle === 2) {
      drawTriggeredOscilloscope(w, h, theme);
    } else {
      drawPhaseVectorscope(w, h, theme);
    }

    return signalAlive || smoothedVu > 0.01;
  }

  // -------------------------------------------------------------------
  // MODE 0: CYMATICS (Polar Chladni Acoustic Standing-Wave Interference)
  // -------------------------------------------------------------------
  function drawCymaticsMandala(w, h, theme) {
    const cx = w * 0.5;
    const cy = h * 0.5;
    const baseR = Math.min(w, h) * 0.35;
    const [r, g, b] = theme.rgb;
    const [sr, sg, sb] = theme.secRgb;

    if (isPlaying && !audio.paused) {
      cymPhase += 0.022 + subLevel * 0.035;
    } else if (probe.energy > 0.01) {
      cymPhase += 0.015;
    }

    // Polar harmonic calibration rings & azimuth ticks
    visCtx.strokeStyle = 'rgba(255,255,255,0.055)';
    visCtx.lineWidth = 1;
    visCtx.beginPath();
    visCtx.arc(cx, cy, baseR * 0.42, 0, Math.PI * 2);
    visCtx.arc(cx, cy, baseR * 0.84, 0, Math.PI * 2);
    visCtx.arc(cx, cy, baseR * 1.18, 0, Math.PI * 2);
    visCtx.stroke();

    // 12 radial degree ticks around outer ring
    visCtx.beginPath();
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2;
      const cos = Math.cos(a);
      const sin = Math.sin(a);
      visCtx.moveTo(cx + cos * baseR * 1.13, cy + sin * baseR * 1.13);
      visCtx.lineTo(cx + cos * baseR * 1.22, cy + sin * baseR * 1.22);
    }
    visCtx.strokeStyle = 'rgba(255,255,255,0.12)';
    visCtx.stroke();

    // Harmonic modes shift smoothly with Sub/Mid/Air balance
    const m1 = 4 + Math.round(midLevel * 3);
    const m2 = 7 + Math.round(airLevel * 4);
    const amp1 = 0.04 + subLevel * 0.24;
    const amp2 = 0.02 + midLevel * 0.16;
    const probePx = probe.x * w;
    const probePy = probe.y * h;
    const probeDistScale = baseR * 0.7;

    for (let i = 0; i < CYM_PTS; i++) {
      const theta = (i / CYM_PTS) * Math.PI * 2;
      const bin = Math.floor((i / CYM_PTS) * 40);
      const binVal = (freqData[bin] / 255) * 0.18;

      const waveOuter = 1 + amp1 * Math.cos(m1 * theta + cymPhase)
        + amp2 * Math.sin(m2 * theta - cymPhase * 1.35)
        + binVal;
      const waveInner = 0.64 + amp2 * Math.cos((m1 + 2) * theta - cymPhase * 0.9)
        + (airLevel * 0.14) * Math.sin((m2 + 3) * theta + cymPhase * 1.7);

      let ox = cx + Math.cos(theta) * baseR * waveOuter;
      let oy = cy + Math.sin(theta) * baseR * waveOuter;

      // Interactive finger/cursor acoustic field deformation
      if (probe.energy > 0.01) {
        const dx = ox - probePx;
        const dy = oy - probePy;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < probeDistScale && d > 1) {
          const push = (1 - d / probeDistScale) * probe.energy * 26;
          ox += (dx / d) * push;
          oy += (dy / d) * push;
        }
      }

      cymX[i] = ox;
      cymY[i] = oy;
      cymInnerX[i] = cx + Math.cos(theta) * baseR * waveInner;
      cymInnerY[i] = cy + Math.sin(theta) * baseR * waveInner;
    }

    // Harmonic Chladni interference chords (connect outer peaks to inner anti-nodes)
    const chordStep = ecoMode ? 9 : 6;
    visCtx.beginPath();
    for (let i = 0; i < CYM_PTS; i += chordStep) {
      const target = (i + 30) % CYM_PTS;
      visCtx.moveTo(cymX[i], cymY[i]);
      visCtx.lineTo(cymInnerX[target], cymInnerY[target]);
    }
    visCtx.strokeStyle = `rgba(${r},${g},${b},${0.16 + subLevel * 0.25})`;
    visCtx.lineWidth = 0.85;
    visCtx.stroke();

    // Inner Bone-White Standing Wave Contour
    visCtx.beginPath();
    for (let i = 0; i < CYM_PTS; i++) {
      if (i === 0) visCtx.moveTo(cymInnerX[i], cymInnerY[i]);
      else visCtx.lineTo(cymInnerX[i], cymInnerY[i]);
    }
    visCtx.closePath();
    visCtx.strokeStyle = `rgba(${sr},${sg},${sb},${0.32 + midLevel * 0.55})`;
    visCtx.lineWidth = 1.25;
    visCtx.stroke();

    // Outer Signal-Colored Chladni Membrane Contour
    visCtx.beginPath();
    for (let i = 0; i < CYM_PTS; i++) {
      if (i === 0) visCtx.moveTo(cymX[i], cymY[i]);
      else visCtx.lineTo(cymX[i], cymY[i]);
    }
    visCtx.closePath();
    visCtx.strokeStyle = `rgba(${r},${g},${b},0.28)`;
    visCtx.lineWidth = 4.2;
    visCtx.stroke();
    visCtx.strokeStyle = theme.hex;
    visCtx.lineWidth = 1.7;
    visCtx.stroke();

    // Center acoustic core dot pulsing cleanly with bass
    visCtx.beginPath();
    visCtx.arc(cx, cy, 3 + subLevel * 5, 0, Math.PI * 2);
    visCtx.fillStyle = theme.hex;
    visCtx.fill();
  }

  // -------------------------------------------------------------------
  // MODE 1: 3D PERSPECTIVE SPECTRAL TERRAIN (Scrolling Memory Ridges)
  // -------------------------------------------------------------------
  function drawSpectralTerrain(w, h, theme, signalAlive) {
    if (signalAlive) {
      terrainFrameStep++;
      if (terrainFrameStep % (ecoMode ? 2 : 2) === 0) {
        const row = terrainHistory[terrainHead];
        for (let c = 0; c < TERRAIN_COLS; c++) {
          // Symmetric acoustic mountain silhouette (bass peak at center, highs on wings)
          const distCenter = Math.abs(c - (TERRAIN_COLS - 1) * 0.5) / ((TERRAIN_COLS - 1) * 0.5);
          const bin = Math.min(freqData.length - 1, Math.floor(distCenter * 38));
          const env = 0.25 + 0.75 * Math.cos(distCenter * Math.PI * 0.48);
          row[c] = (freqData[bin] / 255) * env;
        }
        terrainHead = (terrainHead + 1) % TERRAIN_ROWS;
      }
    }

    const horizonY = h * 0.15;
    const baseDepthSpan = h * 0.72;
    const [r, g, b] = theme.rgb;
    const [sr, sg, sb] = theme.secRgb;

    // Subtle vanishing perspective guide lines
    visCtx.strokeStyle = 'rgba(255,255,255,0.04)';
    visCtx.lineWidth = 1;
    visCtx.beginPath();
    for (let k = -2; k <= 2; k++) {
      visCtx.moveTo(w * 0.54 + k * (w * 0.08), horizonY);
      visCtx.lineTo(w * 0.54 + k * (w * 0.21), horizonY + baseDepthSpan);
    }
    visCtx.stroke();

    // Painter's Algorithm: draw farthest row first, nearest row last with #040406 occlusion fill!
    for (let depth = TERRAIN_ROWS - 1; depth >= 0; depth--) {
      const idx = (terrainHead - 1 - depth + TERRAIN_ROWS * 2) % TERRAIN_ROWS;
      const slice = terrainHistory[idx];
      const tNorm = 1 - depth / (TERRAIN_ROWS - 1); // 0 = far horizon, 1 = front crest
      const yBase = horizonY + baseDepthSpan * Math.pow(tNorm, 1.32);
      const rowWidth = w * (0.34 + 0.44 * tNorm);
      const xStart = w * 0.54 - rowWidth * 0.5;
      const stepX = rowWidth / (TERRAIN_COLS - 1);
      const ridgeAmp = h * (0.14 + 0.28 * tNorm);

      // 1. Solid occlusion silhouette fill (blocks ridges behind it)
      visCtx.beginPath();
      visCtx.moveTo(xStart, yBase + 16);
      for (let c = 0; c < TERRAIN_COLS; c++) {
        const px = xStart + c * stepX;
        const py = yBase - slice[c] * ridgeAmp;
        if (c === 0) visCtx.lineTo(px, py);
        else {
          const prevX = xStart + (c - 1) * stepX;
          const prevY = yBase - slice[c - 1] * ridgeAmp;
          visCtx.quadraticCurveTo(prevX, prevY, (prevX + px) * 0.5, (prevY + py) * 0.5);
        }
      }
      visCtx.lineTo(xStart + rowWidth, yBase - slice[TERRAIN_COLS - 1] * ridgeAmp);
      visCtx.lineTo(xStart + rowWidth, yBase + 16);
      visCtx.closePath();
      visCtx.fillStyle = '#040406';
      visCtx.fill();

      // 2. Stroke ONLY the open upper mountain crest (never bottom box line)
      visCtx.beginPath();
      for (let c = 0; c < TERRAIN_COLS; c++) {
        const px = xStart + c * stepX;
        const py = yBase - slice[c] * ridgeAmp;
        if (c === 0) visCtx.moveTo(px, py);
        else {
          const prevX = xStart + (c - 1) * stepX;
          const prevY = yBase - slice[c - 1] * ridgeAmp;
          visCtx.quadraticCurveTo(prevX, prevY, (prevX + px) * 0.5, (prevY + py) * 0.5);
        }
      }
      visCtx.lineTo(xStart + rowWidth, yBase - slice[TERRAIN_COLS - 1] * ridgeAmp);

      const alpha = 0.14 + Math.pow(tNorm, 1.5) * 0.86;
      if (depth === 0) {
        visCtx.strokeStyle = `rgba(${r},${g},${b},0.34)`;
        visCtx.lineWidth = 4;
        visCtx.stroke();
        visCtx.strokeStyle = theme.hex;
        visCtx.lineWidth = 1.75;
      } else if (depth <= 2) {
        visCtx.strokeStyle = `rgba(${sr},${sg},${sb},${alpha * 0.74})`;
        visCtx.lineWidth = 1.15;
      } else {
        visCtx.strokeStyle = `rgba(${r},${g},${b},${alpha * 0.58})`;
        visCtx.lineWidth = 1;
      }
      visCtx.stroke();
    }
  }

  // -------------------------------------------------------------------
  // MODE 2: TRIGGERED DUAL-BEAM OSCILLOSCOPE
  // -------------------------------------------------------------------
  function drawTriggeredOscilloscope(w, h, theme) {
    const padX = 14;
    const cy = h * 0.5;
    const amp = h * 0.4;

    visCtx.strokeStyle = 'rgba(255,255,255,0.05)';
    visCtx.lineWidth = 1;
    for (let c = 0; c <= 10; c++) {
      const gx = Math.round(padX + (c / 10) * (w - padX * 2)) + 0.5;
      visCtx.beginPath();
      visCtx.moveTo(gx, 10);
      visCtx.lineTo(gx, h - 10);
      visCtx.stroke();
    }
    for (let r = 1; r <= 3; r++) {
      const gy = Math.round((r / 4) * h) + 0.5;
      visCtx.beginPath();
      visCtx.moveTo(padX, gy);
      visCtx.lineTo(w - padX, gy);
      visCtx.stroke();
    }

    visCtx.strokeStyle = 'rgba(255,255,255,0.14)';
    visCtx.beginPath();
    visCtx.moveTo(padX, Math.round(cy) + 0.5);
    visCtx.lineTo(w - padX, Math.round(cy) + 0.5);
    visCtx.stroke();

    let triggerIdx = 0;
    const halfLen = Math.floor(timeData.length * 0.5);
    for (let i = 1; i < halfLen; i++) {
      if (timeData[i - 1] < 128 && timeData[i] >= 128) {
        triggerIdx = i;
        break;
      }
    }

    const drawSamples = timeData.length - triggerIdx;
    const dx = (w - padX * 2) / Math.max(1, drawSamples - 1);

    // Secondary inverted sub-harmonic echo trace
    visCtx.beginPath();
    for (let i = 0; i < drawSamples; i += 2) {
      const v = (timeData[triggerIdx + i] - 128) / 128;
      const x = padX + i * dx;
      const y = cy + v * amp * 0.42;
      if (i === 0) visCtx.moveTo(x, y);
      else visCtx.lineTo(x, y);
    }
    visCtx.strokeStyle = `rgba(${theme.secRgb[0]},${theme.secRgb[1]},${theme.secRgb[2]},0.22)`;
    visCtx.lineWidth = 1;
    visCtx.stroke();

    // Primary trigger-locked phosphor trace
    visCtx.beginPath();
    for (let i = 0; i < drawSamples; i++) {
      const v = (timeData[triggerIdx + i] - 128) / 128;
      const x = padX + i * dx;
      const y = cy - v * amp;
      if (i === 0) visCtx.moveTo(x, y);
      else visCtx.lineTo(x, y);
    }
    visCtx.strokeStyle = `rgba(${theme.rgb[0]},${theme.rgb[1]},${theme.rgb[2]},0.26)`;
    visCtx.lineWidth = 4.5;
    visCtx.stroke();
    visCtx.strokeStyle = theme.hex;
    visCtx.lineWidth = 1.75;
    visCtx.stroke();
  }

  // -------------------------------------------------------------------
  // MODE 3: PHASE VECTORSCOPE (Goniometer + Stereo Peak Bars)
  // -------------------------------------------------------------------
  function drawPhaseVectorscope(w, h, theme) {
    const cx = w * 0.5;
    const cy = h * 0.5;
    const rad = Math.min(w, h) * 0.4;

    visCtx.strokeStyle = 'rgba(255,255,255,0.065)';
    visCtx.lineWidth = 1;
    visCtx.beginPath();
    visCtx.arc(cx, cy, rad, 0, Math.PI * 2);
    visCtx.arc(cx, cy, rad * 0.55, 0, Math.PI * 2);
    visCtx.moveTo(cx - rad, cy);
    visCtx.lineTo(cx + rad, cy);
    visCtx.moveTo(cx, cy - rad);
    visCtx.lineTo(cx, cy + rad);
    const diag = rad * 0.707;
    visCtx.moveTo(cx - diag, cy - diag);
    visCtx.lineTo(cx + diag, cy + diag);
    visCtx.moveTo(cx - diag, cy + diag);
    visCtx.lineTo(cx + diag, cy - diag);
    visCtx.stroke();

    visCtx.font = '600 8.5px "JetBrains Mono", monospace';
    visCtx.fillStyle = 'rgba(255,255,255,0.34)';
    visCtx.textAlign = 'center';
    visCtx.fillText('+MONO', cx, cy - rad - 5);
    visCtx.fillText('L', cx - diag - 10, cy - diag + 4);
    visCtx.fillText('R', cx + diag + 10, cy - diag + 4);

    const panShift = (pannerNode && spatialAudioActive) ? pannerNode.pan.value : 0;
    const lag = 8;
    visCtx.beginPath();
    for (let i = 0; i < timeData.length - lag; i++) {
      const a = (timeData[i] - 128) / 128;
      const b = (timeData[i + lag] - 128) / 128;
      const x = cx + (a - b * (1 - panShift * 0.45)) * rad * 0.74;
      const y = cy - (a + b * (1 + panShift * 0.45)) * rad * 0.74;
      if (i === 0) visCtx.moveTo(x, y);
      else visCtx.lineTo(x, y);
    }
    visCtx.strokeStyle = `rgba(${theme.rgb[0]},${theme.rgb[1]},${theme.rgb[2]},0.86)`;
    visCtx.lineWidth = 1.45;
    visCtx.stroke();

    const leftLvl = Math.min(1, subLevel * (1 - Math.max(0, panShift) * 0.45));
    const rightLvl = Math.min(1, (subLevel * 0.65 + midLevel * 0.45) * (1 - Math.max(0, -panShift) * 0.45));
    const railH = h - 30;
    visCtx.fillStyle = 'rgba(255,255,255,0.06)';
    visCtx.fillRect(14, 15, 5, railH);
    visCtx.fillRect(w - 19, 15, 5, railH);
    visCtx.fillStyle = theme.hex;
    visCtx.fillRect(14, 15 + railH * (1 - leftLvl), 5, railH * leftLvl);
    visCtx.fillRect(w - 19, 15 + railH * (1 - rightLvl), 5, railH * rightLvl);
  }

  // ===================================================================
  //  THEMES, ECO GOVERNOR & VIS MODE CONTROLS
  // ===================================================================
  function applyTheme(mode) {
    if (!THEMES[mode]) mode = 'neon';
    themeMode = mode;
    localStorage.setItem('themeMode', mode);
    document.documentElement.classList.remove('theme-yellow', 'theme-blue', 'theme-teal', 'theme-rose');
    if (mode !== 'neon') document.documentElement.classList.add(`theme-${mode}`);

    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', THEMES[mode].bg);

    document.querySelectorAll('.finish-dot').forEach(dot => {
      dot.classList.toggle('active', dot.dataset.theme === mode);
    });

    renderVisualizerFrame(performance.now(), !isPlaying);
    if (currentIndex !== -1 && songFiles[currentIndex]) {
      updateMediaSessionMetadata(formatName(getBaseName(songFiles[currentIndex])));
    }
  }

  function applyEcoMode(enabled, announce = false, persist = true) {
    ecoMode = Boolean(enabled);
    if (persist) localStorage.setItem('ecoMode', String(ecoMode));
    ecoToggle.classList.toggle('eco-on', ecoMode);
    ecoLabel.textContent = ecoMode ? 'ECO 30HZ' : '60HZ';
    if (visRafId) renderStateLabel.textContent = ecoMode ? 'ACTIVE 30HZ' : 'ACTIVE 60HZ';
    resizeVisualizer();
    if (announce) showToast(ecoMode ? 'ECO // 30HZ COOL' : 'PRECISION // 60HZ');
  }

  function applyVisualizerStyle(idx, announce = false) {
    visualizerStyle = ((idx % 4) + 4) % 4;
    localStorage.setItem('visualizerStyle', String(visualizerStyle));
    document.querySelectorAll('.oled-tab').forEach(tab => {
      tab.classList.toggle('active', parseInt(tab.dataset.vis, 10) === visualizerStyle);
    });
    renderVisualizerFrame(performance.now(), !isPlaying);
    if (announce) {
      const names = ['CYMATICS // STANDING WAVE', 'TERRAIN // 3D SPECTRUM', 'SCOPE // TRIGGERED', 'PHASE // GONIOMETER'];
      showToast(names[visualizerStyle]);
    }
  }

  ecoToggle.addEventListener('click', () => applyEcoMode(!ecoMode, true, true));

  document.querySelector('.finish-bank').addEventListener('click', (e) => {
    const dot = e.target.closest('.finish-dot');
    if (!dot) return;
    applyTheme(dot.dataset.theme);
    showToast(`FINISH // ${THEMES[dot.dataset.theme].name.toUpperCase()}`);
  });

  document.querySelector('.oled-mode-tabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.oled-tab');
    if (!tab) return;
    e.stopPropagation();
    applyVisualizerStyle(parseInt(tab.dataset.vis, 10), true);
  });

  // ===================================================================
  //  AUDIO ENGINE & STUDIO DSP
  // ===================================================================
  function getBaseName(filePath) { return filePath.split('/').pop().split('\\').pop(); }
  function formatName(name) { return name.replace(/\.(mp3|m4a|wav|flac|ogg|aac)$/i, '').replace(/[-_]/g, ' ').trim(); }
  function getFileExt(name) { const m = name.match(/\.([a-z0-9]+)$/i); return m ? m[1].toUpperCase() : 'PCM'; }
  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) return '00:00';
    const s = Math.floor(sec);
    return `${Math.floor(s / 60).toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`;
  }
  function encodePath(path) { return path.split('/').map(seg => encodeURIComponent(decodeURIComponent(seg))).join('/'); }
  function isSongDisabled(path) { return disabledSongs.includes(path); }

  function toggleSongState(path) {
    const idx = disabledSongs.indexOf(path);
    if (idx === -1) disabledSongs.push(path);
    else disabledSongs.splice(idx, 1);
    localStorage.setItem('disabledSongs', JSON.stringify(disabledSongs));
    updatePlaylistStats();
  }

  function generateShuffleOrder() {
    shuffleOrder = [...Array(songFiles.length).keys()];
    for (let i = shuffleOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
    }
    if (shuffleOrder[0] === currentIndex && shuffleOrder.length > 1) {
      [shuffleOrder[0], shuffleOrder[1]] = [shuffleOrder[1], shuffleOrder[0]];
    }
    shuffleIndex = 0;
  }

  function getFirstEnabledIndex() {
    for (let i = 0; i < songFiles.length; i++) if (!isSongDisabled(songFiles[i])) return i;
    return 0;
  }
  function getLastEnabledIndex() {
    for (let i = songFiles.length - 1; i >= 0; i--) if (!isSongDisabled(songFiles[i])) return i;
    return 0;
  }

  function getNextIndex() {
    if (songFiles.length === 0 || !songFiles.some(f => !isSongDisabled(f))) return -1;
    let tempIndex = currentIndex;
    let tempShuffleIndex = shuffleIndex;
    for (let i = 0; i < songFiles.length; i++) {
      if (shuffleOn && songFiles.length > 1) {
        tempShuffleIndex++;
        if (tempShuffleIndex >= shuffleOrder.length) {
          if (repeatOn) { generateShuffleOrder(); tempShuffleIndex = 0; }
          else return -1;
        }
        tempIndex = shuffleOrder[tempShuffleIndex];
      } else {
        tempIndex++;
        if (tempIndex >= songFiles.length) {
          if (repeatOn) tempIndex = 0;
          else return -1;
        }
      }
      if (!isSongDisabled(songFiles[tempIndex])) {
        shuffleIndex = tempShuffleIndex;
        return tempIndex;
      }
    }
    return -1;
  }

  function getPrevIndex() {
    if (songFiles.length === 0 || !songFiles.some(f => !isSongDisabled(f))) return -1;
    let tempIndex = currentIndex;
    let tempShuffleIndex = shuffleIndex;
    for (let i = 0; i < songFiles.length; i++) {
      if (shuffleOn && songFiles.length > 1) {
        tempShuffleIndex--;
        if (tempShuffleIndex < 0) {
          if (repeatOn) { generateShuffleOrder(); tempShuffleIndex = shuffleOrder.length - 1; }
          else return currentIndex;
        }
        tempIndex = shuffleOrder[tempShuffleIndex] ?? currentIndex;
      } else {
        tempIndex--;
        if (tempIndex < 0) {
          if (repeatOn) tempIndex = songFiles.length - 1;
          else tempIndex = 0;
        }
      }
      if (!isSongDisabled(songFiles[tempIndex])) {
        shuffleIndex = tempShuffleIndex;
        return tempIndex;
      }
    }
    return currentIndex;
  }

  function setupAudioContext() {
    if (isIOS && iosBackgroundMode) {
      sampleRateReadout.textContent = 'IOS DIRECT';
      return;
    }
    try {
      if (!currentAudioCtx) {
        currentAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (currentAudioCtx.sampleRate) {
        sampleRateReadout.textContent = `${(currentAudioCtx.sampleRate / 1000).toFixed(1)}kHz`;
      }
      if (!source) {
        source = currentAudioCtx.createMediaElementSource(audio);
        analyser = currentAudioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.78;
        bufferLength = analyser.frequencyBinCount;
        freqData = new Uint8Array(bufferLength);
        timeData = new Uint8Array(analyser.fftSize).fill(128);

        bassFilter = currentAudioCtx.createBiquadFilter();
        bassFilter.type = 'lowshelf';
        bassFilter.frequency.value = 150;
        bassFilter.gain.value = bassBoostActive ? 12 : 0;

        airFilter = currentAudioCtx.createBiquadFilter();
        airFilter.type = 'highshelf';
        airFilter.frequency.value = 7500;
        airFilter.gain.value = airBoostActive ? 6 : 0;

        pannerNode = currentAudioCtx.createStereoPanner ? currentAudioCtx.createStereoPanner() : null;
        if (pannerNode) pannerNode.pan.value = 0;

        gainNode = currentAudioCtx.createGain();
        gainNode.gain.value = targetVolume * (bassBoostActive ? 1.55 : 1.15);

        source.connect(bassFilter);
        bassFilter.connect(airFilter);
        if (pannerNode) {
          airFilter.connect(pannerNode);
          pannerNode.connect(gainNode);
        } else {
          airFilter.connect(gainNode);
        }
        gainNode.connect(analyser);
        analyser.connect(currentAudioCtx.destination);
      }
      if (currentAudioCtx.state === 'suspended') {
        currentAudioCtx.resume().catch(() => {});
      }
    } catch (e) {
      analyser = null;
    }
  }

  function applyGainImmediate(vol) {
    if (isIOS && iosBackgroundMode) { audio.volume = 1.0; return; }
    const clamped = Math.max(0, Math.min(1, vol));
    if (gainNode && currentAudioCtx) {
      const mult = bassBoostActive ? 1.55 : 1.15;
      gainNode.gain.cancelScheduledValues(currentAudioCtx.currentTime);
      gainNode.gain.setValueAtTime(clamped * mult, currentAudioCtx.currentTime);
      audio.volume = 1.0;
    } else {
      audio.volume = isIOS ? 1.0 : clamped;
    }
  }

  function fadeAudio(toVolume, durationMs, onComplete) {
    if (fadeRafId) { cancelAnimationFrame(fadeRafId); fadeRafId = null; }
    if (isIOS && iosBackgroundMode) {
      audio.volume = 1.0;
      if (onComplete) onComplete();
      return;
    }
    const mult = bassBoostActive ? 1.55 : 1.15;
    if (gainNode && currentAudioCtx) {
      const now = currentAudioCtx.currentTime;
      gainNode.gain.cancelScheduledValues(now);
      gainNode.gain.setValueAtTime(gainNode.gain.value, now);
      gainNode.gain.linearRampToValueAtTime(Math.max(0, Math.min(1, toVolume)) * mult, now + durationMs / 1000);
      audio.volume = 1.0;
      if (onComplete) {
        const start = performance.now();
        const wait = (ts) => {
          if (ts - start >= durationMs) { fadeRafId = null; onComplete(); }
          else fadeRafId = requestAnimationFrame(wait);
        };
        fadeRafId = requestAnimationFrame(wait);
      }
      return;
    }
    const startVol = isIOS ? 1.0 : audio.volume;
    const startTs = performance.now();
    const step = (ts) => {
      const p = Math.min(1, (ts - startTs) / durationMs);
      audio.volume = isIOS ? 1.0 : Math.max(0, Math.min(1, startVol + (toVolume - startVol) * p));
      if (p < 1) fadeRafId = requestAnimationFrame(step);
      else { fadeRafId = null; if (onComplete) onComplete(); }
    };
    fadeRafId = requestAnimationFrame(step);
  }

  function setPlaybackUI(playing) {
    isPlaying = playing;
    playerEl.classList.toggle('is-playing', playing);
    oledStateEl.textContent = playing ? 'PLAYING' : 'STANDBY';
    playIcon.style.display = playing ? 'none' : 'block';
    pauseIcon.style.display = playing ? 'block' : 'none';
    if (playing) {
      wakeVisualizer();
      wakeSliderSync();
    }
    updateSongListIndicators();
  }

  async function runAudioAction(actionFn) {
    if (isAudioBusy || isSwitchingBgMode) return;
    isAudioBusy = true;
    try { await actionFn(); }
    catch (err) { console.error('Audio action error:', err); }
    finally { setTimeout(() => { isAudioBusy = false; }, 200); }
  }

  function updateTrackNameScroll() {
    trackNameEl.style.animation = 'none';
    trackNameEl.style.transform = 'translate3d(0, 0, 0)';
    trackNameContainer.classList.remove('scrolling');
    void trackNameEl.offsetWidth;
    const cw = trackNameContainer.clientWidth;
    const nw = trackNameEl.scrollWidth;
    if (nw > cw + 2) {
      trackNameContainer.classList.add('scrolling');
      trackNameEl.style.setProperty('--scroll-dist', `-${nw - cw + 12}px`);
      trackNameEl.style.animation = 'marquee 9s ease-in-out 1.2s infinite alternate';
    }
  }

  function preloadNextTrack() {
    const nextIdx = getNextIndex();
    if (nextIdx === -1) return;
    let link = document.getElementById('nextTrackPrefetch');
    if (!link) {
      link = document.createElement('link');
      link.id = 'nextTrackPrefetch';
      link.rel = 'prefetch';
      document.head.appendChild(link);
    }
    link.href = encodePath(songFiles[nextIdx]);
  }

  async function loadTrack(index, autoplay = true) {
    if (index < 0 || index >= songFiles.length) return;
    currentIndex = index;
    localStorage.setItem('lastTrackIndex', String(index));
    if (shuffleOn && shuffleOrder.length > 0) {
      const sIdx = shuffleOrder.indexOf(index);
      if (sIdx !== -1) { shuffleIndex = sIdx; localStorage.setItem('shuffleIndex', String(shuffleIndex)); }
    }

    const file = songFiles[index];
    const base = getBaseName(file);
    const name = formatName(base);

    audio.src = encodePath(file);
    audio.playbackRate = SPEEDS[speedIdx];
    trackNameEl.textContent = name;
    codecBadgeEl.textContent = getFileExt(base);
    trackArtistEl.textContent = autoplay ? 'ACTIVE STREAM' : 'READY';
    trackCounterEl.textContent = `TRK ${String(index + 1).padStart(2, '0')}/${String(songFiles.length).padStart(2, '0')}`;

    progressTargetRatio = 0;
    progressCurrentRatio = 0;
    applyProgressVisual(0);
    progressBuffered.style.transform = 'scaleX(0)';
    currentTimeEl.textContent = '00:00';
    totalTimeEl.textContent = '00:00';

    updateTrackNameScroll();
    updateMediaSessionMetadata(name);
    audio.load();
    setupAudioContext();

    if (autoplay) {
      try {
        if (!(isIOS && iosBackgroundMode) && currentAudioCtx && currentAudioCtx.state === 'suspended') {
          await currentAudioCtx.resume();
        }
        applyGainImmediate(0);
        await audio.play();
        setPlaybackUI(true);
        fadeAudio(targetVolume, 320);
        preloadNextTrack();
      } catch (err) {
        trackArtistEl.textContent = 'TAP PLAY TO START';
        setPlaybackUI(false);
      }
    } else {
      setPlaybackUI(false);
    }
    updateSongListIndicators();
  }

  async function togglePlay() {
    if (songFiles.length === 0) return;
    if (currentIndex === -1) {
      const startIdx = (shuffleOn && shuffleOrder.length > 0) ? shuffleOrder[0] : getFirstEnabledIndex();
      await loadTrack(startIdx, true);
      return;
    }

    if (audio.paused || isFadingOut) {
      isFadingOut = false;
      if (!(isIOS && iosBackgroundMode) && currentAudioCtx && currentAudioCtx.state === 'suspended') {
        await currentAudioCtx.resume();
      }
      try {
        if (audio.paused) {
          applyGainImmediate(0);
          await audio.play();
        }
        setPlaybackUI(true);
        trackArtistEl.textContent = 'ACTIVE STREAM';
        fadeAudio(targetVolume, 300);
      } catch (err) {
        trackArtistEl.textContent = 'TAP PLAY TO START';
        setPlaybackUI(false);
      }
    } else {
      isFadingOut = true;
      fadeAudio(0, 260, () => {
        if (isFadingOut) {
          audio.pause();
          isFadingOut = false;
          trackArtistEl.textContent = 'PAUSED';
          setPlaybackUI(false);
        }
      });
    }
  }

  async function nextTrack() {
    if (songFiles.length === 0) return;
    let next = getNextIndex();
    if (next === -1) next = getFirstEnabledIndex();
    await loadTrack(next, true);
  }

  async function prevTrack() {
    if (songFiles.length === 0) return;
    if (audio.currentTime > 2.5) {
      audio.currentTime = 0;
      wakeSliderSync();
      return;
    }
    let prev = getPrevIndex();
    if (prev === -1 || prev === currentIndex) prev = getLastEnabledIndex();
    await loadTrack(prev, true);
  }

  // ===================================================================
  //  AUDIO LISTENERS & MEDIA SESSION
  // ===================================================================
  let lastPositionSync = 0;

  function updateBufferedBar() {
    if (!audio.duration || !isFinite(audio.duration) || !audio.buffered || audio.buffered.length === 0) return;
    try {
      const end = audio.buffered.end(audio.buffered.length - 1);
      progressBuffered.style.transform = `scaleX(${Math.max(0, Math.min(1, end / audio.duration))})`;
    } catch (e) {}
  }

  function bindAudioListeners() {
    audio.addEventListener('timeupdate', () => {
      if (audio.duration && !isDraggingProgress && !isSeeking) {
        currentTimeEl.textContent = formatTime(audio.currentTime);
        updateBufferedBar();
        const now = performance.now();
        if (now - lastPositionSync > 1000 && 'mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
          lastPositionSync = now;
          try {
            navigator.mediaSession.setPositionState({
              duration: audio.duration,
              playbackRate: audio.playbackRate || 1,
              position: Math.min(audio.currentTime, audio.duration)
            });
          } catch (e) {}
        }
      }
    });
    audio.addEventListener('progress', updateBufferedBar);
    audio.addEventListener('loadedmetadata', () => {
      totalTimeEl.textContent = formatTime(audio.duration);
      updateBufferedBar();
    });
    audio.addEventListener('play', () => {
      if (!isFadingOut && !isPlaying) { setPlaybackUI(true); trackArtistEl.textContent = 'ACTIVE STREAM'; }
    });
    audio.addEventListener('pause', () => {
      if (!isFadingOut && isPlaying && !isSwitchingBgMode) { setPlaybackUI(false); trackArtistEl.textContent = 'PAUSED'; }
    });
    audio.addEventListener('ended', () => {
      if (repeatOn && !shuffleOn) { audio.currentTime = 0; audio.play().catch(() => {}); }
      else runAudioAction(nextTrack);
    });
    audio.addEventListener('error', () => {
      trackArtistEl.textContent = 'STREAM UNAVAILABLE';
      setPlaybackUI(false);
    });
    audio.addEventListener('seeking', () => { isSeeking = true; });
    audio.addEventListener('seeked', () => { setTimeout(() => { isSeeking = false; }, 160); });
  }
  bindAudioListeners();

  const artworkCache = {};
  function getGeneratedArtworkUrl() {
    const key = `${themeMode}-${currentIndex}`;
    if (artworkCache[key]) return artworkCache[key];
    const t = THEMES[themeMode];
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#070709';
    ctx.fillRect(0, 0, 256, 256);
    ctx.strokeStyle = t.hex;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(128, 128, 76, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = t.hex;
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('KINETIC', 128, 118);
    ctx.fillStyle = '#f4f3ef';
    ctx.font = 'bold 42px monospace';
    ctx.fillText(currentIndex >= 0 ? String(currentIndex + 1).padStart(2, '0') : '--', 128, 165);
    const url = c.toDataURL('image/png');
    artworkCache[key] = url;
    return url;
  }

  function updateMediaSessionMetadata(title) {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title,
        artist: 'KINETIC // Acoustic Console',
        album: 'Field Archive',
        artwork: [{ src: getGeneratedArtworkUrl(), sizes: '256x256', type: 'image/png' }]
      });
    } catch (e) {}
  }

  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('play', () => runAudioAction(togglePlay));
    navigator.mediaSession.setActionHandler('pause', () => runAudioAction(togglePlay));
    navigator.mediaSession.setActionHandler('previoustrack', () => runAudioAction(prevTrack));
    navigator.mediaSession.setActionHandler('nexttrack', () => runAudioAction(nextTrack));
  }

  // ===================================================================
  //  GPU-COMPOSITED POINTER SLIDERS (AUTO-SLEEP ON IDLE)
  // ===================================================================
  let progressBarWidth = 320;
  let volumeBarWidth = 240;
  let isDraggingProgress = false;
  let isDraggingVolume = false;
  let progressTargetRatio = 0;
  let progressCurrentRatio = 0;
  let volumeTargetRatio = 0.7;
  let volumeCurrentRatio = 0.7;
  let sliderRafId = null;

  function measureSliders() {
    progressBarWidth = progressBar.clientWidth || 320;
    volumeBarWidth = volumeBar.clientWidth || 240;
    applyProgressVisual(progressCurrentRatio);
    applyVolumeVisual(volumeCurrentRatio);
  }

  function applyProgressVisual(ratio) {
    const r = Math.max(0, Math.min(1, ratio));
    progressFill.style.transform = `scaleX(${r})`;
    const x = r * progressBarWidth;
    progressThumb.style.transform = `translate3d(${x}px, -50%, 0)`;
    if (isDraggingProgress) {
      seekTooltip.style.left = `${Math.max(22, Math.min(progressBarWidth - 22, x))}px`;
    }
  }

  function applyVolumeVisual(ratio) {
    const r = Math.max(0, Math.min(1, ratio));
    volumeFill.style.transform = `scaleX(${r})`;
    volumeThumb.style.transform = `translate3d(${r * volumeBarWidth}px, -50%, 0)`;
  }

  function wakeSliderSync() {
    if (sliderRafId || document.hidden) return;
    sliderRafId = requestAnimationFrame(tickSliders);
  }
  function stopSliderSync() {
    if (sliderRafId) { cancelAnimationFrame(sliderRafId); sliderRafId = null; }
  }

  function tickSliders() {
    sliderRafId = null;
    if (document.hidden) return;
    if (!isDraggingProgress && !isSeeking) {
      progressTargetRatio = (audio.duration && isFinite(audio.duration)) ? audio.currentTime / audio.duration : 0;
    }
    const pDiff = progressTargetRatio - progressCurrentRatio;
    if (Math.abs(pDiff) > 0.0005 || isDraggingProgress) {
      progressCurrentRatio += isDraggingProgress ? pDiff * 0.5 : pDiff * 0.24;
      applyProgressVisual(progressCurrentRatio);
    } else if (progressCurrentRatio !== progressTargetRatio) {
      progressCurrentRatio = progressTargetRatio;
      applyProgressVisual(progressCurrentRatio);
    }

    if (!isDraggingVolume) volumeTargetRatio = targetVolume;
    const vDiff = volumeTargetRatio - volumeCurrentRatio;
    if (Math.abs(vDiff) > 0.001 || isDraggingVolume) {
      volumeCurrentRatio += isDraggingVolume ? vDiff * 0.55 : vDiff * 0.28;
      applyVolumeVisual(volumeCurrentRatio);
    } else if (volumeCurrentRatio !== volumeTargetRatio) {
      volumeCurrentRatio = volumeTargetRatio;
      applyVolumeVisual(volumeCurrentRatio);
    }

    if (pannerNode && spatialAudioActive && isPlaying && !audio.paused) {
      pannerNode.pan.value = Math.sin(performance.now() * 0.0012) * 0.68;
    }

    const needsNext = (isPlaying && !audio.paused) || isDraggingProgress || isDraggingVolume ||
      Math.abs(progressTargetRatio - progressCurrentRatio) > 0.0005 ||
      Math.abs(volumeTargetRatio - volumeCurrentRatio) > 0.001;
    if (needsNext) sliderRafId = requestAnimationFrame(tickSliders);
  }

  function updateProgressFromPointer(clientX) {
    const rect = progressBar.getBoundingClientRect();
    progressBarWidth = rect.width || progressBarWidth;
    const r = Math.max(0, Math.min(1, (clientX - rect.left) / progressBarWidth));
    progressTargetRatio = r;
    seekTooltip.style.left = `${Math.max(22, Math.min(progressBarWidth - 22, r * progressBarWidth))}px`;
    if (audio.duration && isFinite(audio.duration)) {
      const t = formatTime(r * audio.duration);
      currentTimeEl.textContent = t;
      seekTooltip.textContent = t;
    } else {
      seekTooltip.textContent = '00:00';
    }
  }

  progressHitbox.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    isDraggingProgress = true;
    progressHitbox.classList.add('dragging');
    progressHitbox.setPointerCapture(e.pointerId);
    updateProgressFromPointer(e.clientX);
    wakeSliderSync();
  });
  progressHitbox.addEventListener('pointermove', (e) => { if (isDraggingProgress) updateProgressFromPointer(e.clientX); });
  function endProgressDrag() {
    if (!isDraggingProgress) return;
    isDraggingProgress = false;
    progressHitbox.classList.remove('dragging');
    if (audio.duration && isFinite(audio.duration)) {
      isSeeking = true;
      audio.currentTime = progressTargetRatio * audio.duration;
    }
    wakeSliderSync();
  }
  progressHitbox.addEventListener('pointerup', endProgressDrag);
  progressHitbox.addEventListener('pointercancel', endProgressDrag);

  function updateVolumeIcon() {
    const v = targetVolume;
    volPctEl.textContent = `${Math.round(v * 100)}%`;
    if (v <= 0.005) volWave.style.opacity = '0.18';
    else if (v < 0.35) { volWave.setAttribute('d', 'M15.54 8.46a5 5 0 0 1 0 7.07'); volWave.style.opacity = '0.7'; }
    else { volWave.setAttribute('d', 'M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14'); volWave.style.opacity = v < 0.7 ? '0.8' : '1'; }
  }

  function setVolumeRatio(r) {
    targetVolume = Math.max(0, Math.min(1, r));
    if (targetVolume > 0.01) preMuteVolume = targetVolume;
    volumeTargetRatio = targetVolume;
    if (!fadeRafId && !isFadingOut) applyGainImmediate(targetVolume);
    updateVolumeIcon();
    localStorage.setItem('targetVolume', String(targetVolume));
    wakeSliderSync();
  }

  function updateVolumeFromPointer(clientX) {
    const rect = volumeBar.getBoundingClientRect();
    volumeBarWidth = rect.width || volumeBarWidth;
    setVolumeRatio((clientX - rect.left) / volumeBarWidth);
  }
  volumeHitbox.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    isDraggingVolume = true;
    volumeHitbox.classList.add('dragging');
    volumeHitbox.setPointerCapture(e.pointerId);
    updateVolumeFromPointer(e.clientX);
  });
  volumeHitbox.addEventListener('pointermove', (e) => { if (isDraggingVolume) updateVolumeFromPointer(e.clientX); });
  function endVolumeDrag() {
    if (!isDraggingVolume) return;
    isDraggingVolume = false;
    volumeHitbox.classList.remove('dragging');
    wakeSliderSync();
  }
  volumeHitbox.addEventListener('pointerup', endVolumeDrag);
  volumeHitbox.addEventListener('pointercancel', endVolumeDrag);

  muteBtn.addEventListener('click', () => {
    if (targetVolume > 0.01) { preMuteVolume = targetVolume; setVolumeRatio(0); }
    else setVolumeRatio(preMuteVolume > 0.05 ? preMuteVolume : 0.7);
  });

  // ===================================================================
  //  INTERACTIVE ACOUSTIC FIELD TOUCH / CURSOR RESONANCE + SWIPE
  // ===================================================================
  let artTouchStartX = 0;
  let artTouchStartY = 0;
  let artSwiping = false;

  artworkEl.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.oled-tab')) return;
    artTouchStartX = e.clientX;
    artTouchStartY = e.clientY;
    artSwiping = true;
    const rect = visCanvas.getBoundingClientRect();
    probe.x = (e.clientX - rect.left) / (rect.width || 1);
    probe.y = (e.clientY - rect.top) / (rect.height || 1);
    probe.energy = 1;
    if (visualizerStyle === 0) wakeVisualizer();
  });

  artworkEl.addEventListener('pointermove', (e) => {
    if (ecoMode && !artSwiping) return;
    if (visualizerStyle !== 0) return;
    const rect = visCanvas.getBoundingClientRect();
    probe.x = (e.clientX - rect.left) / (rect.width || 1);
    probe.y = (e.clientY - rect.top) / (rect.height || 1);
    probe.energy = Math.min(1, probe.energy + 0.35);
    wakeVisualizer();
  }, { passive: true });

  artworkEl.addEventListener('pointerup', (e) => {
    if (!artSwiping) return;
    artSwiping = false;
    const dx = e.clientX - artTouchStartX;
    const dy = e.clientY - artTouchStartY;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      if (dx < 0) { showToast('NEXT TRACK >>'); runAudioAction(nextTrack); }
      else { showToast('<< PREV TRACK'); runAudioAction(prevTrack); }
    } else if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
      runAudioAction(togglePlay);
    }
  });
  artworkEl.addEventListener('pointercancel', () => { artSwiping = false; });

  // ===================================================================
  //  TRANSPORT, SPEED & DSP SWITCHES
  // ===================================================================
  playBtn.addEventListener('click', () => runAudioAction(togglePlay));
  prevBtn.addEventListener('click', () => runAudioAction(prevTrack));
  nextBtn.addEventListener('click', () => runAudioAction(nextTrack));

  speedBtn.addEventListener('click', () => {
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    const rate = SPEEDS[speedIdx];
    audio.playbackRate = rate;
    speedBtn.textContent = `${rate.toFixed(rate % 1 === 0 ? 1 : 2)}×`;
    speedBtn.classList.toggle('boosted', rate !== 1.0);
    showToast(`SPEED // ${speedBtn.textContent}`);
  });

  shuffleBtn.addEventListener('click', () => {
    shuffleOn = !shuffleOn;
    shuffleBtn.classList.toggle('active', shuffleOn);
    localStorage.setItem('shuffleOn', String(shuffleOn));
    if (shuffleOn && songFiles.length > 0) {
      generateShuffleOrder();
      if (currentIndex !== -1) {
        const sIdx = shuffleOrder.indexOf(currentIndex);
        if (sIdx !== -1) { shuffleIndex = sIdx; localStorage.setItem('shuffleIndex', String(shuffleIndex)); }
      }
    }
    showToast(shuffleOn ? 'SHUFFLE // ON' : 'SHUFFLE // OFF');
  });

  repeatBtn.addEventListener('click', () => {
    repeatOn = !repeatOn;
    repeatBtn.classList.toggle('active', repeatOn);
    localStorage.setItem('repeatOn', String(repeatOn));
    showToast(repeatOn ? 'REPEAT // ON' : 'REPEAT // OFF');
  });

  bassBoostBtn.addEventListener('click', () => {
    bassBoostActive = !bassBoostActive;
    bassBoostBtn.classList.toggle('active', bassBoostActive);
    localStorage.setItem('bassBoostActive', String(bassBoostActive));
    if (bassFilter) bassFilter.gain.value = bassBoostActive ? 12 : 0;
    if (!fadeRafId && !isFadingOut) applyGainImmediate(targetVolume);
    showToast(bassBoostActive ? 'LOWSHELF +12dB // ON' : 'LOWSHELF // BYPASS');
  });

  airBoostBtn.addEventListener('click', () => {
    airBoostActive = !airBoostActive;
    airBoostBtn.classList.toggle('active', airBoostActive);
    localStorage.setItem('airBoostActive', String(airBoostActive));
    if (airFilter) airFilter.gain.value = airBoostActive ? 6 : 0;
    showToast(airBoostActive ? 'HIGHSHELF +6dB // ON' : 'HIGHSHELF // BYPASS');
  });

  spatialBtn.addEventListener('click', () => {
    spatialAudioActive = !spatialAudioActive;
    spatialBtn.classList.toggle('active', spatialAudioActive);
    localStorage.setItem('spatialAudioActive', String(spatialAudioActive));
    if (pannerNode && !spatialAudioActive) pannerNode.pan.value = 0;
    showToast(spatialAudioActive ? '3D PAN // ON' : '3D PAN // BYPASS');
  });

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') {
      if (e.code === 'Escape') { e.target.blur(); closePlaylist(); }
      return;
    }
    if (e.code === 'Escape') closePlaylist();
    else if (e.code === 'Space') { e.preventDefault(); runAudioAction(togglePlay); }
    else if (e.code === 'ArrowLeft') runAudioAction(prevTrack);
    else if (e.code === 'ArrowRight') runAudioAction(nextTrack);
    else if (e.code === 'ArrowUp') { e.preventDefault(); setVolumeRatio(targetVolume + 0.06); }
    else if (e.code === 'ArrowDown') { e.preventDefault(); setVolumeRatio(targetVolume - 0.06); }
    else if (e.code === 'KeyM') muteBtn.click();
    else if (e.code === 'KeyL' || e.key === '/') {
      e.preventDefault();
      if (window.innerWidth >= 920) songSearch.focus();
      else if (modalOverlay.classList.contains('open')) closePlaylist();
      else openPlaylist();
    }
  });

  // ===================================================================
  //  UNIFIED TRACK INDEX MATRIX (DESKTOP INLINE / MOBILE BOTTOM SHEET)
  // ===================================================================
  function updatePlaylistStats() {
    const total = songFiles.length;
    const disabledCount = songFiles.filter(f => isSongDisabled(f)).length;
    const enabledCount = total - disabledCount;
    songCountBadge.textContent = disabledCount > 0 ? `${enabledCount}/${total} ACTIVE` : `${total} TRACKS`;
    playlistStats.textContent = disabledCount > 0 ? `${enabledCount} ACTIVE · ${disabledCount} MUTED` : `${total} FILES READY`;
    enableAllBtn.classList.toggle('visible', disabledCount > 0);
  }

  function createIndicatorNode(idx, trackNum) {
    if (idx === currentIndex) {
      if (isPlaying) {
        const eq = document.createElement('div');
        eq.className = 'eq-container';
        eq.innerHTML = '<div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>';
        return eq;
      }
      const span = document.createElement('span');
      span.textContent = '⏸';
      return span;
    }
    const num = document.createElement('span');
    num.textContent = String(trackNum).padStart(2, '0');
    return num;
  }

  function renderSongList() {
    updatePlaylistStats();
    songListEl.innerHTML = '';
    const frag = document.createDocumentFragment();
    let visibleIndex = 1;

    songFiles.forEach((file, i) => {
      const base = getBaseName(file);
      const name = formatName(base);
      if (searchQuery && !name.toLowerCase().includes(searchQuery)) return;

      const disabled = isSongDisabled(file);
      const trackNum = visibleIndex++;

      const li = document.createElement('li');
      li.className = 'song-item' + (i === currentIndex ? ' active' : '') + (disabled ? ' disabled' : '');
      li.dataset.index = String(i);
      li.dataset.trackNum = String(trackNum);

      const idxSlot = document.createElement('div');
      idxSlot.className = 'idx-slot';
      idxSlot.appendChild(createIndicatorNode(i, trackNum));

      const info = document.createElement('div');
      info.className = 'info';

      const nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = name;

      const metaLine = document.createElement('div');
      metaLine.className = 'meta-line';
      metaLine.textContent = `${getFileExt(base)} // ${disabled ? 'BYPASSED' : 'IN ROTATION'}`;

      info.appendChild(nameEl);
      info.appendChild(metaLine);

      const toggleLabel = document.createElement('label');
      toggleLabel.className = 'song-toggle';
      toggleLabel.addEventListener('click', (e) => e.stopPropagation());

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !disabled;
      checkbox.addEventListener('change', () => {
        toggleSongState(file);
        const nowDisabled = isSongDisabled(file);
        li.classList.toggle('disabled', nowDisabled);
        metaLine.textContent = `${getFileExt(base)} // ${nowDisabled ? 'BYPASSED' : 'IN ROTATION'}`;
      });

      const sliderSpan = document.createElement('span');
      sliderSpan.className = 'slider';
      toggleLabel.appendChild(checkbox);
      toggleLabel.appendChild(sliderSpan);

      li.appendChild(idxSlot);
      li.appendChild(info);
      li.appendChild(toggleLabel);

      li.addEventListener('click', (e) => {
        if (e.target.closest('.song-toggle')) return;
        runAudioAction(async () => {
          if (isSongDisabled(file)) toggleSongState(file);
          await loadTrack(i, true);
          if (window.innerWidth < 920) closePlaylist();
        });
      });
      frag.appendChild(li);
    });

    if (visibleIndex === 1) {
      const empty = document.createElement('li');
      empty.className = 'song-empty';
      empty.textContent = songFiles.length === 0 ? 'NO AUDIO FILES' : 'NO MATCHES';
      frag.appendChild(empty);
    }
    songListEl.appendChild(frag);
  }

  function updateSongListIndicators() {
    updatePlaylistStats();
    songListEl.querySelectorAll('.song-item').forEach(item => {
      const idx = parseInt(item.dataset.index, 10);
      const trackNum = parseInt(item.dataset.trackNum, 10);
      item.classList.toggle('active', idx === currentIndex);
      const slot = item.querySelector('.idx-slot');
      if (slot) { slot.innerHTML = ''; slot.appendChild(createIndicatorNode(idx, trackNum)); }
    });
  }

  function openPlaylist() {
    renderSongList();
    modalOverlay.classList.add('open');
  }

  function closePlaylist() {
    modalOverlay.classList.remove('open');
    if (window.innerWidth < 920) {
      songSearch.value = '';
      searchQuery = '';
      searchClear.style.display = 'none';
    }
  }

  songListBtn.addEventListener('click', openPlaylist);
  modalClose.addEventListener('click', closePlaylist);
  modalOverlay.addEventListener('click', (e) => {
    if (window.innerWidth < 920 && e.target === modalOverlay) closePlaylist();
  });

  enableAllBtn.addEventListener('click', () => {
    disabledSongs = [];
    localStorage.setItem('disabledSongs', '[]');
    renderSongList();
  });

  songSearch.addEventListener('input', (e) => {
    searchQuery = e.target.value.toLowerCase().trim();
    searchClear.style.display = searchQuery ? 'inline-block' : 'none';
    renderSongList();
  });

  searchClear.addEventListener('click', () => {
    songSearch.value = '';
    searchQuery = '';
    searchClear.style.display = 'none';
    renderSongList();
    songSearch.focus();
  });

  let sheetDragY = 0;
  let sheetStartY = 0;
  let isSheetDragging = false;
  const sheetHeaderArea = playlistModal.querySelector('.modal-header');
  const sheetHandle = document.getElementById('sheetHandle');

  [sheetHandle, sheetHeaderArea].forEach(el => {
    el.addEventListener('pointerdown', (e) => {
      if (window.innerWidth >= 920 || e.target.closest('button')) return;
      isSheetDragging = true;
      sheetStartY = e.clientY;
      sheetDragY = 0;
      playlistModal.style.transition = 'none';
    });
  });

  window.addEventListener('pointermove', (e) => {
    if (!isSheetDragging) return;
    sheetDragY = Math.max(0, e.clientY - sheetStartY);
    playlistModal.style.transform = `translate3d(0, ${sheetDragY}px, 0)`;
  }, { passive: true });

  window.addEventListener('pointerup', () => {
    if (!isSheetDragging) return;
    isSheetDragging = false;
    playlistModal.style.transition = '';
    playlistModal.style.transform = '';
    if (sheetDragY > 90) closePlaylist();
  });

  // ===================================================================
  //  iOS BACKGROUND MODE & PERSISTENCE
  // ===================================================================
  async function applyIosBgModeState() {
    if (!isIOS) return;
    isSwitchingBgMode = true;
    const wasPlaying = isPlaying && !audio.paused;
    const curTime = audio.currentTime || 0;
    const curSrc = audio.src;

    try { audio.pause(); } catch (e) {}
    await new Promise(resolve => setTimeout(resolve, 140));

    audio = new Audio();
    bindAudioListeners();
    source = null;
    currentAudioCtx = null;
    gainNode = null;
    bassFilter = null;
    airFilter = null;
    pannerNode = null;

    if (iosBackgroundMode) {
      document.documentElement.classList.add('is-ios-bg-active');
      audio.volume = 1.0;
    } else {
      document.documentElement.classList.remove('is-ios-bg-active');
      audio.volume = targetVolume;
      setupAudioContext();
    }

    if (curSrc) {
      audio.src = curSrc;
      if (curTime > 0) {
        audio.addEventListener('loadedmetadata', () => {
          try { audio.currentTime = curTime; } catch (e) {}
        }, { once: true });
      }
      audio.load();
    }

    await new Promise(resolve => setTimeout(resolve, 120));
    if (wasPlaying && curSrc) {
      try { await audio.play(); setPlaybackUI(true); }
      catch (e) { setPlaybackUI(false); }
    }
    isSwitchingBgMode = false;
  }

  async function verifySongsAvailability() {
    if (disabledSongs.length === 0) return;
    let changed = false;
    await Promise.all(songFiles.map(async (file) => {
      if (!isSongDisabled(file)) return;
      try {
        const res = await fetch(encodePath(file), { method: 'HEAD' });
        if (res.ok || res.status === 206 || res.status === 304) {
          const idx = disabledSongs.indexOf(file);
          if (idx !== -1) { disabledSongs.splice(idx, 1); changed = true; }
        }
      } catch (e) {}
    }));
    if (changed) {
      localStorage.setItem('disabledSongs', JSON.stringify(disabledSongs));
      renderSongList();
    }
  }

  async function restorePlayerState() {
    disabledSongs = disabledSongs.filter(f => songFiles.includes(f));
    if (disabledSongs.length >= songFiles.length && songFiles.length > 0) disabledSongs = [];
    localStorage.setItem('disabledSongs', JSON.stringify(disabledSongs));

    const iosBgCheckbox = document.getElementById('iosBgCheckbox');
    if (iosBgCheckbox) {
      iosBgCheckbox.checked = iosBackgroundMode;
      iosBgCheckbox.addEventListener('change', (e) => {
        iosBackgroundMode = e.target.checked;
        localStorage.setItem('iosBackgroundMode', String(iosBackgroundMode));
        applyIosBgModeState();
      });
    }
    await applyIosBgModeState();

    shuffleOn = localStorage.getItem('shuffleOn') === 'true';
    shuffleBtn.classList.toggle('active', shuffleOn);

    repeatOn = localStorage.getItem('repeatOn') === 'true';
    repeatBtn.classList.toggle('active', repeatOn);

    bassBoostActive = localStorage.getItem('bassBoostActive') === 'true';
    bassBoostBtn.classList.toggle('active', bassBoostActive);

    airBoostActive = localStorage.getItem('airBoostActive') === 'true';
    airBoostBtn.classList.toggle('active', airBoostActive);

    spatialAudioActive = localStorage.getItem('spatialAudioActive') === 'true';
    spatialBtn.classList.toggle('active', spatialAudioActive);

    targetVolume = Math.max(0, Math.min(1, parseFloat(localStorage.getItem('targetVolume') || '0.7')));
    preMuteVolume = targetVolume > 0.05 ? targetVolume : 0.7;
    volumeTargetRatio = targetVolume;
    volumeCurrentRatio = targetVolume;
    applyGainImmediate(targetVolume);
    updateVolumeIcon();
    applyVolumeVisual(targetVolume);

    if (shuffleOn && songFiles.length > 0) {
      generateShuffleOrder();
      const savedShuffleIndex = parseInt(localStorage.getItem('shuffleIndex') || '0', 10);
      if (!isNaN(savedShuffleIndex)) shuffleIndex = savedShuffleIndex;
    }

    const lastIndex = parseInt(localStorage.getItem('lastTrackIndex') || '-1', 10);
    const lastTime = parseFloat(localStorage.getItem('lastTrackTime') || '0');

    if (lastIndex >= 0 && lastIndex < songFiles.length) {
      await loadTrack(lastIndex, false);
      if (isFinite(lastTime) && lastTime > 0) {
        audio.addEventListener('loadedmetadata', () => {
          try {
            audio.currentTime = Math.min(lastTime, audio.duration || lastTime);
            currentTimeEl.textContent = formatTime(audio.currentTime);
            progressTargetRatio = audio.duration ? audio.currentTime / audio.duration : 0;
            progressCurrentRatio = progressTargetRatio;
            applyProgressVisual(progressCurrentRatio);
          } catch (e) {}
        }, { once: true });
      }
    } else if (songFiles.length > 0) {
      await loadTrack(0, false);
    }
  }

  async function loadMusicFiles() {
    const exts = ['mp3', 'm4a', 'wav', 'flac', 'ogg', 'aac'];
    let loaded = false;

    try {
      const r = await fetch('music.json?t=' + Date.now());
      if (r.ok) {
        const files = await r.json();
        if (Array.isArray(files) && files.length > 0) { songFiles = files; loaded = true; }
      }
    } catch (e) {}

    if (!loaded) {
      try {
        const r = await fetch('./');
        if (r.ok) {
          const html = await r.text();
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const files = [];
          doc.querySelectorAll('a').forEach(a => {
            const h = a.getAttribute('href');
            if (h && exts.some(ext => h.toLowerCase().endsWith('.' + ext))) files.push(decodeURIComponent(h));
          });
          if (files.length > 0) { songFiles = files; loaded = true; }
        }
      } catch (e) {}
    }

    if (!loaded) {
      songFiles = [
        '1.m4a', '2.m4a', '4.m4a', '5.m4a', '6.mp3', '7.mp3',
        '8.mp3', '9.mp3', '10.mp3', '11.mp3', '12.m4a', '13.m4a',
        '14.m4a', '15.mp3', '16.m4a', '17.m4a'
      ];
    }

    renderSongList();
    await restorePlayerState();
    verifySongsAvailability();
  }

  // ===================================================================
  //  LIFECYCLE, VISIBILITY & RESIZE HOOKS
  // ===================================================================
  function savePlaybackCheckpoint() {
    if (currentIndex >= 0) {
      localStorage.setItem('lastTrackIndex', String(currentIndex));
      localStorage.setItem('lastTrackTime', String(audio.currentTime || 0));
      localStorage.setItem('shuffleIndex', String(shuffleIndex));
    }
  }
  window.addEventListener('pagehide', savePlaybackCheckpoint);
  window.addEventListener('beforeunload', savePlaybackCheckpoint);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      savePlaybackCheckpoint();
      stopVisualizer();
      stopSliderSync();
    } else {
      if (currentAudioCtx && currentAudioCtx.state === 'suspended' && isPlaying) {
        currentAudioCtx.resume().catch(() => {});
      }
      if (isPlaying && !audio.paused) {
        wakeVisualizer();
        wakeSliderSync();
      } else {
        renderVisualizerFrame(performance.now(), true);
      }
    }
  });

  if ('ResizeObserver' in window) {
    const layoutObserver = new ResizeObserver(() => {
      measureSliders();
      resizeVisualizer();
    });
    layoutObserver.observe(progressBar);
    layoutObserver.observe(volumeBar);
    layoutObserver.observe(visCanvas);
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (localStorage.getItem('ecoMode') === null) {
        const shouldEco = window.innerWidth <= 919 || isMobileDevice || prefersReducedMotion;
        if (shouldEco !== ecoMode) applyEcoMode(shouldEco, false, false);
      }
      resizeVisualizer();
      measureSliders();
      updateTrackNameScroll();
    }, 60);
  });

  // Boot
  applyTheme(themeMode);
  applyVisualizerStyle(visualizerStyle, false);
  applyEcoMode(ecoMode, false, false);
  measureSliders();
  loadMusicFiles();
})();
</script>
</body>
</html>
